# Measured accuracy of the heuristic resolver, per language.
#
# Produced by the `beholder-oracle` crate. Methodology, the exclusion set, the
# fan-in-level measurements and the error classes are in
# `docs/resolver-accuracy.md`.
#
# These are per-corpus calibration, not per-edge confidence. The spread between
# repositories is structural — it tracks how much a codebase leans on traits and
# generic containers — so a range is reported rather than a single number that
# would read as a probability for any given edge. Per-edge, what beholder can
# actually say is the `confidence` field, which records whether the source
# stated where a reference points.
#
# A language absent from this table reports no error bar rather than a guess.

[rust]
measured_against = "rust-analyzer scip 1.97.1"
precision_min = 0.788
precision_max = 0.871
recall_min = 0.874
recall_max = 0.969

