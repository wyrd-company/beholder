  - {distribution: geometry, entity: geometry.shapes.Circle, paths: ['geometry::shapes::Circle'], access: all}
  - {distribution: geometry, entity: geometry.shapes.Circle.radius, paths: ['geometry::shapes::Circle::radius'], access: all}
  - distribution: geometry
    entity: geometry.detail.Grid
    paths: ['geometry::Lattice']
    access: all
    contexts: [build-extras]
  - {distribution: geometry, entity: geometry.Scale, paths: ['geometry::Scale'], access: all}
