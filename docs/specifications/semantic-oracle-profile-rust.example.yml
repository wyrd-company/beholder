      invocation: {path: src/lib.rs, start: [21, 1], end: [21, 7], text: marker}
    - entity: geometry.Registry
      macro: geometry.marker
      invocation: {path: src/lib.rs, start: [22, 1], end: [22, 7], text: marker}
