# ---
# relationships:
#   references: semantic-oracle-profile-dart
# ---
#
# Datasets that the `dart/1` schema rejects for one named reason each: values
# and members this profile does not define. Each case applies `patch`, a JSON
# Patch (RFC 6902), to the valid example `base`. The result fails, every
# error lies at or under `fails-at`, and one error comes from the schema
# keyword `keyword`.
cases:
  - name: unknown-platform
    reason: A Dart platform is `vm`, `js` or `wasm`.
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/platform, value: node}]
    fails-at: /contexts/0/parameters/platform
    keyword: enum
  - name: entry-not-canonical
    reason: The entry is `analysis` or a canonical path.
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/entry, value: ./bin/atlas.dart}]
    fails-at: /contexts/0/parameters/entry
    keyword: anyOf
  - name: unknown-unit-kind
    reason: A Dart unit has kind `library`; part files belong to their library.
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: replace, path: /units/1/kind, value: part}]
    fails-at: /units/1/kind
    keyword: const
  - name: unit-without-language-version
    reason: A Dart unit carries `language-version`.
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: remove, path: /units/1/language-version}]
    fails-at: /units/1
    keyword: required
  - name: unknown-language-kind
    reason: '`abstract-class` is not a Dart language kind; class modifiers keep `class`.'
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: replace, path: /entities/2/language-kind, value: abstract-class}]
    fails-at: /entities/2/language-kind
    keyword: anyOf
  - name: unknown-declared-visibility
    reason: '`private` is not a Dart declared visibility value.'
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: replace, path: /entities/14/declared-visibility/value, value: private}]
    fails-at: /entities/14/declared-visibility
    keyword: anyOf
  - name: project-merged-entity
    reason: The Dart profile defines no project-merged kind.
    base: semantic-oracle-profile-dart.example.yml
    patch:
      - {op: remove, path: /entities/2/unit}
      - {op: add, path: /entities/2/units, value: [shapes-lib]}
    fails-at: /entities/2/units
    keyword: falseSchema
  - name: synthetic-without-anchor
    reason: A synthetic Dart entity is anchored.
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: remove, path: /entities/18/anchor}]
    fails-at: /entities/18
    keyword: required
  - name: role-the-profile-does-not-use
    reason: The Dart profile assigns no occurrence the role `macro-invocation`.
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: replace, path: /references/7/role, value: macro-invocation}]
    fails-at: /references/7/role
    keyword: enum
  - name: unknown-visibility-annotation
    reason: '`deprecated` is not a `dart:visibility-annotation` annotation.'
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: replace, path: /extensions/dart:visibility-annotation/0/annotation, value: deprecated}]
    fails-at: /extensions/dart:visibility-annotation/0/annotation
    keyword: enum
  - name: deferred-import-without-prefix
    reason: A `dart:deferred-import` fact names its prefix.
    base: semantic-oracle-profile-dart.example.yml
    patch: [{op: remove, path: /extensions/dart:deferred-import/0/prefix}]
    fails-at: /extensions/dart:deferred-import/0
    keyword: required
  - name: mixin-application-with-site
    reason: A `dart:mixin-application` fact has only `relation`.
    base: semantic-oracle-profile-dart.example.yml
    patch:
      - op: add
        path: /extensions/dart:mixin-application/0/at
        value: {path: lib/src/shapes.dart, start: [13, 33], end: [13, 40], text: Labeled}
    fails-at: /extensions/dart:mixin-application/0
    keyword: unevaluatedProperties
