# ---
# relationships:
#   implements: semantic-oracle-profile-dart
#   references: semantic-oracle-model
# ---
#
# Dataset schema for profile `dart/1` of semantic-oracle model version 1.
#
# This schema applies the shared record structure of the model schema and
# adds the Dart vocabulary only. A context-variant attribute holds either one
# value or a list of `{contexts, value}` entries; each value set below is
# written once as a YAML anchor and applied to both forms.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/beholder/schemas/semantic-oracle/1/dart/1
title: Semantic-oracle dataset, profile dart/1
$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/dataset'
properties:
  profile: {const: dart/1}
  project: {properties: {language: {const: dart}}}
  contexts: {items: {properties: {parameters: {$ref: '#/$defs/context-parameters'}}}}
  units: {items: {$ref: '#/$defs/unit'}}
  distributions: {items: {properties: {kind: {const: pub-package}}}}
  entities: {items: {$ref: '#/$defs/entity'}}
  externals: {items: {$ref: '#/$defs/kind-and-language-kind'}}
  references:
    items:
      properties:
        role:
          enum: [import, export, qualifier, call, construct, type, read, write, read-write, pattern, attribute]
        disposition: {enum: [resolved, external, indeterminate]}
  relations:
    items:
      properties:
        kind: {enum: [inherits, implements, overrides, aliases, exports]}
        # The profile gives export bindings no visibility.
        visibility: false
  extensions: {$ref: '#/$defs/extensions'}

$defs:
  text: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/text'}
  id: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/id'}
  canonical-path: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/canonical-path'}
  context-variant-list: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/context-variant-list'}
  extension-fact: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/extension-fact'}
  text-list: {type: array, uniqueItems: true, items: {$ref: '#/$defs/text'}}

  context-parameters:
    type: object
    required: [platform, entry, defines, library-flags, options]
    additionalProperties: false
    properties:
      platform: {enum: [vm, js, wasm]}
      entry:
        anyOf:
          - const: analysis
          - $ref: '#/$defs/canonical-path'
      defines: {$ref: '#/$defs/text-list'}
      library-flags: {$ref: '#/$defs/text-list'}
      options: {$ref: '#/$defs/text-list'}

  unit:
    $ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/unit'
    required: [language-version]
    properties:
      kind: {const: library}
      language-version:
        anyOf:
          - $ref: '#/$defs/text'
          - $ref: '#/$defs/context-variant-list'
            items: {properties: {value: {$ref: '#/$defs/text'}}}
    unevaluatedProperties: false

  entity:
    properties:
      units: false
      declared-visibility: {$ref: '#/$defs/declared-visibility'}
    $ref: '#/$defs/kind-and-language-kind'
    allOf:
      # Every synthetic entity is anchored.
      - if: {properties: {origin: {const: synthetic}}}
        then: {required: [anchor]}

  kind-and-language-kind:
    allOf:
      - if: {properties: {kind: {const: module}}}
        then: {properties: {language-kind: {anyOf: [{enum: &module [library]}, {type: array, items: {properties: {value: {enum: *module}}}}]}}}
      - if: {properties: {kind: {const: type}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type [class, mixin, mixin-class, enum, extension-type]}, {type: array, items: {properties: {value: {enum: *type}}}}]}}}
      - if: {properties: {kind: {const: extension}}}
        then: {properties: {language-kind: {anyOf: [{enum: &extension [extension]}, {type: array, items: {properties: {value: {enum: *extension}}}}]}}}
      - if: {properties: {kind: {const: type-alias}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-alias [typedef]}, {type: array, items: {properties: {value: {enum: *type-alias}}}}]}}}
      - if: {properties: {kind: {const: callable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &callable [function, method, operator, constructor, factory]}, {type: array, items: {properties: {value: {enum: *callable}}}}]}}}
      - if: {properties: {kind: {const: field}}}
        then: {properties: {language-kind: {anyOf: [{enum: &field [field]}, {type: array, items: {properties: {value: {enum: *field}}}}]}}}
      - if: {properties: {kind: {const: property}}}
        then: {properties: {language-kind: {anyOf: [{enum: &property [accessor]}, {type: array, items: {properties: {value: {enum: *property}}}}]}}}
      - if: {properties: {kind: {const: variable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &variable [variable, final, late]}, {type: array, items: {properties: {value: {enum: *variable}}}}]}}}
      - if: {properties: {kind: {const: constant}}}
        then: {properties: {language-kind: {anyOf: [{enum: &constant [const]}, {type: array, items: {properties: {value: {enum: *constant}}}}]}}}
      - if: {properties: {kind: {const: enum-member}}}
        then: {properties: {language-kind: {anyOf: [{enum: &enum-member [enum-value]}, {type: array, items: {properties: {value: {enum: *enum-member}}}}]}}}
      - if: {properties: {kind: {const: parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &parameter [param]}, {type: array, items: {properties: {value: {enum: *parameter}}}}]}}}
      - if: {properties: {kind: {const: type-parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-parameter [type-param]}, {type: array, items: {properties: {value: {enum: *type-parameter}}}}]}}}
      - properties:
          kind:
            enum: [module, type, extension, type-alias, callable, field, property, variable, constant, enum-member, parameter, type-parameter]

  declared-visibility-value:
    type: object
    properties:
      value: {enum: [public, library-private]}
      explicit: {const: true}

  declared-visibility:
    anyOf:
      - $ref: '#/$defs/declared-visibility-value'
      - type: array
        items: {properties: {value: {$ref: '#/$defs/declared-visibility-value'}}}

  extensions:
    type: object
    additionalProperties: false
    properties:
      dart:visibility-annotation:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [entity, annotation]
          properties:
            entity: {$ref: '#/$defs/id'}
            annotation: {enum: [protected, visibleForTesting, visibleForOverriding, internal, nonVirtual]}
          unevaluatedProperties: false
      dart:mixin-application:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [relation]
          properties:
            relation: {$ref: '#/$defs/id'}
          unevaluatedProperties: false
      dart:deferred-import:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [unit, prefix, library]
          properties:
            unit: {$ref: '#/$defs/id'}
            prefix: {$ref: '#/$defs/text'}
            library: {$ref: '#/$defs/id'}
          unevaluatedProperties: false
