    - entity: geometry.Meters
      type: float64
    - entity: geometry.Pair
      type-parameters:
        - {name: T, kind: type, bounds: any}
      underlying: "struct { Left T; Right T }"
    - entity: geometry.Pi
      type: untyped float
      value: 314159/100000
    - entity: geometry.Shape.Area
      returns: float64
    - entity: geometry.Solid
      bases:
        - {type: "@{geometry.Shape}"}
      underlying: "interface { @{geometry.Shape} }"
    - entity: geometry.Table
      type: {inferred: "map[string]int"}

extensions:
  go:embeds:
    - struct: geometry.Circle
      field: geometry.Circle.Base
      type: geometry.Base
  go:pointer-receiver:
    - type: geometry.Circle
      interface: geometry.Shape
  go:linkname:
    - entity: geometry.nanotime
      target: ext.runtime.nanotime
      at: {path: shapes.go, start: [30, 1], end: [30, 33], text: '//go:linkname nanotime runtime.nanotime'}
  go:embed-files:
    - variable: geometry.shapeData
      patterns: [shapes.txt]
      documents: [shapes.txt]
