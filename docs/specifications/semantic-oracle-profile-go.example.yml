#
# A valid `go/1` dataset for a generic module `example.com/geometry` with a
# library package, an external test package and a command. It exercises
# every Go record form and extension of the schema. Locators and digests
# describe notional source; schema validation does not read documents.
#
# Its signatures state its members. A signature form that no member here needs
# is covered by the invalid examples and the crate's schema tests.
