# ---
# relationships:
#   implements: semantic-oracle-model
# ---
#
# Dataset schema for semantic-oracle model version 1.
#
# The root validates any dataset: it applies the shared record structure in
# `$defs/dataset` and then the schema of the profile the dataset names. Each
# profile schema references `$defs` here and adds only its vocabulary, so a
# structural rule lives here once and a profile value lives in its profile
# schema once.
#
# Records that a profile extends (units, context parameters, extension facts)
# stay open here and are closed by the profile schema. Every other record is
# closed here.
#
# What this schema does not check: that a referenced id exists or names a
# record of the right kind, that ids are unique, that context lists of a
# context-variant attribute partition the record's contexts, that a start
# position precedes its end, that a locator matches its document, that a list
# described as sorted is sorted, and every consistency and audit rule of the
# model and profiles. The dataset validator owns those checks.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/beholder/schemas/semantic-oracle/1
title: Semantic-oracle dataset, model version 1
$ref: '#/$defs/dataset'
properties:
  profile:
    enum: [csharp/1, dart/1, go/1, python/1, rust/1, typescript/1]
allOf:
  - if: {properties: {profile: {const: csharp/1}}, required: [profile]}
    then: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1/csharp/1'}
  - if: {properties: {profile: {const: dart/1}}, required: [profile]}
    then: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1/dart/1'}
  - if: {properties: {profile: {const: go/1}}, required: [profile]}
    then: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1/go/1'}
  - if: {properties: {profile: {const: python/1}}, required: [profile]}
    then: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1/python/1'}
  - if: {properties: {profile: {const: rust/1}}, required: [profile]}
    then: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1/rust/1'}
  - if: {properties: {profile: {const: typescript/1}}, required: [profile]}
    then: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1/typescript/1'}

$defs:
  # ---------------------------------------------------------------- dataset
  dataset:
    type: object
    required:
      - model
      - profile
      - project
      - authoring
      - documents
      - contexts
      - distributions
      - units
      - entities
      - externals
      - references
      - relations
      - public-api
      - extensions
    additionalProperties: false
    properties:
      model: {const: semantic-oracle/1}
      profile: {type: string, pattern: '^[a-z]+/[0-9]+$'}
      project:
        type: object
        required: [language, name]
        additionalProperties: false
        properties:
          language: {type: string, minLength: 1}
          name: {type: string, minLength: 1}
      authoring:
        type: object
        required: [notes, tools]
        additionalProperties: false
        properties:
          notes: {type: string, minLength: 1}
          tools:
            type: array
            minItems: 1
            items:
              type: object
              required: [name, version]
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1}
                version: {type: string, minLength: 1}
      documents: {type: array, minItems: 1, items: {$ref: '#/$defs/document'}}
      contexts: {type: array, minItems: 1, items: {$ref: '#/$defs/context'}}
      distributions: {type: array, items: {$ref: '#/$defs/distribution'}}
      units: {type: array, minItems: 1, items: {$ref: '#/$defs/unit'}}
      entities: {type: array, items: {$ref: '#/$defs/entity'}}
      externals: {type: array, items: {$ref: '#/$defs/external'}}
      references: {type: array, items: {$ref: '#/$defs/reference'}}
      relations: {type: array, items: {$ref: '#/$defs/relation'}}
      public-api: {type: array, items: {$ref: '#/$defs/public-api-membership'}}
      extensions: {$ref: '#/$defs/extensions'}

  # --------------------------------------------------------------- scalars
  id:
    description: >-
      Case-sensitive ASCII letters, digits and `_ . : # -`, at most 200
      characters.
    type: string
    pattern: '^[A-Za-z0-9_.:#-]{1,200}$'

  id-list:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: '#/$defs/id'}

  context-list:
    description: A non-empty list of context ids.
    $ref: '#/$defs/id-list'

  canonical-path:
    description: >-
      `/`-separated, relative to the project root, no `.` or `..` segment, no
      empty segment, no leading or trailing `/`.
    type: string
    pattern: '^(?:[^/.][^/]*|\.[^/.][^/]*|\.\.[^/]+)(?:/(?:[^/.][^/]*|\.[^/.][^/]*|\.\.[^/]+))*$'

  sha256:
    type: string
    pattern: '^[0-9a-f]{64}$'

  text:
    type: string
    minLength: 1

  # --------------------------------------------------------------- locators
  position:
    description: '[line, column], both counted from 1.'
    type: array
    prefixItems:
      - {type: integer, minimum: 1}
      - {type: integer, minimum: 1}
    minItems: 2
    maxItems: 2

  locator:
    type: object
    required: [path, start, end, text]
    additionalProperties: false
    properties:
      path: {$ref: '#/$defs/canonical-path'}
      start: {$ref: '#/$defs/position'}
      end: {$ref: '#/$defs/position'}
      text: {type: string}

  # ------------------------------------------------------ context variance
  context-variant-list:
    description: >-
      The list form of a context-variant attribute: `{contexts, value}`
      entries. The schema that uses it constrains `value`.
    type: array
    minItems: 1
    items:
      type: object
      required: [contexts, value]
      additionalProperties: false
      properties:
        contexts: {$ref: '#/$defs/context-list'}
        value: true

  # -------------------------------------------------------------- documents
  document:
    type: object
    required: [path, sha256, disposition]
    additionalProperties: false
    properties:
      path: {$ref: '#/$defs/canonical-path'}
      sha256: {$ref: '#/$defs/sha256'}
      disposition:
        enum: [indexed, inactive, configuration, external, out-of-profile]
      reason: {$ref: '#/$defs/text'}
      origin: {enum: [source, generated]}
      members:
        type: array
        minItems: 1
        items:
          type: object
          required: [unit]
          additionalProperties: false
          properties:
            unit: {$ref: '#/$defs/id'}
            contexts: {$ref: '#/$defs/context-list'}
    allOf:
      - if: {properties: {disposition: {const: indexed}}}
        then: {required: [origin, members]}
        else: {properties: {origin: false, members: false}}
      - if: {properties: {disposition: {enum: [inactive, external, out-of-profile]}}}
        then: {required: [reason]}

  # --------------------------------------------------------------- contexts
  context:
    type: object
    required: [id, parameters, command]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/id'}
      parameters: {type: object}
      command: {$ref: '#/$defs/text'}

  # ------------------------------------------------ units and distributions
  unit:
    description: Open here; each profile adds its unit attributes and closes it.
    type: object
    required: [id, kind, name]
    properties:
      id: {$ref: '#/$defs/id'}
      kind: {type: string, minLength: 1}
      name: {$ref: '#/$defs/text'}
      distribution: {$ref: '#/$defs/id'}
      root: {$ref: '#/$defs/id'}
      contexts: {$ref: '#/$defs/context-list'}

  distribution:
    type: object
    required: [id, kind, name]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/id'}
      kind: {type: string, minLength: 1}
      name: {$ref: '#/$defs/text'}
      version: {$ref: '#/$defs/text'}

  # --------------------------------------------------------------- entities
  entity-kind:
    enum:
      - module
      - namespace
      - type
      - type-alias
      - extension
      - callable
      - field
      - property
      - variable
      - constant
      - enum-member
      - macro
      - parameter
      - type-parameter

  language-kind-value: {type: string, minLength: 1}

  language-kind:
    anyOf:
      - $ref: '#/$defs/language-kind-value'
      - $ref: '#/$defs/context-variant-list'
        items: {properties: {value: {$ref: '#/$defs/language-kind-value'}}}

  definition:
    type: object
    required: [at]
    additionalProperties: false
    properties:
      at: {$ref: '#/$defs/locator'}

  entity:
    type: object
    required: [id, kind, language-kind, path, origin, definitions]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/id'}
      kind: {$ref: '#/$defs/entity-kind'}
      language-kind: {$ref: '#/$defs/language-kind'}
      name: {$ref: '#/$defs/text'}
      path: {$ref: '#/$defs/text'}
      unit: {$ref: '#/$defs/id'}
      units: {$ref: '#/$defs/id-list'}
      parent: {$ref: '#/$defs/id'}
      origin: {enum: [source, generated, synthetic]}
      definitions: {type: array, items: {$ref: '#/$defs/definition'}}
      anchor: {$ref: '#/$defs/locator'}
      generated-by:
        type: object
        required: [generator, at]
        additionalProperties: false
        properties:
          generator: {$ref: '#/$defs/text'}
          at: {$ref: '#/$defs/locator'}
      contexts: {$ref: '#/$defs/context-list'}
      declared-visibility: {$ref: '#/$defs/declared-visibility'}
      effective-visibility: {$ref: '#/$defs/effective-visibility'}
    oneOf:
      - required: [unit]
      - required: [units]
    allOf:
      # Visibility is required for every entity except parameters and type
      # parameters, and is outside the required categories for those.
      - if: {properties: {kind: {enum: [parameter, type-parameter]}}}
        then: {properties: {declared-visibility: false, effective-visibility: false}}
        else: {required: [declared-visibility, effective-visibility]}
      # `anchor` is for an entity with no definition site.
      - if: {properties: {definitions: {minItems: 1}}}
        then: {properties: {anchor: false}}
      # `generated-by` is for generated entities. Whether a generated entity
      # without definition sites needs `anchor` and `generated-by` depends on
      # whether its code is an indexed document, which the validator checks.
      - if: {properties: {origin: {const: generated}}}
        else: {properties: {generated-by: false}}
      - if: {properties: {origin: {const: synthetic}}}
        then: {properties: {definitions: {maxItems: 0}}}

  external:
    type: object
    required: [id, kind, language-kind, distribution, path]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/id'}
      kind: {$ref: '#/$defs/entity-kind'}
      language-kind: {$ref: '#/$defs/language-kind-value'}
      distribution: {$ref: '#/$defs/text'}
      version: {$ref: '#/$defs/text'}
      path: {$ref: '#/$defs/text'}

  # ------------------------------------------------------------- visibility
  declared-visibility-value:
    type: object
    required: [value, explicit]
    additionalProperties: false
    properties:
      value: {$ref: '#/$defs/text'}
      explicit: {type: boolean}

  declared-visibility:
    anyOf:
      - $ref: '#/$defs/declared-visibility-value'
      - $ref: '#/$defs/context-variant-list'
        items: {properties: {value: {$ref: '#/$defs/declared-visibility-value'}}}

  scope-member:
    description: An entity id, a unit id or a canonical document path.
    anyOf:
      - $ref: '#/$defs/id'
      - $ref: '#/$defs/canonical-path'

  access:
    oneOf:
      - enum: [all, none, subtypes]
      - type: object
        required: [access, scope]
        additionalProperties: false
        properties:
          access: {const: scoped}
          scope: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/scope-member'}}
      - type: object
        required: [access, within]
        additionalProperties: false
        properties:
          access: {const: subtypes}
          within: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/scope-member'}}

  boundary-access:
    description: One access value, or a list of two or more for a compound rule.
    anyOf:
      - $ref: '#/$defs/access'
      - type: array
        minItems: 2
        uniqueItems: true
        items: {$ref: '#/$defs/access'}

  effective-visibility-value:
    type: object
    required: [unit, project, external]
    additionalProperties: false
    properties:
      unit: {$ref: '#/$defs/boundary-access'}
      project: {$ref: '#/$defs/boundary-access'}
      external: {$ref: '#/$defs/boundary-access'}

  effective-visibility:
    anyOf:
      - $ref: '#/$defs/effective-visibility-value'
      - $ref: '#/$defs/context-variant-list'
        items: {properties: {value: {$ref: '#/$defs/effective-visibility-value'}}}

  # ------------------------------------------------------------- references
  role:
    enum:
      - call
      - construct
      - read
      - write
      - read-write
      - type
      - pattern
      - import
      - export
      - qualifier
      - attribute
      - macro-invocation

  reference:
    type: object
    required: [at, from, role]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/id'}
      at: {$ref: '#/$defs/locator'}
      from: {$ref: '#/$defs/id'}
      target: {$ref: '#/$defs/id'}
      disposition:
        enum: [resolved, external, candidates, nonexistent, indeterminate]
      candidates:
        type: array
        minItems: 2
        uniqueItems: true
        items: {$ref: '#/$defs/id'}
      reason: {$ref: '#/$defs/text'}
      role: {$ref: '#/$defs/role'}
      basis: {enum: [static, dynamic]}
      contexts: {$ref: '#/$defs/context-list'}
    allOf:
      # An omitted disposition is `resolved` or `external` by its target.
      - if: {not: {required: [disposition]}}
        then:
          required: [target]
          properties: {candidates: false, reason: false}
      - if: {properties: {disposition: {enum: [resolved, external]}}, required: [disposition]}
        then:
          required: [target]
          properties: {candidates: false, reason: false}
      - if: {properties: {disposition: {const: candidates}}, required: [disposition]}
        then:
          required: [candidates, reason]
          properties: {target: false}
      - if: {properties: {disposition: {enum: [nonexistent, indeterminate]}}, required: [disposition]}
        then:
          required: [reason]
          properties: {target: false, candidates: false}

  # -------------------------------------------------------------- relations
  relation-kind:
    enum: [inherits, implements, overrides, aliases, exports]

  relation:
    type: object
    required: [kind, from, to]
    additionalProperties: false
    properties:
      id: {$ref: '#/$defs/id'}
      kind: {$ref: '#/$defs/relation-kind'}
      from: {$ref: '#/$defs/id'}
      to: {$ref: '#/$defs/id'}
      at: {$ref: '#/$defs/locator'}
      name: {$ref: '#/$defs/text'}
      contexts: {$ref: '#/$defs/context-list'}
    if: {properties: {kind: {const: exports}}}
    then: {required: [name]}
    else: {properties: {name: false}}

  # ------------------------------------------------------------- public API
  public-api-membership:
    type: object
    required: [distribution, entity, paths, access]
    additionalProperties: false
    properties:
      distribution: {$ref: '#/$defs/id'}
      entity: {$ref: '#/$defs/id'}
      paths:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/text'}
      access: {enum: [all, subtypes]}
      contexts: {$ref: '#/$defs/context-list'}

  # ------------------------------------------------------------- extensions
  extensions:
    description: >-
      Extension facts grouped by kind `<language>:<name>`. Each profile
      schema names its kinds, defines their members and closes this object.
    type: object
    propertyNames:
      pattern: '^[a-z]+:[a-z]+(-[a-z]+)*$'
    additionalProperties:
      type: array
      items: {type: object}

  extension-fact:
    description: >-
      Members every extension fact may carry. A profile schema references
      this, adds the extension's members and closes the fact.
    type: object
    properties:
      contexts: {$ref: '#/$defs/context-list'}
