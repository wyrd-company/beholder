description: |
  # Python semantic-oracle profile, `python/1`

  This profile applies `semantic-oracle-model` version 1 to Python. It
  defines only Python mappings and Python extensions.

  ## Primary sources

  - The Python Language Reference: Execution model (naming and binding,
    resolution of names), The import system, Simple statements (`import`,
    `global`, `nonlocal`), Compound statements (class and function
    definitions), Data model (private name mangling, descriptors, `__slots__`).
    <https://docs.python.org/3/reference/>
  - `importlib`, `sys.path`, `site` and `.pth` documentation.
    <https://docs.python.org/3/library/importlib.html>
  - PEP 420 namespace packages, PEP 562 module `__getattr__`, PEP 561
    distributing type information.
  - Python typing specification: Distributing type information and its
    library interface rules; Stub files; type annotation semantics.
    <https://typing.python.org/en/latest/spec/>
  - Python Packaging User Guide: `pyproject.toml` `[project]` metadata.
  - Toolchain: CPython, 64-bit x86-64 Linux, at the release each context's
    `python` names. `authoring.tools` records the exact release used.

  ## Contexts

  Context parameters:

  | Parameter | Value |
  | --- | --- |
  | `mode` | `runtime` or `typing`. |
  | `python` | The release parameter: the interpreter version as `3.N`, such as `3.14`, or as `3.N.P` when a `sys.version_info` comparison in the project's documents tests the micro version. |
  | `platform` | `sys.platform`. |
  | `search-path` | The ordered list of project-relative import roots. |
  | `options` | The sorted interpreter options that change semantics, such as `-O`. |

  Every Python project has one `runtime` context and one `typing` context
  with the interpreter and platform the fixture plan declares. The
  `search-path` is the project's import root followed by every root
  that the project's configuration or task commands add, and every root
  that a `.pth` file adds when it lies in a site directory that the
  configuration or a task command establishes, in the order the import
  system consults them. A `.pth` file outside such a site directory adds
  no root. Each command in the project's `build` and `test` tasks that runs
  Python with a different parameter value defines a further `runtime`
  context; a command that only compiles files, such as `compileall`, runs
  no project module and defines none. The `typing` context's `command` is
  `none` when no project command runs a type checker.

  The import root is the directory that the project's task commands put
  first on `sys.path` when they run project code: the working directory for
  `python -m` and `python -c`, and the script's directory for a script.
  When no task command runs project code, the import root is the package
  directory the build configuration declares, such as `src` for a src
  layout, and otherwise the project root; this is the path an installed
  distribution gives. The project root is written `.`.

  A search path that a function body in project or library code changes at
  run time, through `sys.path`, `site.addsitedir` or a package's `__path__`,
  is outside every context. Code that a module runs when it is imported is not: a package
  `__init__` that extends its own `__path__` at module level adds those
  directories as portions of the package in `runtime` contexts.

  A branch whose test the typing specification evaluates statically, a
  comparison of `sys.platform` or `sys.version_info`, a
  `sys.platform.startswith` call, `TYPE_CHECKING`, or the literal `True`
  or `False`, holds only in the contexts whose
  `platform`, `python` or `mode` take it. Facts whose sites lie in a branch
  that a context does not take do not hold in that context. Other
  conditional code holds in every context.

  `runtime` facts state what the import system and execution model do when
  the project's modules are imported and its declared entry points run.
  A module is importable when the import system locates it from `search-path`.
  Whether its initialization then succeeds does not change its document
  disposition, its facts or its public API membership: facts state source
  declarations, and a statement that a raise leaves unexecuted keeps its facts.
  `typing` facts state what the typing specification determines: stub files
  take precedence over implementation modules, `typing.TYPE_CHECKING` is
  true, and annotated declarations fix the types of their receivers.

  ## Units and distributions

  | Unit kind | Module |
  | --- | --- |
  | `module` | A `.py` source module. |
  | `package` | A regular package's `__init__.py`. |
  | `stub` | A `.pyi` stub module. |
  | `namespace-package` | A namespace package, project-merged. |

  A unit's `name` is the fully qualified module name. A stub and its
  implementation module are two units with one module name. The unit key is
  the module name and the unit kind.

  A distribution is the `[project]` table of a tracked `pyproject.toml`:
  `kind: python-distribution`, `name` and `version` from that table. Its
  units are the modules of the import packages and modules its build
  configuration includes, by the build backend's declared or default package
  discovery. When discovery fails, as setuptools' automatic discovery does
  for a flat layout with several top-level packages, the distribution has no
  units.

  A dotted name is a namespace package when the path-based finder, scanning
  every entry of the parent's path, finds a directory of that name with no
  `__init__.py` that holds a Python module at some depth, and finds no
  regular package or module of that name in any entry; each such directory
  is a portion. A regular package or module of that name in any entry takes
  precedence, and its directory-only siblings contribute nothing.
  A namespace package's `units` lists its own unit and the units of the
  modules, packages and namespace packages directly inside its portions. A
  module entity is the root of its unit and has no `parent`; its module
  name states its package.

  ## Documents

  | File class | Disposition |
  | --- | --- |
  | `.py` and `.pyi` files the context can import from `search-path`, and scripts a task runs | `indexed` |
  | Other tracked `.py` and `.pyi` files | `inactive` |
  | `pyproject.toml`, `setup.cfg`, `setup.py` used as configuration, `.pth` files, `py.typed` | `configuration` |
  | Tracked third-party packages | `external` |
  | C sources, compiled artifacts, data files, Markdown, task files | `out-of-profile` |

  ## Paths

  - A module path is its fully qualified module name.
  - A module-level binding is `<module>.<name>`; a class attribute or method
    is `<class path>.<name>`; nested classes and functions defined at class
    or module level continue the chain.
  - A name-mangled attribute uses its declared name; its declared
    visibility is `mangled`.
  - Parameters are `<callable>.(<name>)`; type parameters
    `<declaration>.[<name>]`.
  - A consumer path is the fully qualified dotted name a consumer writes,
    such as `pkg.sub.Name`.

  ## Entities

  | Construct | Kind | `language-kind` |
  | --- | --- | --- |
  | module, package, stub module | `module` | `module`, `package` or `stub` |
  | namespace package | `module` | `namespace-package` |
  | `class` | `type` | `class`, `protocol`, `enum`, `typed-dict`, `named-tuple` or `dataclass` |
  | `type` statement, `TypeAlias` annotation | `type-alias` | `type-statement` or `type-alias` |
  | module-level and class-level `def` and `async def` | `callable` | `function`, `method`, `classmethod`, `staticmethod`, `async-function`, `async-method`, `async-classmethod` or `async-staticmethod` |
  | `@property` and descriptors defined in the project | `property` | `property` or `descriptor` |
  | class-body assignment or annotation | `field` | `class-attribute` |
  | assignment to `self.<name>` or `cls.<name>` in a method body | `field` | `instance-attribute` |
  | module-level assignment or annotated declaration | `variable` | `variable` or `final` |
  | enum member | `enum-member` | `enum-member` |
  | parameter | `parameter` | `param` |
  | type parameter, `TypeVar` declared at module level | `type-parameter` | `type-param` or `typevar` |

  Instance attributes assigned through `self` or `cls` inside methods are in
  profile. All other declarations inside function bodies are
  out-of-profile.

  A module or class binding is one entity per path. Every statement that
  binds that name in that namespace is a definition site, including
  conditional definitions and redefinitions. Import statements at module or
  class level bind names but create no entity; they create `exports`
  relations.

  A namespace package is a synthetic entity with no anchor, identified by
  its module name, with `units` listing the directories' modules that
  contribute portions.

  A module that the project provides only in compiled form, such as an
  extension module compiled from another language or a source-less bytecode
  file, is an external entity whose distribution is the project
  distribution.

  The attributes that the import system sets on a module (`__name__`,
  `__file__`, `__package__`, `__spec__`, `__loader__`, `__path__`,
  `__dict__`) and that a class statement sets on a class (`__module__`,
  `__qualname__`, `__dict__`, `__class__`) are not entities. A reference to
  one is out-of-profile, unless the project binds the name itself.

  ## Declared visibility

  Values: `public`, `private-convention` for a leading underscore,
  `mangled` for a class-level name with two leading underscores and at most
  one trailing underscore, and `dunder` for names that begin and end with
  two underscores. `explicit` is `true`. A module or package takes the
  value of the last component of its module name. A module has no name
  token, so it has no definition site and no `anchor`.

  ## Effective visibility

  The language enforces no access control. Every entity has `unit: all`,
  `project: all`, and `external: all` when its module belongs to a
  distribution, `none` otherwise.

  ## Public API

  The public API of a distribution is its members and their signatures.

  ### Membership

  A distribution's membership follows the typing specification's library
  interface rules, applied to stub units in `typing` contexts and to
  implementation units in `runtime` contexts:

  - a module is public when no component of its name begins with an
    underscore;
  - in a public module that defines `__all__` as a static list or tuple, the
    public names are exactly the names in `__all__`;
  - otherwise the public names are the module-level bindings whose names do
    not begin with an underscore, excluding names bound by `import` unless
    the import uses the redundant form `import a as a` or
    `from m import a as a`, the form `from . import a`, or the wildcard form
    `from m import *`, which re-exports every public name of `m` by these
    same rules; in a package `__init__`, `from .a import x` makes the
    submodule name `a` public and leaves `x` private;
  - members of a public class are its attributes, methods and properties
    whose names do not begin with an underscore, plus dunder names.

  A public module is a member with its module name as consumer path. Every
  public name is a member with the consumer path of the module and name;
  the entity is the binding's target: the module's own entity of that name,
  the target of the import binding, or, for a name `__all__` lists that the
  module does not bind, the submodule of that name. A name bound by several
  statements denotes its last binding in statement order, as at run time: each
  import statement keeps its relation, and the member is the last binding's target. A name `__all__` lists
  that resolves to nothing adds no member. In a `typing` context a module
  with a stub contributes through the stub unit, and a module without one
  through its implementation unit.

  ### Signatures

  A project member's signature follows the model's Signatures section.

  | `language-kind` | Slots |
  | --- | --- |
  | `function`, `method`, `classmethod`, `staticmethod`, and their `async-` forms | `type-parameters`, `parameters`, `returns`, `modifiers`; `overloads` for several signatures |
  | `class`, `protocol`, `enum`, `typed-dict`, `named-tuple`, `dataclass` | `type-parameters`, `bases`, `modifiers` |
  | `type-statement`, `type-alias` | `type-parameters`, `type` |
  | `property`, `descriptor` | `get`, `set`, `delete`, `modifiers` |
  | `class-attribute`, `instance-attribute`, `variable`, `final` | `type`, `modifiers` |
  | `enum-member` | `value` |

  Parameter modes: `positional-only`, `keyword-only`, `var-positional` for `*args` and
  `var-keyword` for `**kwargs`. A parameter that can be passed either way has no mode.
  `self` and `cls` are entries of `parameters`.

  Modifiers: `abstract`, `final`, `classvar`, and `not-required` for a `TypedDict` key
  that is effectively not required, by `total` of its own class, `Required` and
  `NotRequired`. `classmethod` and `staticmethod` are `language-kind` values. A
  `TypedDict` key's `type` has no `Required` or `NotRequired` wrapper. The wrapper tokens
  keep their `references` facts, and the reference audit does not expect them in a slot.

  `bases` has one entry per base of the class, with `position`, its index in the base
  list, which sets the method resolution order. Reversing `class C(A, B)` changes both
  positions while the keys stay equal.

  A `type-parameters` slot lists the parameters a `def`, `class` or `type` statement
  declares, and the module-level `TypeVar`, `TypeVarTuple` and `ParamSpec` names its
  signature uses, in order of first use. A type text writes each by its name. An entry
  for a module-level name states its declaration's arguments, and that declaration is
  the source declaration of the entry: `bound` is `bounds`, constraints are `bounds`
  written `(int, str)` in sorted order, `covariant=True` is `variance: out`,
  `contravariant=True` is `variance: in`, and `default` is `default`. So that a private
  `_T` is stated, this repeats at each signature that uses the name:

  ```yaml
  - entity: atlas.convert
    type-parameters:
      - {name: T, kind: type, bounds: str}
    parameters:
      - {name: value, type: T}
    returns: T
  ```

  A `TypeVarTuple` and a `ParamSpec` keep their sigil in `name`, `*Ts` and `**P`.

  Canonical spelling:

  - Built-in names are written bare: `bool`, `bytearray`, `bytes`, `complex`, `dict`,
    `float`, `frozenset`, `int`, `list`, `object`, `set`, `str`, `tuple` and `type`,
    with `None` and `...`.
  - `int | None` for `Optional[int]`, `int | str` for `Union[int, str]`, and `list[int]`
    for `List[int]`. The reference audit does not expect a token that a canonical form
    removes. A string annotation is written as the type it spells.
  - A union is flattened, its duplicates are removed and its members are sorted: `int`
    for `int | int`. Text uses `, ` between arguments and ` | ` between union members.
  - A string in `Literal` is double-quoted.

  Inference: the profile records none. An unannotated parameter, return or variable has
  no type slot, because the typing specification leaves inference to each checker. An
  observation of a type for it is `out-of-profile`.

  `default` is the literal in the model's value form, or `present` when the default is
  not a literal. A default that follows a private name is `present`, and a change of
  that name is not stated.

  `@overload` stubs are `overloads` in `typing` contexts, and the implementation
  signature is the record in `runtime` contexts. A redefined name has the signature of
  the final binding. When control flow leaves several definitions possible, the record
  has `alternatives`, each with its `at`, the definition site, and its slots:

  ```yaml
  - entity: atlas.select
    alternatives:
      - at: {path: src/atlas/select.py, start: [3, 9], end: [3, 15], text: select}
        returns: int
      - at: {path: src/atlas/select.py, start: [6, 9], end: [6, 15], text: select}
        returns: str
  ```

  The decorators `property`, `classmethod`, `staticmethod`, `overload`, `abstractmethod`,
  `final` and `dataclass` have the effects this section states. Every other decorator
  leaves the signature as written.

  A synthetic member has `{inferred}` slots by its synthesis rule, such as a dataclass
  `__init__` with one parameter for each field, in field order, and a forwarded default
  as `{inferred: ...}`.

  An author derives these from the Language Reference and the typing specification
  applied to source.

  The compiler report comes from `inspect.signature`, run outside the tree, for names,
  kinds, defaults and annotations. Python has no reference type checker, so the report
  covers the runtime's view only, and a slot it cannot state is `unchecked`.

  ## References

  The target is the binding that Python's scoping rules resolve, followed to
  its defining entity through import bindings. For `from p import n`, the
  target is the attribute `n` of package `p` when `p` binds `n` at the time
  the statement executes, and the submodule `p.n` otherwise. When the
  answer depends on the order in which declared entry points import
  modules, the disposition is `candidates`.

  Attribute references are in profile when their receiver is a module, a
  class, `self` or `cls` inside a method of the class, or `super()`. In
  `typing` contexts, attribute references are also in profile when the
  receiver is a name whose declaration has a type annotation, or a direct
  call of a project callable that has a return annotation; they resolve on
  that type by the method resolution order. Other attribute references,
  including those on a receiver that is itself an attribute or call chain,
  are out-of-profile.

  | Occurrence | Role |
  | --- | --- |
  | Module name segment in `import` or `from ... import` | `import`, or `qualifier` for non-final segments |
  | Imported name in `from ... import` | `import` |
  | Callee of a call expression | `call`, or `construct` when the target is a class |
  | Name in an annotation, base class list, `except` clause, `isinstance` or `issubclass` second argument | `type` |
  | Name or attribute used as a value | `read` |
  | Assignment, `del` or augmented-assignment target that rebinds an in-profile entity | `write`, or `read-write` for augmented assignment |
  | Class or value pattern in `match` | `pattern` |
  | Decorator expression | `attribute` |
  | Non-final dotted segment that selects a module or class | `qualifier` |

  Dynamic imports: the module-name argument of `importlib.import_module`,
  `__import__` and `runpy.run_module` is a value site that spans the
  argument expression. It has a reference with role `import` and
  `basis: dynamic` to the module that the import system locates for that
  name; for `runpy.run_module` this is the module it executes. Calls that
  take a filesystem location or only search for a module, such as
  `runpy.run_path`, `importlib.util.spec_from_file_location` and
  `importlib.util.find_spec`, are out-of-profile as references. Dynamic
  import value sites hold in `runtime` contexts only. A literal, or a value
  composed only of literals and names bound once to literals at module
  level or in the enclosing function, is `resolved`. A value chosen among such literals by run-time
  conditions is `candidates`. A name that resolves to no module, in a
  handler for the failure, is `nonexistent`. A value read from files,
  environment, arguments or other input is `indeterminate`.

  An import after the project assigns a module object into `sys.modules`
  under that name targets the assigned object's module, with
  `basis: dynamic`. When the assigned object is one that the project
  creates at run time, such as a `types.ModuleType` instance, it is not an
  entity and the import has no reference. An import that only a search
  path changed by a function body can satisfy is `indeterminate`, in
  `typing` contexts as well, because no context models that change; in
  `runtime`, an import that provably fails at its site inside a handler for
  the failure is `nonexistent`. An import of a module that a project or
  external entity represents targets that module, even when executing the
  module raises.

  ## Relations

  - `inherits`: a class to each base class expression that names a class,
    with `at` on the base name.
  - `implements`: none; protocol conformance without inheritance is
    structural and out-of-profile, and listing a protocol as a base is
    `inherits`.
  - `overrides`: a class method, property or attribute to the same-named
    member found next in the method resolution order of the class.
  - `aliases`: a module-level `type` statement or `TypeAlias` to the class it
    names.
  - `exports`: each name a module-level or class-level import statement
    binds, from the module or class to the target, with `name` the bound
    name; each name a star import binds, with `at` on the `*` token. Every
    import statement is a binding, so two star imports that bind one name
    give two relations. `visibility` is `re-export` when
    the import is a re-export form of the library interface rules
    (`import a as a`, `from m import a as a`, `from . import a`,
    `from m import *`), and `import` otherwise.

  ## Generated, synthetic and external entities

  - Files the project's `generate` task writes are generated documents.
  - Synthetic entities: dataclass-generated methods (`__init__`, `__repr__`,
    `__eq__` and the methods its options enable) when the class does not
    declare them, anchored on the class name; named-tuple fields and methods
    created by `NamedTuple` class syntax.
  - External key path: the fully qualified name at the defining module: the
    module whose source defines the name, after following import bindings,
    in the CPython standard library source for standard library names, such
    as `importlib._abc.Loader` for a name written `importlib.abc.Loader`.
    The same external serves `typing` contexts. A built-in name's path is
    its bare name, such as `dict`. `distribution` is the distribution that
    provides the module, or `stdlib` for the standard library and
    `builtins` for built-in names.

  ## Dispositions

  `candidates`, `nonexistent` and `indeterminate` occur as stated under
  References. A conditional import inside `try` with an `except ImportError`
  fallback binds one of two modules; references through that binding are
  `candidates`.

  ## Extensions

  | Kind | Members | Key | Compared |
  | --- | --- | --- | --- |
  | `python:stub-of` | `stub`: a stub entity, `runtime`: the implementation entity with the same path, or absent when none exists | `stub` | `runtime` |
  | `python:all-member` | `module`, `name`: a name the static `__all__` lists | `module`, `name` | none |
  | `python:module-getattr` | `module`, `name`, `target`: a name that a module `__getattr__` resolves for a literal attribute reference in the project | `module`, `name` | `target` |

  All three extensions are required.

  ## Authoring obligation

  For every Python project dataset:

  1. Inventory every tracked file, and the units and contexts of every
     indexed file.
  2. Declare the `runtime` and `typing` contexts and every further context
     the tasks define, each with its `search-path`.
  3. Declare every unit, including stubs and namespace packages, and every
     distribution.
  4. Record every entity of the kinds in the entity table, in each context,
     including instance attributes and synthetic entities.
  5. Record every in-profile reference, including dynamic import value
     sites with their dispositions.
  6. Record every relation of the kinds above.
  7. Record declared and effective visibility for every entity other than
     parameters.
  8. Record the public API of every distribution in every context, and every
     required extension fact.
  9. Write every signature from source, the Language Reference and the typing specification. Do not read a compiler report or a compiler draft of a
     declared slot while writing it. Run the compiler report from `inspect.signature` after
     writing, and settle each disagreement against the language's rule.
validation-criteria: |
  A Python dataset conforms when it conforms to `semantic-oracle-model`, its
  contexts follow the context rule above, every indexed document is
  importable or run in its contexts from `search-path`, every dynamic import
  disposition follows the rules above, and every public API membership
  agrees with the library interface rules. Independent review confirms facts
  against source, configuration, the Language Reference and the typing
  specification.
  Every signature follows this profile's slots, modes, modifiers and canonical spelling,
  and its slots agree with `inspect.signature` or are listed as `unchecked`.
