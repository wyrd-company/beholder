# ---
# relationships:
#   implements: semantic-oracle-profile-python
#   references: semantic-oracle-model
# ---
#
# Dataset schema for profile `python/1` of semantic-oracle model version 1.
#
# This schema applies the shared record structure of the model schema and
# adds the Python vocabulary only. A context-variant attribute holds either
# one value or a list of `{contexts, value}` entries; each value set below is
# written once as a YAML anchor and applied to both forms.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/beholder/schemas/semantic-oracle/1/python/1
title: Semantic-oracle dataset, profile python/1
$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/dataset'
properties:
  profile: {const: python/1}
  project: {properties: {language: {const: python}}}
  contexts: {items: {properties: {parameters: {$ref: '#/$defs/context-parameters'}}}}
  units: {items: {$ref: '#/$defs/unit'}}
  distributions: {items: {properties: {kind: {const: python-distribution}}}}
  entities: {items: {$ref: '#/$defs/entity'}}
  externals: {items: {$ref: '#/$defs/kind-and-language-kind'}}
  references:
    items:
      properties:
        role:
          enum: [import, qualifier, call, construct, type, read, write, read-write, pattern, attribute]
  relations:
    items:
      properties:
        kind: {enum: [inherits, overrides, aliases, exports]}
        visibility: {enum: [re-export, import]}
      if: {properties: {kind: {const: exports}}, required: [kind]}
      then: {required: [visibility]}
  public-api: {properties: {signatures: {items: {$ref: '#/$defs/signature'}}}}
  extensions: {$ref: '#/$defs/extensions'}

$defs:
  text: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/text'}
  id: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/id'}
  extension-fact: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/extension-fact'}
  text-list: {type: array, uniqueItems: true, items: {$ref: '#/$defs/text'}}

  context-parameters:
    type: object
    required: [mode, python, platform, search-path, options]
    additionalProperties: false
    properties:
      mode: {enum: [runtime, typing]}
      python: {$ref: '#/$defs/text'}
      platform: {$ref: '#/$defs/text'}
      search-path: {$ref: '#/$defs/text-list', minItems: 1}
      options: {$ref: '#/$defs/text-list'}

  unit:
    $ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/unit'
    properties:
      kind: {enum: [module, package, stub, namespace-package]}
    unevaluatedProperties: false

  namespace-package:
    anyOf:
      - const: namespace-package
      - type: array
        items: {properties: {value: {const: namespace-package}}}

  entity:
    properties:
      declared-visibility: {$ref: '#/$defs/declared-visibility'}
    $ref: '#/$defs/kind-and-language-kind'
    allOf:
      # A namespace package is project-merged: it has `units`, and nothing
      # else has. It is the synthetic form with no anchor.
      - if: {properties: {language-kind: {$ref: '#/$defs/namespace-package'}}}
        then: {required: [units]}
        else:
          properties: {units: false}
          if: {properties: {origin: {const: synthetic}}}
          then: {required: [anchor]}

  kind-and-language-kind:
    allOf:
      - if: {properties: {kind: {const: module}}}
        then: {properties: {language-kind: {anyOf: [{enum: &module [module, package, stub, namespace-package]}, {type: array, items: {properties: {value: {enum: *module}}}}]}}}
      - if: {properties: {kind: {const: type}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type [class, protocol, enum, typed-dict, named-tuple, dataclass]}, {type: array, items: {properties: {value: {enum: *type}}}}]}}}
      - if: {properties: {kind: {const: type-alias}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-alias [type-statement, type-alias]}, {type: array, items: {properties: {value: {enum: *type-alias}}}}]}}}
      - if: {properties: {kind: {const: callable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &callable [function, method, classmethod, staticmethod, async-function, async-method, async-classmethod, async-staticmethod]}, {type: array, items: {properties: {value: {enum: *callable}}}}]}}}
      - if: {properties: {kind: {const: property}}}
        then: {properties: {language-kind: {anyOf: [{enum: &property [property, descriptor]}, {type: array, items: {properties: {value: {enum: *property}}}}]}}}
      - if: {properties: {kind: {const: field}}}
        then: {properties: {language-kind: {anyOf: [{enum: &field [class-attribute, instance-attribute]}, {type: array, items: {properties: {value: {enum: *field}}}}]}}}
      - if: {properties: {kind: {const: variable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &variable [variable, final]}, {type: array, items: {properties: {value: {enum: *variable}}}}]}}}
      - if: {properties: {kind: {const: enum-member}}}
        then: {properties: {language-kind: {anyOf: [{enum: &enum-member [enum-member]}, {type: array, items: {properties: {value: {enum: *enum-member}}}}]}}}
      - if: {properties: {kind: {const: parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &parameter [param]}, {type: array, items: {properties: {value: {enum: *parameter}}}}]}}}
      - if: {properties: {kind: {const: type-parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-parameter [type-param, typevar]}, {type: array, items: {properties: {value: {enum: *type-parameter}}}}]}}}
      - properties:
          kind:
            enum: [module, type, type-alias, callable, property, field, variable, enum-member, parameter, type-parameter]

  declared-visibility-value:
    type: object
    properties:
      value: {enum: [public, private-convention, mangled, dunder]}
      explicit: {const: true}

  declared-visibility:
    anyOf:
      - $ref: '#/$defs/declared-visibility-value'
      - type: array
        items: {properties: {value: {$ref: '#/$defs/declared-visibility-value'}}}

  extensions:
    type: object
    additionalProperties: false
    properties:
      python:stub-of:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [stub]
          properties:
            stub: {$ref: '#/$defs/id'}
            runtime: {$ref: '#/$defs/id'}
          unevaluatedProperties: false
      python:all-member:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [module, name]
          properties:
            module: {$ref: '#/$defs/id'}
            name: {$ref: '#/$defs/text'}
          unevaluatedProperties: false
      python:module-getattr:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [module, name, target]
          properties:
            module: {$ref: '#/$defs/id'}
            name: {$ref: '#/$defs/text'}
            target: {$ref: '#/$defs/id'}
          unevaluatedProperties: false

  # ------------------------------------------------------------- signatures
  # The slots, modes and modifiers of this language over the model's records.
  signature:
    $ref: '#/$defs/signature-slots'
    properties:
      alternatives: {items: {$ref: '#/$defs/signature-slots'}}
  callable-slots:
    properties:
      where: false
      return-mode: false
      type-parameters: {items: {$ref: '#/$defs/type-parameter'}}
      parameters: {items: {$ref: '#/$defs/parameter'}}
      modifiers: {items: {enum: [abstract, classvar, final, not-required]}}
  signature-slots:
    $ref: '#/$defs/callable-slots'
    properties:
      impl: false
      receiver: false
      underlying: false
      constructors: false
      call-signatures: false
      construct-signatures: false
      index-signatures: false
      bounds: false
      tag: false
      init: false
      overloads: {items: {$ref: '#/$defs/callable-slots'}}
      bases: {items: {$ref: '#/$defs/base'}}
      get: {$ref: '#/$defs/accessor'}
      set: {$ref: '#/$defs/accessor'}
  type-parameter:
    properties:
      variance: false
      modifiers: false
      kind: {const: type}
  parameter:
    properties:
      mode: {enum: [keyword-only, positional-only, var-keyword, var-positional]}
  base:
    properties:
      type-parameters: false
      self-type: false
      where: false
      bindings: false
  accessor:
    properties:
      access: false
      modifiers: false
