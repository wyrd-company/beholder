# ---
# relationships:
#   references: semantic-oracle-profile-typescript
# ---
#
# Datasets that the `typescript/1` schema rejects for one named reason each: values
# and members this profile does not define. Each case applies `patch`, a JSON
# Patch (RFC 6902), to the valid example `base`. The result fails at
# `fails-at` with the schema keyword `keyword`. For `required`,
# `additionalProperties` and `unevaluatedProperties`, `member` names the
# member the error is about, or the list of members. `also` lists any
# further error, by location, keyword and the same `member` rule, that the
# same defect causes; no other error occurs.
cases:
  - name: missing-host
    reason: A context assigns every TypeScript context parameter.
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: remove, path: /contexts/0/parameters/host}]
    fails-at: /contexts/0/parameters
    keyword: required
    member: host
  - name: tsconfig-not-canonical
    reason: '`tsconfig` is `none` or a canonical path.'
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/tsconfig, value: ./tsconfig.json}]
    fails-at: /contexts/0/parameters/tsconfig
    keyword: anyOf
  - name: options-not-an-object
    reason: '`options` is the compilerOptions object.'
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/options, value: --strict}]
    fails-at: /contexts/0/parameters/options
    keyword: type
  - name: unknown-unit-kind
    reason: '`declaration` is not a TypeScript unit kind.'
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: replace, path: /units/0/kind, value: declaration}]
    fails-at: /units/0/kind
    keyword: enum
  - name: unit-name-not-a-document-path
    reason: A unit's name is its canonical document path.
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: replace, path: /units/0/name, value: /src/index.ts}]
    fails-at: /units/0/name
    keyword: pattern
  - name: global-scope-without-units
    reason: The global scope is project-merged and lists its units.
    base: semantic-oracle-profile-typescript.example.yml
    patch:
      - {op: remove, path: /entities/0/units}
      - {op: add, path: /entities/0/unit, value: globals-dts}
    fails-at: /entities/0
    keyword: required
    member: units
  - name: namespace-block-with-units
    reason: Only the global scope is project-merged in the TypeScript profile.
    base: semantic-oracle-profile-typescript.example.yml
    patch:
      - {op: remove, path: /entities/23/unit}
      - {op: add, path: /entities/23/units, value: [shapes-ts]}
    fails-at: /entities/23/units
    keyword: falseSchema
  - name: synthetic-without-anchor
    reason: The synthetic constructor is anchored on its class name.
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: remove, path: /entities/9/anchor}]
    fails-at: /entities/9
    keyword: required
    member: anchor
  - name: static-on-a-type
    reason: '`static-method` is a language kind of members, not of types.'
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: replace, path: /entities/12/language-kind, value: static-method}]
    fails-at: /entities/12/language-kind
    keyword: anyOf
  - name: unknown-declared-visibility
    reason: '`export` is not a TypeScript declared visibility value; the value is `exported`.'
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: replace, path: /entities/12/declared-visibility/value, value: export}]
    fails-at: /entities/12/declared-visibility
    keyword: anyOf
  - name: role-the-profile-does-not-use
    reason: The TypeScript profile assigns no occurrence the role `macro-invocation`.
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: replace, path: /references/12/role, value: macro-invocation}]
    fails-at: /references/12/role
    keyword: enum
  - name: unknown-module-format
    reason: A module format is `esm` or `cjs`.
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: replace, path: /extensions/typescript:module-format/0/format, value: umd}]
    fails-at: /extensions/typescript:module-format/0/format
    keyword: enum
  - name: type-only-without-reference
    reason: A `typescript:type-only` fact names its reference.
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: remove, path: /extensions/typescript:type-only/0/reference}]
    fails-at: /extensions/typescript:type-only/0
    keyword: required
    member: reference
  - name: augments-without-site
    reason: A `typescript:augments` fact names the augmentation block's name site.
    base: semantic-oracle-profile-typescript.example.yml
    patch: [{op: remove, path: /extensions/typescript:augments/0/at}]
    fails-at: /extensions/typescript:augments/0
    keyword: required
    member: at
