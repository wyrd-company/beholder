# ---
# relationships:
#   implements: semantic-oracle-profile-rust
#   references: semantic-oracle-model
# ---
#
# Dataset schema for profile `rust/1` of semantic-oracle model version 1.
#
# This schema applies the shared record structure of the model schema and
# adds the Rust vocabulary only. A context-variant attribute holds either one
# value or a list of `{contexts, value}` entries; each value set below is
# written once as a YAML anchor and applied to both forms.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/beholder/schemas/semantic-oracle/1/rust/1
title: Semantic-oracle dataset, profile rust/1
$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/dataset'
properties:
  profile: {const: rust/1}
  project: {properties: {language: {const: rust}}}
  contexts: {items: {properties: {parameters: {$ref: '#/$defs/context-parameters'}}}}
  units: {items: {$ref: '#/$defs/unit'}}
  distributions: {items: {properties: {kind: {const: crate}}}}
  entities: {items: {$ref: '#/$defs/entity'}}
  externals: {items: {$ref: '#/$defs/kind-and-language-kind'}}
  references:
    items:
      properties:
        role:
          enum: [qualifier, import, export, call, construct, type, pattern, read, write, read-write, attribute, macro-invocation]
        disposition: {enum: [resolved, external]}
  relations:
    items:
      properties:
        kind: {enum: [inherits, implements, overrides, aliases, exports]}
        # The `use` item's visibility, written as declared visibility.
        visibility:
          anyOf:
            - enum: [pub, pub(crate), pub(self), pub(super)]
            - {type: string, pattern: '^pub\(in \S+\)$'}
      if: {properties: {kind: {const: exports}}, required: [kind]}
      then: {required: [visibility]}
  public-api: {properties: {signatures: {items: {$ref: '#/$defs/signature'}}}}
  extensions: {$ref: '#/$defs/extensions'}

$defs:
  text: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/text'}
  id: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/id'}
  locator: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/locator'}
  canonical-path: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/canonical-path'}
  context-variant-list: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/context-variant-list'}
  extension-fact: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/extension-fact'}
  text-list: {type: array, uniqueItems: true, items: {$ref: '#/$defs/text'}}

  unit-kind:
    enum: [lib, proc-macro, bin, example, integration-test, bench, build-script]

  context-parameters:
    type: object
    required: [mode, selection, manifest, packages, target, cfg, features, profile]
    additionalProperties: false
    properties:
      mode: {enum: &mode [build, test, doc, doctest]}
      selection: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/unit-kind'}}
      manifest: {$ref: '#/$defs/canonical-path'}
      packages:
        anyOf:
          - const: workspace
          - {$ref: '#/$defs/text-list', minItems: 1}
      target: {$ref: '#/$defs/text'}
      cfg: {$ref: '#/$defs/text-list'}
      features: {$ref: '#/$defs/text-list'}
      profile: {$ref: '#/$defs/text'}

  unit:
    $ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/unit'
    required: [package, package-version, target-name, edition, platform, features]
    properties:
      kind: {$ref: '#/$defs/unit-kind'}
      package: {$ref: '#/$defs/text-attribute'}
      package-version: {$ref: '#/$defs/text-attribute'}
      target-name: {$ref: '#/$defs/text-attribute'}
      edition: {$ref: '#/$defs/text-attribute'}
      platform:
        anyOf:
          - enum: &platform [target, host]
          - $ref: '#/$defs/context-variant-list'
            items: {properties: {value: {enum: *platform}}}
      features:
        anyOf:
          - $ref: '#/$defs/text-list'
          - $ref: '#/$defs/context-variant-list'
            items: {properties: {value: {$ref: '#/$defs/text-list'}}}
      # The unit's compilation mode, when it differs from its context's.
      mode:
        anyOf:
          - enum: *mode
          - $ref: '#/$defs/context-variant-list'
            items: {properties: {value: {enum: *mode}}}
    unevaluatedProperties: false

  text-attribute:
    anyOf:
      - $ref: '#/$defs/text'
      - $ref: '#/$defs/context-variant-list'
        items: {properties: {value: {$ref: '#/$defs/text'}}}

  entity:
    properties:
      # The profile defines no synthetic entities and no project-merged kind.
      origin: {enum: [source, generated]}
      units: false
      declared-visibility: {$ref: '#/$defs/declared-visibility'}
    $ref: '#/$defs/kind-and-language-kind'

  kind-and-language-kind:
    allOf:
      - if: {properties: {kind: {const: module}}}
        then: {properties: {language-kind: {anyOf: [{enum: &module [crate, mod]}, {type: array, items: {properties: {value: {enum: *module}}}}]}}}
      - if: {properties: {kind: {const: type}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type [struct, enum, union, trait]}, {type: array, items: {properties: {value: {enum: *type}}}}]}}}
      - if: {properties: {kind: {const: type-alias}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-alias [type, associated-type]}, {type: array, items: {properties: {value: {enum: *type-alias}}}}]}}}
      - if: {properties: {kind: {const: extension}}}
        then: {properties: {language-kind: {anyOf: [{enum: &extension [impl, trait-impl]}, {type: array, items: {properties: {value: {enum: *extension}}}}]}}}
      - if: {properties: {kind: {const: callable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &callable [fn, method, foreign-fn]}, {type: array, items: {properties: {value: {enum: *callable}}}}]}}}
      - if: {properties: {kind: {const: field}}}
        then: {properties: {language-kind: {anyOf: [{enum: &field [field]}, {type: array, items: {properties: {value: {enum: *field}}}}]}}}
      - if: {properties: {kind: {const: variable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &variable [static, static-mut, foreign-static]}, {type: array, items: {properties: {value: {enum: *variable}}}}]}}}
      - if: {properties: {kind: {const: constant}}}
        then: {properties: {language-kind: {anyOf: [{enum: &constant [const]}, {type: array, items: {properties: {value: {enum: *constant}}}}]}}}
      - if: {properties: {kind: {const: enum-member}}}
        then: {properties: {language-kind: {anyOf: [{enum: &enum-member [variant]}, {type: array, items: {properties: {value: {enum: *enum-member}}}}]}}}
      - if: {properties: {kind: {const: macro}}}
        then: {properties: {language-kind: {anyOf: [{enum: &macro [macro-rules, proc-macro, proc-macro-derive, proc-macro-attribute]}, {type: array, items: {properties: {value: {enum: *macro}}}}]}}}
      - if: {properties: {kind: {const: parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &parameter [param]}, {type: array, items: {properties: {value: {enum: *parameter}}}}]}}}
      - if: {properties: {kind: {const: type-parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-parameter [type-param, lifetime-param, const-param]}, {type: array, items: {properties: {value: {enum: *type-parameter}}}}]}}}
      - properties:
          kind:
            enum: [module, type, type-alias, extension, callable, field, variable, constant, enum-member, macro, parameter, type-parameter]

  declared-visibility-value:
    type: object
    properties:
      value:
        anyOf:
          - enum: [private, pub, pub(crate), pub(self), pub(super), inherited]
          - {type: string, pattern: '^pub\(in \S+\)$'}
    if: {properties: {value: {const: inherited}}}
    then: {properties: {explicit: {const: false}}}

  declared-visibility:
    anyOf:
      - $ref: '#/$defs/declared-visibility-value'
      - type: array
        items: {properties: {value: {$ref: '#/$defs/declared-visibility-value'}}}

  extensions:
    type: object
    additionalProperties: false
    properties:
      rust:reachable-unnameable:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [entity, distribution, via]
          properties:
            entity: {$ref: '#/$defs/id'}
            distribution: {$ref: '#/$defs/id'}
            via: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/id'}}
          unevaluatedProperties: false
      rust:macro-expansion:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [entity, macro, invocation]
          properties:
            entity: {$ref: '#/$defs/id'}
            macro: {$ref: '#/$defs/id'}
            invocation: {$ref: '#/$defs/locator'}
          unevaluatedProperties: false

  # ------------------------------------------------------------- signatures
  # The slots, modes and modifiers of this language over the model's records.
  signature:
    $ref: '#/$defs/signature-slots'
    properties:
      alternatives: false
  callable-slots:
    properties:
      return-mode: false
      type-parameters: {items: {$ref: '#/$defs/type-parameter'}}
      parameters: {items: {$ref: '#/$defs/parameter'}}
      modifiers: {items: {enum: [async, auto, const, non_exhaustive, provided, unsafe]}}
  signature-slots:
    $ref: '#/$defs/callable-slots'
    properties:
      receiver: false
      overloads: false
      underlying: false
      constructors: false
      call-signatures: false
      construct-signatures: false
      index-signatures: false
      tag: false
      get: false
      set: false
      init: false
      delete: false
      impl: {properties: {type-parameters: {items: {$ref: '#/$defs/type-parameter'}}}}
      bases: {items: {$ref: '#/$defs/base'}}
  type-parameter:
    properties:
      variance: false
      modifiers: false
  parameter:
    properties:
      default: false
      mode: {enum: [self-mut-ref, self-ref]}
  base:
    properties:
      position: false
      type-parameters: {items: {$ref: '#/$defs/type-parameter'}}
      bindings: {items: {properties: {type-parameters: {items: {$ref: '#/$defs/type-parameter'}}}}}
