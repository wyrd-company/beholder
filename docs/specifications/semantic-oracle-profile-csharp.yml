description: |
  # C# semantic-oracle profile, `csharp/1`

  This profile applies `semantic-oracle-model` version 1 to C#. It defines
  only C# mappings and C# extensions.

  ## Primary sources

  - C# language specification (ECMA-334) and the C# feature specifications
    for later language versions: Basic concepts (declarations, members,
    accessibility domains, signatures, scopes, namespace and type names),
    Namespaces (extern alias directives, using directives, global using
    directives), Classes, Structs, Interfaces, Enums, Delegates, Attributes,
    partial types and members, file-local types, extension members.
    <https://learn.microsoft.com/dotnet/csharp/language-reference/>
  - .NET SDK and MSBuild documentation: project SDK default items, `Compile`
    items and `Link` metadata, `TargetFramework` and `TargetFrameworks`,
    `DefineConstants`, `ProjectReference` `Aliases`, `InternalsVisibleTo`.
    <https://learn.microsoft.com/dotnet/core/project-sdk/overview>
  - NuGet target framework compatibility (nearest framework selection).
    <https://learn.microsoft.com/nuget/concepts/dependency-resolution>
  - Roslyn source generators. <https://learn.microsoft.com/dotnet/csharp/roslyn-sdk/source-generators-overview>
  - `System.Runtime.CompilerServices.TypeForwardedToAttribute`.
  - Corpus toolchain: .NET SDK 10.0.110, MSBuild 18.0.11, the SDK's Roslyn
    compiler and its default C# language version.

  ## Contexts

  Context parameters:

  | Parameter | Value |
  | --- | --- |
  | `entry` | The project-relative path of the solution or project the command builds. |
  | `configuration` | The MSBuild `Configuration`. |
  | `target-framework` | The consumer framework that selects each project's inner build. |
  | `properties` | The sorted global MSBuild properties the command sets. |

  Each `dotnet build` or `dotnet test` command in the project's `build` and
  `test` tasks defines one context per distinct target framework that any
  built project declares, unless another command defines the same parameter
  values. In a context, each built project is compiled at the framework
  NuGet nearest-framework selection picks for `target-framework` from its
  `TargetFramework` or `TargetFrameworks`. A project with no compatible
  framework is not built in that context.

  ## Units and distributions

  A unit is one project's assembly: `kind: assembly`, `name` the
  `AssemblyName`. A unit record carries the C# attributes
  `assembly-version`, the assembly version, `project`, the canonical path of
  the project file, and, per context, `language-version`,
  `define-constants` and `target-framework`. The unit key is the assembly
  name, `assembly-version` and `project`. Two projects that produce one assembly name,
  with equal or different versions, are two units. An adapter that knows
  only the assembly name and version supplies a partial unit key.

  A distribution is a unit whose project is a library: `kind: assembly`,
  `name` the assembly name, `version` the assembly version. Projects with
  `OutputType` `Exe` or `WinExe` and test projects have no distribution.

  ## Documents

  | File class | Disposition |
  | --- | --- |
  | `.cs` files in a unit's `Compile` items in a context, after SDK default globs, `Remove`, `Include` with `Link`, and conditions | `indexed` |
  | Other tracked `.cs` files | `inactive` |
  | `.csproj`, `.sln`, `.slnx`, `Directory.Build.props`, `Directory.Build.targets`, `global.json`, `.editorconfig`, `NuGet.config` | `configuration` |
  | Tracked third-party source | `external` |
  | Key files, resources, other languages, Markdown, task files | `out-of-profile` |

  A file that two projects compile, through `Link` or shared globs, has one
  member entry per unit. Generated sources under `obj/` are untracked and are
  not documents.

  ## Paths

  - A path is the namespace-qualified name with `.` separators. Nested types
    use `.` as well. A generic type appends `` `n `` for its arity.
  - Members append `.<name>`. Constructors use `.ctor` and static
    constructors `.cctor`; finalizers `Finalize`; operators and conversions
    their metadata names, such as `op_Addition`; indexers `this[]`.
  - Overloaded methods, constructors, indexers and operators append the
    parameter list written with canonical type paths, such as
    `Geometry.Shape.Scale(System.Double)`, with `ref`, `out` and `in`
    prefixes and `params` omitted.
  - Explicit interface implementations use `<Interface path>.<member>` as
    the member name.
  - A file-local type appends `@<document path>`.
  - Members of an extension block use the block's receiver in the parent
    path: `<static class>.extension(<receiver type>).<member>`.
  - The consumer path equals the entity path.

  ## Entities

  | Construct | Kind | `language-kind` |
  | --- | --- | --- |
  | namespace | `namespace` | `namespace` |
  | `class`, `record class` | `type` | `class` or `record` |
  | `struct`, `record struct`, `ref struct` | `type` | `struct`, `record-struct` or `ref-struct` |
  | `interface` | `type` | `interface` |
  | `enum` | `type` | `enum` |
  | `delegate` | `type` | `delegate` |
  | extension block | `extension` | `extension-block` |
  | method, operator, conversion, constructor, static constructor, finalizer | `callable` | `method`, `operator`, `conversion`, `constructor`, `static-constructor` or `finalizer` |
  | field, fixed-size buffer | `field` | `field` or `fixed-buffer` |
  | `const` field | `constant` | `const` |
  | property, indexer, event | `property` | `property`, `indexer` or `event` |
  | enum member | `enum-member` | `enum-member` |
  | parameter, including primary-constructor parameters | `parameter` | `param` |
  | type parameter | `type-parameter` | `type-param` |

  A namespace is a project-merged entity: one entity per namespace path with
  `units` listing every unit that declares a member in it. A namespace that
  only external assemblies declare is an external entity.

  A partial type or partial member is one entity whose definitions are all
  its declaring sites. Property and event accessors are part of their
  property entity.

  `using` alias directives and extern alias directives create bindings, not
  entities. Local functions and lambdas are out-of-profile.

  ## Declared visibility

  Values: `public`, `internal`, `protected`, `protected internal`,
  `private protected`, `private` and `file`. Defaults: `internal` for
  top-level types, `private` for class and struct members, `public` for
  interface members, enum members and namespaces.

  ## Effective visibility

  The accessibility domain rules of the specification determine every value.
  A member's domain is intersected with its containing type's domain.

  | Declared | `unit` | `project` and `external` |
  | --- | --- | --- |
  | `public` | `all` | `all` |
  | `internal` | `all` | `scoped` to friend units, otherwise `none` |
  | `protected` | `[{access: scoped, scope: [<type>]}, subtypes]` | `subtypes` |
  | `protected internal` | `all` | `[subtypes, {access: scoped, scope: <friend units>}]` |
  | `private protected` | `[{access: scoped, scope: [<type>]}, subtypes]` | `{access: subtypes, within: <friend units>}` when friend units exist at the boundary, otherwise `none` |
  | `private` | `scoped` to the containing type | `none` |
  | `file` | `scoped` to the declaring document | `none` |

  A friend unit is a unit that an `InternalsVisibleTo` attribute of the
  declaring assembly names. A friend outside the project is the scope member
  `external:<assembly name>`.

  ## Public API

  The public API of a distribution is its members and their signatures.

  ### Membership

  A distribution's members in a context are every entity of its unit whose
  `external` access is `all` or includes `subtypes`, together with every
  type the unit forwards with `TypeForwardedTo`. A forwarded type is a member
  with the consumer path of the forwarded type, and the
  `csharp:type-forward` extension records the forward. A namespace is a
  member when it, or a namespace nested inside it, holds a public type of
  the distribution or a project type the distribution forwards, because a
  consumer can name it. The namespace of a forwarded external type is outside
  the project and is no member. Other namespaces are not members. An extension block is not a member; its members are.

  ### Signatures

  A project member's signature follows the model's Signatures section.

  | `language-kind` | Slots |
  | --- | --- |
  | `method` | `type-parameters`, `parameters`, `returns`, `return-mode`, `modifiers` |
  | `operator`, `conversion` | `parameters`, `returns`, `modifiers` |
  | `constructor` | `parameters`, `modifiers` |
  | `static-constructor`, `finalizer` | None |
  | `class`, `record`, `struct`, `record-struct`, `ref-struct`, `interface` | `type-parameters`, `bases`, `modifiers` |
  | `delegate` | `type-parameters`, `modifiers`. Its `Invoke` member states its signature. |
  | `enum` | `underlying`, always |
  | `field`, `fixed-buffer` | `type`, `modifiers` |
  | `const` | `type`, `value` |
  | `property`, `indexer` | `get`, `set`, `init`, `return-mode`, `modifiers`; `parameters` for an indexer |
  | `event` | `add`, `remove`, `modifiers` |
  | `enum-member` | `value` |

  An event's `add` and `remove` are accessors: each holds the delegate type in `type`,
  as `add: {type: "@{ext.System.EventHandler}?"}`.

  A `fixed-buffer`'s `type` is its element type with its length, `char[24]` for
  `public fixed char Name[24]`. This is the oracle's spelling, because C# has no type
  syntax for the length, and it states the layout that the length gives. The bracket holds
  the evaluated positive decimal length, so `Name[6 * 4]`, `Name[0x18]` and `Name[24]` are
  all `char[24]`.

  Parameter modes: `ref`, `out`, `in`, `ref readonly` and `params`; `scoped`, `scoped ref`,
  `scoped in` and `scoped ref readonly`; and for an extension method's first parameter
  `this`, `this ref`, `this in`, `this ref readonly`, `this scoped` or `this scoped ref`.
  A mode is the effective one: `scoped out` is `out`, because an `out` parameter is
  always scoped. `return-mode`
  is `ref` or `ref readonly`, and is absent for a return by value; `returns` holds the
  type without `ref`.

  Modifiers: `abstract`, `sealed`, `static`, `virtual`, `override`, `readonly` and
  `required`. `async` is not a modifier, because the return type states its effect on a
  caller. An accessor has `access`, `internal`, `private`, `private protected`, `protected`
  or `protected internal`, when narrower than the member's, and `modifiers`, `readonly`.

  Every constraint is on a type parameter, so a type parameter's `bounds` holds its
  `where` clause, and the profile has no `where` slot. The language fixes a primary
  constraint first, then `new()`, then `allows ref struct` last, and the interface and type
  parameter constraints between the primary constraint and those are sorted:
  `class, @{IA}, @{IB}, new()`. A type parameter has `variance`, `in` or `out`, when it
  states one.

  `bases` holds the targets of the type's `inherits` and `implements` relations, with
  their type arguments. An interface that a base inherits has no source token.

  For a partial member, the defining declaration supplies the parameter names, order and
  defaults, and the parameter audit reads its sites.

  Canonical spelling:

  - Type keywords are written bare: `bool`, `byte`, `char`, `decimal`, `double`,
    `dynamic`, `float`, `int`, `long`, `nint`, `nuint`, `object`, `sbyte`, `short`,
    `string`, `uint`, `ulong`, `ushort` and `void`. `int` for `System.Int32`, and the
    same for each keyword with a metadata name.
  - `int?` for `Nullable<int>`. The reference audit does not expect a token that a
    canonical form removes.
  - Type text states the effective nullable annotation of each reference type occurrence:
    `string?` annotated, `string` not annotated, and `string~` oblivious. `~` is the
    oracle's extension to C# type syntax, placed on each oblivious occurrence, including
    nested ones. Effective state includes local `#nullable` directives. `#nullable`
    warning state is not recorded.
  - Tuple element names stay in the type text: `(int x, string? y)`.
  - Text uses `, ` between arguments and no space before `<` or `[`.

  Inference: a declared member has no inferred type. A synthetic member, such as a
  record's copy constructor, `EqualityContract`, positional members or a delegate's
  `Invoke`, has `{inferred: ...}` by the synthesis rule, with a synthetic `parameter`
  entity for each parameter. A delegate's constructor has parameters `object` and `method`,
  `BeginInvoke` adds `callback` and `object` to the delegate's parameters and returns
  `@{IAsyncResult}`, and `EndInvoke` has `result` and returns the delegate's return. These
  compiler-supplied reference types are oblivious, as `object~`. `value` and `default` are the
  constant's value under the specification's constant expression rules. C# `default` is
  written as the value it denotes for the type. A `decimal` is its exact decimal. An
  author derives these from the C# language specification, and a Roslyn compile probe
  outside the tree confirms them.

  The compiler report comes from Roslyn. Where that toolchain is absent, every slot is
  `unchecked`.

  ## References

  The target is the symbol that the specification's binding selects:
  namespace and type name resolution, member lookup and overload resolution.
  Member lookup removes `override` members, so a call to an overridden
  virtual member targets its original declaration. Equivalence rule
  `csharp:override-for-virtual`: an observation targeting the override in the
  receiver's static type is accepted as `equivalent`.

  | Occurrence | Role |
  | --- | --- |
  | Name in a `using` or `global using` directive | `import` |
  | Alias name target in a `using` alias directive | `import` |
  | Non-final segment of a qualified name or member access that selects a namespace or type | `qualifier` |
  | Invocation of a method, delegate or extension member | `call` |
  | Type in an object creation expression | `construct` |
  | Type in a type position, base list, constraint, cast, `typeof`, `is` or `as` | `type` |
  | Field, property, constant, event or enum member read, method group | `read` |
  | Assignment target, event `+=` and `-=` | `write` |
  | Compound assignment, increment, decrement | `read-write` |
  | Type or constant in a pattern | `pattern` |
  | Attribute name | `attribute` |
  | `nameof` operand | `read` |
  | User-defined operator token that binds to a user-defined operator | `call` |

  An object creation targets the constructor that overload resolution
  selects. Equivalence rule `csharp:type-for-constructor`: an observation
  targeting the constructed type is accepted as `equivalent`. An attribute
  name targets the attribute class's constructor; the same rule applies.

  The identifier of an extern alias in `alias::name` is recorded by the
  `csharp:extern-alias` extension and has no common reference. The keyword
  `var` and target-typed `new()` have no reference.

  Alternate span: a verbatim identifier site `@name` spans `@name`; an
  observation spanning only `name` is accepted.

  ## Relations

  - `inherits`: a class's base class and an interface's base interfaces,
    with `at` on the base name.
  - `implements`: a class or struct to each interface in its base list and
    each interface those inherit.
  - `overrides`: an `override` member to the member it overrides; an
    implicit or explicit interface implementation member to the interface
    member it implements.
  - `aliases`: none; `using` aliases are bindings.
  - `exports`: none; C# namespaces have no export namespaces.

  ## Generated, synthetic and external entities

  - Source generator output is untracked. Entities it adds are
    `origin: generated` with `anchor` on the attribute or partial declaration
    that triggers the generator and `generated-by` naming the generator.
  - Synthetic entities: the default constructor of a class or struct with no
    declared instance constructor; members the compiler declares for records
    (`Equals`, `GetHashCode`, `ToString`, `PrintMembers`, `Deconstruct`,
    `EqualityContract`, the copy constructor and positional properties) when
    the source does not declare them; the delegate members the compiler
    declares (its constructor, `Invoke`, `BeginInvoke`, `EndInvoke`). Each is anchored on the
    declaring type's name.
  - External key path: the entity path at the defining assembly.
    `distribution` is the assembly name, such as `System.Runtime`; reference
    assemblies' forwards are followed to the defining assembly. `version` is
    present when the project resolves two versions.

  ## Dispositions

  - `indeterminate`: member access and invocation on a `dynamic` receiver.
  - Reflection and string-based lookups are out-of-profile.
  - Statically bound references are `resolved` or `external`.

  ## Extensions

  | Kind | Members | Key | Compared |
  | --- | --- | --- | --- |
  | `csharp:type-forward` | `unit`: the forwarding unit, `type`: the forwarded type, `at`: the `typeof` operand site | `unit`, `type` | none |
  | `csharp:extern-alias` | `at`: the alias identifier site, `alias`, `unit`: the aliased unit or external assembly | `at` | `alias`, `unit` |
  | `csharp:reference-alias` | `unit`: the referencing unit, `reference`: the referenced unit or external assembly, `aliases`: the sorted alias list from `Aliases` metadata, `global` included when present | `unit`, `reference` | `aliases` |

  All three extensions are required.

  ## Authoring obligation

  For every C# project dataset:

  1. Inventory every tracked file, and the units and contexts of every
     indexed file, including linked files.
  2. Declare every context by the framework rule above.
  3. Declare every unit with its attributes, every distribution, and every
     `csharp:reference-alias` fact.
  4. Record every entity of the kinds in the entity table, including all
     partial sites, generated entities and synthetic entities.
  5. Record every in-profile reference, including using directives,
     attributes, operator tokens and `nameof` operands, and every
     `csharp:extern-alias` fact.
  6. Record every relation of the kinds above.
  7. Record declared and effective visibility for every entity other than
     parameters, with friend units resolved.
  8. Record the public API of every distribution in every context, and every
     `csharp:type-forward` fact.
  9. Write every signature from source and the C# language specification. Do not read a compiler report or a compiler draft of a
     declared slot while writing it. Run the compiler report from Roslyn after
     writing, and settle each disagreement against the language's rule.
validation-criteria: |
  A C# dataset conforms when it conforms to `semantic-oracle-model`, every
  context derives from a `build` or `test` command by the framework rule,
  every indexed document's members agree with the evaluated `Compile` items
  of each unit, every effective visibility agrees with the accessibility
  domain rules and the declared `InternalsVisibleTo` attributes, and every
  public API membership agrees with this profile's rule. Independent review
  confirms facts against source, project files and the C# specification.
  Every signature follows this profile's slots, modes, modifiers and canonical spelling,
  and its slots agree with Roslyn or are listed as `unchecked`.
