# ---
# relationships:
#   references: semantic-oracle-profile-python
# ---
#
# Datasets that the `python/1` schema rejects for one named reason each: values
# and members this profile does not define. Each case applies `patch`, a JSON
# Patch (RFC 6902), to the valid example `base`. The result fails at
# `fails-at` with the schema keyword `keyword`. For `required`,
# `additionalProperties` and `unevaluatedProperties`, `member` names the
# member the error is about, or the list of members. `also` lists any
# further error, by location, keyword and the same `member` rule, that the
# same defect causes; no other error occurs.
cases:
  - name: unknown-mode
    reason: A Python context mode is `runtime` or `typing`.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/mode, value: build}]
    fails-at: /contexts/0/parameters/mode
    keyword: enum
  - name: interpreter-version-as-number
    reason: '`python` is a version string; an unquoted 3.14 is a YAML number.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/python, value: 3.14}]
    fails-at: /contexts/0/parameters/python
    keyword: type
  - name: empty-search-path
    reason: The search path starts with the project's import roots.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/search-path, value: []}]
    fails-at: /contexts/0/parameters/search-path
    keyword: minItems
  - name: unknown-unit-kind
    reason: '`extension` is not a Python unit kind; a compiled extension module is an external entity.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /units/1/kind, value: extension}]
    fails-at: /units/1/kind
    keyword: enum
  - name: unit-attribute
    reason: The Python profile defines no unit attributes.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /units/1/language-version, value: '3.14'}]
    fails-at: /units/1
    keyword: unevaluatedProperties
    member: language-version
  - name: bare-async-language-kind
    reason: '`async` is not a language kind; the async variants are `async-function`, `async-method`, `async-classmethod` and `async-staticmethod`.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /entities/12/language-kind, value: async}]
    fails-at: /entities/12/language-kind
    keyword: anyOf
  - name: mangled-name-as-language-kind
    reason: The language kind names the construct; a mangled name is not a construct name.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /entities/6/language-kind, value: _Shape__secret}]
    fails-at: /entities/6/language-kind
    keyword: anyOf
  - name: namespace-package-without-units
    reason: A namespace package is project-merged and lists its units.
    base: semantic-oracle-profile-python.example.yml
    patch:
      - {op: remove, path: /entities/26/units}
      - {op: add, path: /entities/26/unit, value: plugins-ns}
    fails-at: /entities/26
    keyword: required
    member: units
  - name: module-with-units
    reason: Only a namespace package is project-merged in the Python profile.
    base: semantic-oracle-profile-python.example.yml
    patch:
      - {op: remove, path: /entities/2/unit}
      - {op: add, path: /entities/2/units, value: [shapes-mod]}
    fails-at: /entities/2/units
    keyword: falseSchema
  - name: synthetic-method-without-anchor
    reason: Only a namespace package is a synthetic entity with no anchor.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: remove, path: /entities/11/anchor}]
    fails-at: /entities/11
    keyword: required
    member: anchor
  - name: unknown-declared-visibility
    reason: '`private` is not a Python declared visibility value.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /entities/9/declared-visibility/value, value: private}]
    fails-at: /entities/9/declared-visibility
    keyword: anyOf
  - name: role-the-profile-does-not-use
    reason: The Python profile assigns no occurrence the role `export`.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /references/1/role, value: export}]
    fails-at: /references/1/role
    keyword: enum
  - name: implements-relation
    reason: Protocol conformance without inheritance is out-of-profile; the profile defines no `implements` relations.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /relations/0/kind, value: implements}]
    fails-at: /relations/0/kind
    keyword: enum
  - name: candidates-without-reason
    reason: A `candidates` reference states its reason.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: remove, path: /references/3/reason}]
    fails-at: /references/3
    keyword: required
    member: reason
  - name: candidates-without-candidate-list
    reason: A `candidates` reference lists its candidates.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: remove, path: /references/3/candidates}]
    fails-at: /references/3
    keyword: required
    member: candidates
  - name: single-candidate
    reason: A candidate set has at least two targets; one target is `resolved`.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /references/3/candidates, value: [atlas.fast]}]
    fails-at: /references/3/candidates
    keyword: minItems
  - name: candidates-with-target
    reason: A `candidates` reference has no single `target`.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /references/3/target, value: atlas.fast}]
    fails-at: /references/3/target
    keyword: falseSchema
  - name: nonexistent-with-target
    reason: A `nonexistent` reference denotes no entity.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /references/9/target, value: atlas.portable}]
    fails-at: /references/9/target
    keyword: falseSchema
  - name: indeterminate-without-reason
    reason: An `indeterminate` reference states its reason.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: remove, path: /references/10/reason}]
    fails-at: /references/10
    keyword: required
    member: reason
  - name: stub-of-without-stub
    reason: A `python:stub-of` fact names its stub entity.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: remove, path: /extensions/python:stub-of/0/stub}]
    fails-at: /extensions/python:stub-of/0
    keyword: required
    member: stub
  - name: unknown-exports-visibility
    reason: An import binding is a `re-export` or an `import`.
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: replace, path: /relations/3/visibility, value: public}]
    fails-at: /relations/3/visibility
    keyword: enum

  # ------------------------------------------------------------- signatures
  - name: unknown-signature-modifier
    reason: '`classmethod` is a `language-kind` value, not a modifier.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /public-api/signatures/4/modifiers, value: [classmethod]}]
    fails-at: /public-api/signatures/4/modifiers/0
    keyword: enum
  - name: unknown-parameter-mode
    reason: '`rest` is not a Python parameter mode; `*args` is `var-positional`.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /public-api/signatures/5/parameters/0/mode, value: rest}]
    fails-at: /public-api/signatures/5/parameters/0/mode
    keyword: enum
  - name: where-slot
    reason: 'Python states constraints in `bounds`.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /public-api/signatures/0/where, value: x}]
    fails-at: /public-api/signatures/0/where
    keyword: falseSchema
  - name: init-accessor
    reason: '`init` is a C# accessor.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /public-api/signatures/3/init, value: {type: int}}]
    fails-at: /public-api/signatures/3/init
    keyword: falseSchema
  - name: constructors-slot
    reason: 'A Python constructor is the callable `__init__`.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /public-api/signatures/1/constructors, value: [{returns: int}]}]
    fails-at: /public-api/signatures/1/constructors
    keyword: falseSchema
  - name: base-self-type
    reason: '`self-type` is for a Rust implementation.'
    base: semantic-oracle-profile-python.example.yml
    patch: [{op: add, path: /public-api/signatures/1/bases/0/self-type, value: x}]
    fails-at: /public-api/signatures/1/bases/0/self-type
    keyword: falseSchema
