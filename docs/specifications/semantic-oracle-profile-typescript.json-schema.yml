# ---
# relationships:
#   implements: semantic-oracle-profile-typescript
#   references: semantic-oracle-model
# ---
#
# Dataset schema for profile `typescript/1` of semantic-oracle model
# version 1.
#
# This schema applies the shared record structure of the model schema and
# adds the TypeScript vocabulary only. A context-variant attribute holds
# either one value or a list of `{contexts, value}` entries; each value set
# below is written once as a YAML anchor and applied to both forms.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/beholder/schemas/semantic-oracle/1/typescript/1
title: Semantic-oracle dataset, profile typescript/1
$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/dataset'
properties:
  profile: {const: typescript/1}
  project: {properties: {language: {const: typescript}}}
  contexts: {items: {properties: {parameters: {$ref: '#/$defs/context-parameters'}}}}
  units: {items: {$ref: '#/$defs/unit'}}
  distributions: {items: {properties: {kind: {const: npm-package}}}}
  entities: {items: {$ref: '#/$defs/entity'}}
  externals: {items: {$ref: '#/$defs/kind-and-language-kind'}}
  references:
    items:
      properties:
        role:
          enum: [import, export, qualifier, call, construct, type, read, write, read-write, pattern, attribute]
  relations:
    items:
      properties:
        kind: {enum: [inherits, implements, overrides, aliases, exports]}
        # The profile gives export bindings no visibility.
        visibility: false
  public-api: {properties: {signatures: {items: {$ref: '#/$defs/signature'}}}}
  extensions: {$ref: '#/$defs/extensions'}

$defs:
  text: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/text'}
  id: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/id'}
  locator: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/locator'}
  canonical-path: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/canonical-path'}
  extension-fact: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/extension-fact'}

  context-parameters:
    type: object
    required: [compiler, tsconfig, options, host]
    additionalProperties: false
    properties:
      compiler: {$ref: '#/$defs/text'}
      tsconfig:
        anyOf:
          - const: none
          - $ref: '#/$defs/canonical-path'
      options: {type: object}
      host: {$ref: '#/$defs/text'}

  unit:
    $ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/unit'
    properties:
      kind: {enum: [module, script, declaration-module, declaration-script, json-module]}
      # A unit's name is its canonical document path.
      name: {$ref: '#/$defs/canonical-path'}
    unevaluatedProperties: false

  entity:
    properties:
      declared-visibility: {$ref: '#/$defs/declared-visibility'}
    $ref: '#/$defs/kind-and-language-kind'
    allOf:
      # The global scope is the project-merged namespace: it has `units`,
      # and nothing else has.
      - if: {properties: {kind: {const: namespace}, path: {const: global}}}
        then: {required: [units]}
        else: {properties: {units: false}}
      # The synthetic constructor is anchored on its class name. The global
      # namespace, which spans units, has no anchor.
      - if: {properties: {origin: {const: synthetic}}, required: [unit]}
        then: {required: [anchor]}

  kind-and-language-kind:
    allOf:
      - if: {properties: {kind: {const: module}}}
        then: {properties: {language-kind: {anyOf: [{enum: &module [module, ambient-module]}, {type: array, items: {properties: {value: {enum: *module}}}}]}}}
      - if: {properties: {kind: {const: namespace}}}
        then: {properties: {language-kind: {anyOf: [{enum: &namespace [namespace]}, {type: array, items: {properties: {value: {enum: *namespace}}}}]}}}
      - if: {properties: {kind: {const: type}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type [class, abstract-class, interface, enum, const-enum]}, {type: array, items: {properties: {value: {enum: *type}}}}]}}}
      - if: {properties: {kind: {const: type-alias}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-alias [type]}, {type: array, items: {properties: {value: {enum: *type-alias}}}}]}}}
      # `static` is the language kind the profile records for static members.
      - if: {properties: {kind: {const: callable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &callable [function, method, constructor, index-signature, call-signature, construct-signature, static-method]}, {type: array, items: {properties: {value: {enum: *callable}}}}]}}}
      - if: {properties: {kind: {const: field}}}
        then: {properties: {language-kind: {anyOf: [{enum: &field [field, parameter-property, property-signature, object-member, static-field]}, {type: array, items: {properties: {value: {enum: *field}}}}]}}}
      - if: {properties: {kind: {const: property}}}
        then: {properties: {language-kind: {anyOf: [{enum: &property [accessor, static-accessor]}, {type: array, items: {properties: {value: {enum: *property}}}}]}}}
      - if: {properties: {kind: {const: variable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &variable [let, var, const]}, {type: array, items: {properties: {value: {enum: *variable}}}}]}}}
      - if: {properties: {kind: {const: enum-member}}}
        then: {properties: {language-kind: {anyOf: [{enum: &enum-member [enum-member]}, {type: array, items: {properties: {value: {enum: *enum-member}}}}]}}}
      - if: {properties: {kind: {const: parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &parameter [param]}, {type: array, items: {properties: {value: {enum: *parameter}}}}]}}}
      - if: {properties: {kind: {const: type-parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-parameter [type-param]}, {type: array, items: {properties: {value: {enum: *type-parameter}}}}]}}}
      - properties:
          kind:
            enum: [module, namespace, type, type-alias, callable, field, property, variable, enum-member, parameter, type-parameter]

  declared-visibility-value:
    type: object
    properties:
      value:
        enum: [exported, exported-default, module, public, protected, private, ecmascript-private, inherited, namespace]

  declared-visibility:
    anyOf:
      - $ref: '#/$defs/declared-visibility-value'
      - type: array
        items: {properties: {value: {$ref: '#/$defs/declared-visibility-value'}}}

  extensions:
    type: object
    additionalProperties: false
    properties:
      typescript:module-format:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [unit, format]
          properties:
            unit: {$ref: '#/$defs/id'}
            format: {enum: [esm, cjs]}
          unevaluatedProperties: false
      typescript:type-only:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [reference]
          properties:
            reference: {$ref: '#/$defs/id'}
          unevaluatedProperties: false
      typescript:entry:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [distribution, mode, subpath, module]
          properties:
            distribution: {$ref: '#/$defs/id'}
            mode: {enum: [import, require]}
            subpath: {type: string, pattern: '^\.(/.+)?$'}
            specifier: {$ref: '#/$defs/text'}
            module: {$ref: '#/$defs/id'}
          unevaluatedProperties: false
      typescript:augments:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [entity, target, at]
          properties:
            entity: {$ref: '#/$defs/id'}
            target: {$ref: '#/$defs/id'}
            at: {$ref: '#/$defs/locator'}
          unevaluatedProperties: false

  # ------------------------------------------------------------- signatures
  # The slots, modes and modifiers of this language over the model's records.
  signature:
    $ref: '#/$defs/signature-slots'
    properties:
      alternatives: false
  callable-slots:
    properties:
      where: false
      return-mode: false
      type-parameters: {items: {$ref: '#/$defs/type-parameter'}}
      parameters: {items: {$ref: '#/$defs/parameter'}}
      modifiers: {items: {enum: [abstract, optional, readonly, static]}}
  signature-slots:
    $ref: '#/$defs/callable-slots'
    properties:
      impl: false
      receiver: false
      underlying: false
      bounds: false
      tag: false
      init: false
      delete: false
      overloads: {items: {$ref: '#/$defs/callable-slots'}}
      bases: {items: {$ref: '#/$defs/base'}}
      get: {$ref: '#/$defs/accessor'}
      set: {$ref: '#/$defs/accessor'}
      constructors: {items: {$ref: '#/$defs/signature-group-entry'}}
      call-signatures: {items: {$ref: '#/$defs/signature-group-entry'}}
      construct-signatures: {items: {$ref: '#/$defs/signature-group-entry'}}
      index-signatures: {items: {$ref: '#/$defs/signature-group-entry'}}
  signature-group-entry:
    $ref: '#/$defs/callable-slots'
    properties:
      access: {enum: [private, protected]}
  type-parameter:
    properties:
      variance: {enum: [in, 'in out', out]}
      modifiers: {items: {enum: [const]}}
      kind: {const: type}
  parameter:
    properties:
      default: false
      mode: {enum: [optional, rest]}
  base:
    properties:
      position: false
      type-parameters: false
      self-type: false
      where: false
      bindings: false
  accessor:
    properties:
      access: {enum: [private, protected]}
      modifiers: false
