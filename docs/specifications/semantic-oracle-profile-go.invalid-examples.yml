# ---
# relationships:
#   references: semantic-oracle-profile-go
# ---
#
# Datasets that the `go/1` schema rejects for one named reason each: values
# and members this profile does not define. Each case applies `patch`, a JSON
# Patch (RFC 6902), to the valid example `base`. The result fails at
# `fails-at` with the schema keyword `keyword`. For `required`,
# `additionalProperties` and `unevaluatedProperties`, `member` names the
# member the error is about, or the list of members. `also` lists any
# further error, by location, keyword and the same `member` rule, that the
# same defect causes; no other error occurs.
cases:
  - name: cgo-as-number
    reason: '`cgo` is `true` or `false`.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/cgo, value: 0}]
    fails-at: /contexts/0/parameters/cgo
    keyword: type
  - name: unknown-compiler
    reason: The compiler is `gc` or `gccgo`.
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/compiler, value: tinygo}]
    fails-at: /contexts/0/parameters/compiler
    keyword: enum
  - name: missing-context-parameter
    reason: A context assigns every Go context parameter.
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: remove, path: /contexts/0/parameters/arch-level}]
    fails-at: /contexts/0/parameters
    keyword: required
    member: arch-level
  - name: module-with-version
    reason: A Go module distribution has no version.
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /distributions/0/version, value: v1.2.0}]
    fails-at: /distributions/0/version
    keyword: falseSchema
  - name: unknown-unit-kind
    reason: '`test` is not a Go unit kind; test variants are `package` in mode `test` or `external-test`.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /units/2/kind, value: test}]
    fails-at: /units/2/kind
    keyword: enum
  - name: unit-without-package-name
    reason: A Go unit carries `package-name`.
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: remove, path: /units/0/package-name}]
    fails-at: /units/0
    keyword: required
    member: package-name
  - name: declared-visibility-not-explicit
    reason: Go declared visibility is always explicit.
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /entities/1/declared-visibility/explicit, value: false}]
    fails-at: /entities/1/declared-visibility
    keyword: anyOf
  - name: unknown-declared-visibility
    reason: '`public` is not a Go declared visibility value.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /entities/1/declared-visibility/value, value: public}]
    fails-at: /entities/1/declared-visibility
    keyword: anyOf
  - name: language-kind-of-another-kind
    reason: '`method` is a language kind of `callable`, not of `field`.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /entities/5/language-kind, value: method}]
    fails-at: /entities/5/language-kind
    keyword: anyOf
  - name: kind-the-profile-does-not-map
    reason: The Go profile maps no construct to the common kind `enum-member`.
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /entities/14/kind, value: enum-member}]
    fails-at: /entities/14/kind
    keyword: enum
  - name: synthetic-entity
    reason: The Go profile defines no synthetic entities.
    base: semantic-oracle-profile-go.example.yml
    patch:
      - {op: replace, path: /entities/0/origin, value: synthetic}
      - {op: replace, path: /entities/0/definitions, value: []}
    fails-at: /entities/0/origin
    keyword: enum
  - name: role-the-profile-does-not-use
    reason: The Go profile assigns no occurrence the role `pattern`.
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /references/0/role, value: pattern}]
    fails-at: /references/0/role
    keyword: enum
  - name: exports-relation
    reason: Go packages export by name; the profile defines no `exports` relations.
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /relations/2/kind, value: exports}, {op: add, path: /relations/2/name, value: Meters}]
    fails-at: /relations/2/kind
    keyword: enum
  - name: embed-files-document-not-canonical
    reason: '`go:embed-files` documents are canonical paths.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /extensions/go:embed-files/0/documents/0, value: ./shapes.txt}]
    fails-at: /extensions/go:embed-files/0/documents/0
    keyword: pattern
  - name: pointer-receiver-with-unknown-member
    reason: '`method` is not a member of `go:pointer-receiver`.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /extensions/go:pointer-receiver/0/method, value: geometry.Circle.Area}]
    fails-at: /extensions/go:pointer-receiver/0
    keyword: unevaluatedProperties
    member: method

  # ------------------------------------------------------------- signatures
  - name: modifiers-slot
    reason: 'Go has no modifiers; a pointer receiver is the `receiver` slot.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /public-api/signatures/6/modifiers, value: [pointer]}]
    fails-at: /public-api/signatures/6/modifiers
    keyword: falseSchema
  - name: parameter-mode
    reason: 'A Go variadic parameter is written `...T` in its type.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /public-api/signatures/4/parameters/0/mode, value: rest}]
    fails-at: /public-api/signatures/4/parameters/0/mode
    keyword: falseSchema
  - name: where-slot
    reason: 'Go states constraints in `bounds`.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /public-api/signatures/9/where, value: x}]
    fails-at: /public-api/signatures/9/where
    keyword: falseSchema
  - name: base-position
    reason: 'Go base order has no meaning.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /public-api/signatures/1/bases/0/position, value: 0}]
    fails-at: /public-api/signatures/1/bases/0/position
    keyword: falseSchema
  - name: accessor-slot
    reason: 'Go has no accessors.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /public-api/signatures/3/get, value: {type: string}}]
    fails-at: /public-api/signatures/3/get
    keyword: falseSchema
  - name: const-type-parameter
    reason: 'A Go type parameter has kind `type`.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: replace, path: /public-api/signatures/9/type-parameters/0/kind, value: lifetime}]
    fails-at: /public-api/signatures/9/type-parameters/0/kind
    keyword: const
  - name: abi-slot
    reason: '`abi` is a Rust slot.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /public-api/signatures/3/abi, value: C}]
    fails-at: /public-api/signatures/3/abi
    keyword: falseSchema
  - name: implementations-slot
    reason: '`implementations` is a Rust slot; Go `bases` holds implemented interfaces.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /public-api/signatures/0/implementations, value: [{type: 'x', self-type: 'y'}]}]
    fails-at: /public-api/signatures/0/implementations
    keyword: falseSchema
  - name: auto-traits-slot
    reason: '`auto-traits` is a Rust slot.'
    base: semantic-oracle-profile-go.example.yml
    patch: [{op: add, path: /public-api/signatures/3/auto-traits, value: [Send]}]
    fails-at: /public-api/signatures/3/auto-traits
    keyword: falseSchema
