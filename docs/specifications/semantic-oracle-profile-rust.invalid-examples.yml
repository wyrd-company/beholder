# ---
# relationships:
#   references: semantic-oracle-profile-rust
# ---
#
# Datasets that the `rust/1` schema rejects for one named reason each: values
# and members this profile does not define. Each case applies `patch`, a JSON
# Patch (RFC 6902), to the valid example `base`. The result fails at
# `fails-at` with the schema keyword `keyword`. For `required`,
# `additionalProperties` and `unevaluatedProperties`, `member` names the
# member the error is about, or the list of members. `also` lists any
# further error, by location, keyword and the same `member` rule, that the
# same defect causes; no other error occurs.
cases:
  - name: unknown-context-parameter
    reason: '`rustflags` is not a Rust context parameter.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: add, path: /contexts/0/parameters/rustflags, value: []}]
    fails-at: /contexts/0/parameters
    keyword: additionalProperties
    member: rustflags
  - name: missing-context-parameter
    reason: A context assigns every Rust context parameter.
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: remove, path: /contexts/0/parameters/profile}]
    fails-at: /contexts/0/parameters
    keyword: required
    member: profile
  - name: unknown-mode
    reason: '`release` is not a Rust context mode.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/mode, value: release}]
    fails-at: /contexts/0/parameters/mode
    keyword: enum
  - name: selection-names-unknown-unit-kind
    reason: '`selection` lists Rust unit kinds; `cdylib` is a crate type.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /contexts/0/parameters/selection, value: [cdylib]}]
    fails-at: /contexts/0/parameters/selection/0
    keyword: enum
  - name: unknown-unit-kind
    reason: '`staticlib` is a crate type of the `lib` unit kind, not a unit kind.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /units/0/kind, value: staticlib}]
    fails-at: /units/0/kind
    keyword: enum
  - name: unknown-unit-attribute
    reason: '`rustc-version` is not a Rust unit attribute.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: add, path: /units/0/rustc-version, value: 1.97.1}]
    fails-at: /units/0
    keyword: unevaluatedProperties
    member: rustc-version
  - name: missing-unit-key-member
    reason: The unit key includes the Cargo target name.
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: remove, path: /units/0/target-name}]
    fails-at: /units/0
    keyword: required
    member: target-name
  - name: unknown-platform
    reason: A unit platform is `target` or `host`.
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /units/0/platform, value: device}]
    fails-at: /units/0/platform
    keyword: anyOf
  - name: distribution-kind
    reason: A Rust distribution has kind `crate`.
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /distributions/0/kind, value: package}]
    fails-at: /distributions/0/kind
    keyword: const
  - name: language-kind-of-another-kind
    reason: '`fn` is a language kind of `callable`, not of `type`.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /entities/8/language-kind, value: fn}]
    fails-at: /entities/8/language-kind
    keyword: anyOf
  - name: unknown-language-kind
    reason: '`class` is not a Rust language kind.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /entities/8/language-kind, value: class}]
    fails-at: /entities/8/language-kind
    keyword: anyOf
  - name: unknown-language-kind-in-variant-list
    reason: Every value of a context-variant language kind is a Rust language kind.
    base: semantic-oracle-profile-rust.example.yml
    patch:
      - op: replace
        path: /entities/8/language-kind
        value: [{contexts: [build], value: struct}, {contexts: [build-extras], value: record}]
    fails-at: /entities/8/language-kind
    keyword: anyOf
  - name: kind-the-profile-does-not-map
    reason: The Rust profile maps no construct to the common kind `namespace`.
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /entities/8/kind, value: namespace}]
    fails-at: /entities/8/kind
    keyword: enum
  - name: unknown-declared-visibility
    reason: '`public` is not a Rust declared visibility value.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /entities/8/declared-visibility/value, value: public}]
    fails-at: /entities/8/declared-visibility
    keyword: anyOf
  - name: restricted-visibility-without-path
    reason: '`pub(in <path>)` names a path.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /entities/18/declared-visibility/value, value: pub(in )}]
    fails-at: /entities/18/declared-visibility
    keyword: anyOf
  - name: explicit-inherited-visibility
    reason: '`inherited` is never stated by the source.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /entities/14/declared-visibility/explicit, value: true}]
    fails-at: /entities/14/declared-visibility
    keyword: anyOf
  - name: synthetic-entity
    reason: The Rust profile defines no synthetic entities.
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /entities/0/origin, value: synthetic}]
    fails-at: /entities/0/origin
    keyword: enum
  - name: project-merged-entity
    reason: The Rust profile defines no project-merged kind, so no entity has `units`.
    base: semantic-oracle-profile-rust.example.yml
    patch:
      - {op: remove, path: /entities/8/unit}
      - {op: add, path: /entities/8/units, value: [geometry-lib]}
    fails-at: /entities/8/units
    keyword: falseSchema
  - name: non-resolved-disposition
    reason: Rust references are `resolved` or `external`; `indeterminate` does not occur.
    base: semantic-oracle-profile-rust.example.yml
    patch:
      - {op: remove, path: /references/3/target}
      - {op: add, path: /references/3/disposition, value: indeterminate}
      - {op: add, path: /references/3/reason, value: unknown}
    fails-at: /references/3/disposition
    keyword: enum
  - name: unknown-extension-kind
    reason: '`rust:inline-expansion` is not a Rust extension.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: add, path: /extensions/rust:inline-expansion, value: []}]
    fails-at: /extensions
    keyword: additionalProperties
    member: rust:inline-expansion
  - name: extension-of-another-profile
    reason: '`go:embeds` is not an extension of the Rust profile.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: add, path: /extensions/go:embeds, value: []}]
    fails-at: /extensions
    keyword: additionalProperties
    member: go:embeds
  - name: extension-fact-without-member
    reason: A `rust:reachable-unnameable` fact names `via`.
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: remove, path: /extensions/rust:reachable-unnameable/0/via}]
    fails-at: /extensions/rust:reachable-unnameable/0
    keyword: required
    member: via
  - name: extension-fact-with-unknown-member
    reason: '`depth` is not a member of `rust:macro-expansion`.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: add, path: /extensions/rust:macro-expansion/0/depth, value: 1}]
    fails-at: /extensions/rust:macro-expansion/0
    keyword: unevaluatedProperties
    member: depth
  - name: extension-member-of-wrong-type
    reason: '`invocation` is a site, not an id.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /extensions/rust:macro-expansion/0/invocation, value: geometry.marker}]
    fails-at: /extensions/rust:macro-expansion/0/invocation
    keyword: type
  - name: exports-without-visibility
    reason: A Rust `exports` relation states the visibility of its `use` item.
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: remove, path: /relations/4/visibility}]
    fails-at: /relations/4
    keyword: required
    member: visibility
  - name: unknown-exports-visibility
    reason: '`public` is not a Rust visibility.'
    base: semantic-oracle-profile-rust.example.yml
    patch: [{op: replace, path: /relations/4/visibility, value: public}]
    fails-at: /relations/4/visibility
    keyword: anyOf
