description: |
  # TypeScript semantic-oracle profile, `typescript/1`

  This profile applies `semantic-oracle-model` version 1 to TypeScript and to
  JavaScript that a TypeScript program includes. It defines only TypeScript
  mappings and TypeScript extensions.

  ## Primary sources

  - TypeScript Handbook and Modules Reference: Theory, Module resolution,
    `package.json` `exports`, `imports`, conditions, `typesVersions`,
    `moduleSuffixes`, ESM and CommonJS interoperability.
    <https://www.typescriptlang.org/docs/handbook/modules/reference.html>
  - TypeScript Handbook: Declaration Merging, Namespaces, Classes, Decorators,
    JSX, JSDoc reference for checked JavaScript.
    <https://www.typescriptlang.org/docs/handbook/>
  - TSConfig reference. <https://www.typescriptlang.org/tsconfig/>
  - Node.js Packages: `exports`, conditional exports, `null` targets, subpath
    patterns, self-referencing, `imports`.
    <https://nodejs.org/api/packages.html>
  - ECMAScript Language Specification: Modules.
    <https://tc39.es/ecma262/>
  - Corpus toolchain: `typescript` 5.9.3; `typescript` 5.4.5 in projects
    that declare the version boundary; Node.js 22.6 or later.

  ## Contexts

  Context parameters:

  | Parameter | Value |
  | --- | --- |
  | `compiler` | The `typescript` package version that runs. |
  | `tsconfig` | The project-relative path of the configuration file passed to `tsc -p`, or `none` for a command-line program. |
  | `options` | The effective compiler options: the `compilerOptions` object that `tsc --showConfig` prints for the configuration. |
  | `host` | `tsc`, or the name of the alternate tool or runtime the project declares, such as a bundler or a runtime with type stripping. |

  Each command in the project's `build` task that type-checks or emits a
  program defines a context, unless another command defines the same
  parameter values. A `--noEmit` command that repeats a `build` command's
  configuration defines no further context. A command in the `build` task
  that runs an alternate host defines a context with that `host`.

  ## Units and distributions

  A unit is one source file of a program:

  | Unit kind | File |
  | --- | --- |
  | `module` | A file that the program treats as a module. |
  | `script` | A file that contributes declarations to the global scope. |
  | `declaration-module` | A `.d.ts`, `.d.mts` or `.d.cts` file that is a module. |
  | `declaration-script` | A declaration file that contributes to the global scope. |
  | `json-module` | A JSON file that `resolveJsonModule` imports. |

  A unit's `name` is its canonical document path, and the unit key is that
  name.

  The global scope is a project-merged namespace entity with path `global`
  and `units` listing every `script` and `declaration-script` unit, and every
  module that contains `declare global`. It has no definition site and no
  `anchor`; its key identifies it. Its effective visibility is `all` at
  every boundary.

  A distribution is a package directory under the project with a
  `package.json` that has a `name`: `kind: npm-package`, `name` and `version`
  from that file. A unit belongs to the distribution of the nearest enclosing
  package directory. The project root package is a distribution even when it
  is `private`.

  ## Documents

  | File class | Disposition |
  | --- | --- |
  | `.ts`, `.tsx`, `.mts`, `.cts`, `.d.ts`, `.d.mts`, `.d.cts` files, and `.js`, `.jsx`, `.mjs`, `.cjs` files when `allowJs` holds, that a context's program contains | `indexed` |
  | Other tracked files of those extensions | `inactive` |
  | JSON files a program imports as modules | `indexed` |
  | `package.json`, `tsconfig*.json`, `jsconfig*.json` | `configuration` |
  | Tracked third-party packages under `node_modules` or a vendor directory | `external` |
  | Lockfiles, Markdown, task files, other files | `out-of-profile` |

  A program contains its root files, every file module resolution or a
  `/// <reference>` directive reaches, and every `types` package it loads.
  A file reached through a workspace link is identified by its path under the
  project, not by the link path. A file is `origin: generated` when the
  project's `generate` task writes it.

  ## Paths

  - A module path is the canonical document path, written in double quotes,
    such as `"src/shapes.ts"`. An ambient module declared with
    `declare module "x"` has the path `ambient:"x"`, its definition site
    spans the string contents without quotes, and its `parent` is `global`
    when it is declared in the global scope.
  - A declaration path is `<module path>#<name>` followed by `.`-separated
    member names, such as `"src/shapes.ts"#Circle.area`. A static member's
    segment is `static:<name>`, such as `"src/shapes.ts"#Circle.static:unit`,
    so that a static and an instance member of one name have distinct
    paths; its `language-kind` is `static-method`, `static-field` or
    `static-accessor`.
  - A default export is `#default`; an `export =` target is `#export=`.
  - A private name `#x` keeps its `#` in the member segment.
  - A global declaration is `global#<name>`.
  - Signatures of an overloaded function belong to one entity.
  - A consumer path is `<mode>:<specifier>#<export>` followed by member
    segments as declaration paths write them, and an entry module's own
    consumer path is `<mode>:<specifier>`, where `<mode>` is `import` or `require` and `<specifier>` is the
    package name followed by an exported subpath, such as
    `import:@scope/pkg/utils#format`.

  ## Entities

  | Construct | Kind | `language-kind` |
  | --- | --- | --- |
  | source file module | `module` | `module` |
  | ambient module | `module` | `ambient-module` |
  | `namespace`, `module` block | `namespace` | `namespace` |
  | `class` | `type` | `class` or `abstract-class` |
  | `interface` | `type` | `interface` |
  | `enum`, `const enum` | `type` | `enum` or `const-enum` |
  | `type` alias | `type-alias` | `type` |
  | function declaration, method, constructor | `callable` | `function`, `method`, `static-method` or `constructor` |
  | index, call and construct signatures of an interface or type literal member | `callable` | `index-signature`, `call-signature` or `construct-signature` |
  | class field, parameter property | `field` | `field`, `static-field` or `parameter-property` |
  | property signature of an interface | `field` | `property-signature` |
  | `get` and `set` accessor pair | `property` | `accessor` or `static-accessor` |
  | module-level `let`, `var` | `variable` | `let` or `var` |
  | module-level `const` | `variable` | `const` |
  | enum member | `enum-member` | `enum-member` |
  | parameter | `parameter` | `param` |
  | type parameter | `type-parameter` | `type-param` |

  Declarations that merge, as Declaration Merging defines, are one entity
  with several definition sites when they share a meaning: interfaces with
  interfaces, namespaces with namespaces, enums with enums, and a class with
  interfaces of the same name, where the entity has `language-kind` `class`.
  A function, class or enum and a namespace of the same name are two
  entities of different kinds.

  Module augmentation is the profile's augmentation form. A
  `declare module "<specifier>"` block in a module, whose specifier
  resolves in the context to another module, merges as if declared in the
  resolved module. Each declaration in the block that merges with a
  declaration of the resolved module is a definition site of that entity,
  which keeps the resolved module's unit and path. Every declaration in the
  block, at any nesting depth, that adds a new name is an entity of the
  resolved module's unit with its site in the augmenting document. Its
  `parent` is the entity that contains it after merging, and its path
  appends its name to that parent's path by the path grammar: a member
  added to `RecordShape` of `"src/a.ts"` has path `"src/a.ts"#RecordShape.<member>`
  and parent `RecordShape`; only a declaration directly in the block that
  merges with no existing declaration has the resolved module as parent. A
  `declare global` block augments the global namespace entity in the same
  way. When the augmented declaration is
  external, such as a standard library interface, an added member is an
  entity of the augmenting unit with path `<augmenting module path>#<external
  declaration name>.<member>`, `parent` absent, and a
  `typescript:augments` fact naming the external declaration. The
  augmenting document's own unit membership is unchanged.

  Import bindings, `import x = require()` bindings and `export` specifiers
  are bindings, not entities. Members of type literals and object literal
  expressions are out-of-profile, except object literal members that a
  module-level `const` exports, which are `field` entities with
  `language-kind` `object-member`. The parameters of a function type or a
  signature in a type literal are not entities. An object literal property
  name that matches a member of the literal's contextual type is not a
  reference, because the match depends on an inferred type.

  A `declare module "x"` block whose specifier resolves to no module in the
  context augments nothing and declares no entity. A module that augments
  itself merges its declarations into its own module entity.

  ## Declared visibility

  Values for module-level declarations: `exported`, `exported-default` and
  `module`, with `module` the default. Values for class members: `public`,
  `protected`, `private` and `ecmascript-private` for `#` names, with
  `public` the default. Interface, type and enum members: `inherited`.
  Namespace members: `exported` or `namespace`. A source-file module has
  `{value: exported, explicit: false}`; it has no name token, so it has no
  definition site and no `anchor`.

  ## Effective visibility

  - `unit`: `all` for module-level declarations and `public` members.
    `private` and `ecmascript-private` members: `scoped` to the class.
    `protected` members: `[{access: scoped, scope: [<class>]}, subtypes]`.
    Non-exported namespace members: `scoped` to the namespace.
  - `project`: `all` for exported declarations and their `public` members;
    `subtypes` for `protected` members; `none` for non-exported
    declarations and `private` members. Global declarations: `all`.
  - `external`: as `project`, and `none` when no consumer path of the
    distribution reaches the declaration's module in the context.

  ## Public API

  The public API of a distribution is its members and their signatures.

  ### Membership

  A distribution's members in a context are the entities that have a consumer
  path. Rules 1 and 2 select the entry module of each subpath and
  mode; the dataset records each selection as a `typescript:entry` fact.
  Rule 3 gives the members of an entry module.

  1. When `package.json` has `exports` and the context's module resolution
     consults it (`moduleResolution` `node16`, `nodenext` or `bundler` with
     `resolvePackageJsonExports` true, its default for those modes), each
     subpath, after pattern expansion and after removing subpaths whose
     target is `null`, selects an entry for mode `import` and mode
     `require`. The entry is found by TypeScript's type-first exports
     resolution: keys are visited in object order; an enabled key's target
     is resolved, recursively for nested condition objects, and succeeds
     only when TypeScript's extension substitution finds a file the
     program can contain for it: a TypeScript or declaration file, or a
     JavaScript file when `allowJs` holds; when it does not, resolution continues with
     the next enabled key; a `null` target ends resolution with no entry.
     The enabled conditions are those the TypeScript Modules Reference lists for the context's
     `moduleResolution`, plus `customConditions` and `default`: `types`,
     `node`, and `import` or `require` by mode for `node16` and `nodenext`;
     `types`, and `import` or `require` by mode for `bundler`. A
     `types@<range>` condition is enabled when the context's compiler
     version is in the range. Nested condition objects are resolved the same
     way. The file that the first successful key yields is the entry
     module.
  2. Otherwise, including `moduleResolution` `node10` and `classic` and
     `resolvePackageJsonExports` false, `types`, `typings` or `main`, with
     `typesVersions` applied for the context's compiler version, selects the
     entry module for both modes; without them, the package directory's
     `index` file does, as TypeScript resolves it. A deep import of another
     file of such a package is not a consumer path.
  3. The members are the entry module itself, under each subpath and mode
     that selects it, because a consumer can name it, even when it has no
     exports, and its export namespace: its declarations
     whose declared visibility is `exported`, under their names, or
     `exported-default`, under `default`, and every name an `exports`
     relation adds, with `export *` and re-exports followed. A member module
     or namespace adds its own export namespace, with `.` between names. A
     member class, interface or enum adds its `public`, `inherited` and
     `protected` members, with `protected` members recorded with
     `access: subtypes`. Constructors and members without a name, such as
     index signatures, are not members. An external entity that a re-export
     names is a member.

  An entry module that the context's program does not contain has no
  `typescript:entry` fact in that context. The specifier of a consumer path
  is the package name followed by the subpath, except where consumers write
  another: an `@types` package is imported by the name of the package it
  types (`@types/scope__name` as `@scope/name`), and an ambient module that
  a distribution declares is imported by its module name. A
  `typescript:entry` fact then states that specifier. Each ambient module
  that a file of the entry selection declares is an entry of its own: its
  fact has the subpath of that selection, the ambient module entity as
  `module` and its module name as `specifier`, so that several ambient
  modules of one distribution have distinct facts.

  ### Signatures

  A project member's signature follows the model's Signatures section. A constructor
  and an unnamed member are not public API members. Their signatures are slots of the
  owning type, in effective order.

  | `language-kind` | Slots |
  | --- | --- |
  | `function`, `method`, `static-method` | `type-parameters`, `parameters`, `returns`, `modifiers`; `overloads` for several signatures |
  | `class`, `abstract-class` | `type-parameters`, `bases`, `constructors`, `index-signatures`, `modifiers` |
  | `interface` | `type-parameters`, `bases`, `call-signatures`, `construct-signatures`, `index-signatures` |
  | `enum`, `const-enum` | None |
  | `type` | `type-parameters`, `type` |
  | `field`, `static-field`, `parameter-property`, `property-signature`, `object-member` | `type`, `modifiers` |
  | `accessor`, `static-accessor` | `get`, `set`, `modifiers` |
  | `let`, `var`, `const` | `type` |
  | `enum-member` | `value` |

  `overloads` holds the overload signatures of an entity, in effective order
  including the precedence of merged declarations, and the implementation signature
  of an overloaded function is not one of them. A `constructors` entry has `access`
  when the constructor is `protected` or `private`, so that restricted construction
  stays visible. A class that declares no constructor has one `constructors` entry for
  its synthetic constructor, with its inherited parameters as `{inferred}` slots. That
  entry's source declaration is the owning class.

  Parameter modes: `optional` and `rest`. A parameter with a default has no `default`
  slot, and its mode follows the `?` that the declaration emit states: a default
  before a required parameter emits no `?`, so `f(first: number = 1, second: string)`
  has `{name: first, type: {inferred: "number | undefined"}}` and no mode. A `this`
  parameter is the first entry, named `this`. A destructured parameter has no `name`.

  Modifiers: `abstract`, `optional`, `readonly` and `static`. `optional` is distinct
  from `undefined` in the type, because a required member can have that type. `async`
  is not a modifier, because the return type states its effect on a caller.

  A type parameter has `variance`, `in`, `out` or `in out`, and `modifiers`, `const`,
  when it states them.

  Canonical spelling:

  - Predeclared names are written bare: `any`, `bigint`, `boolean`, `never`, `null`,
    `number`, `object`, `string`, `symbol`, `undefined`, `unknown` and `void`, with
    `this` for the polymorphic this type.
  - `string[]` for `Array<string>`, and `readonly string[]` for `ReadonlyArray<string>`.
    Parentheses appear only where the syntax needs them. The reference audit does not
    expect a token that a canonical form removes.
  - Union and intersection members are sorted within one operator. Property members of
    a type literal are sorted by name, as `{ extra: string; kind: "workspace" }`.
    Call and construct signatures and repeated method signatures of a type literal keep
    their effective overload order. A member sorts by its name however it is written:
    `readonly a` and `"a"` are both named `a`, so `{ f(): X; "f"(): Y }` is one method's
    overloads, in order.
  - A literal type is syntax, not a name, and is written as itself: `true`, `false`,
    `1`, `-1`, `1n`, or a string in double quotes.
  - A string literal type uses double quotes. A type literal uses `{ a: T; b?: U }`, a
    function type `(x: T) => U`, and `, ` between arguments.
  - `/*elided*/ any` in a declaration emit is written `any`.

  Inference: an unannotated return, `const`, `let`, field or accessor of a member is
  `{inferred: ...}` with the type that `tsc --declaration` emits for the context's
  options and compiler version, in canonical spelling. A `.d.ts` member is all declared.
  TypeScript has no current language specification, and a consumer of a published
  package compiles against that emit, so the compiler supplies these slots. It runs
  outside the project tree.

  The compiler report comes from `tsc --declaration`.

  ## References

  The target is the declaration that the checker's symbol resolution selects
  for the identifier, after following import aliases, `export` specifiers,
  `export *` and `import x = require()` aliases. A namespace import
  `import * as ns` binds a module: `ns` targets the module entity.

  | Occurrence | Role |
  | --- | --- |
  | Identifier in an import clause or import specifier | `import` |
  | Identifier in an export specifier or `export =` | `export` |
  | Module specifier string | `import` for import and `import()` forms, `export` for re-export forms |
  | Left side of a qualified name or property access that selects a module, namespace, class or enum | `qualifier` |
  | Callee of a call expression, tagged template tag | `call` |
  | Expression of a `new` expression, JSX element tag name | `construct` |
  | Type reference, `extends` and `implements` clauses, `typeof` type query operand, `keyof` operand | `type` |
  | Property access, element access with a string literal, string literal in an indexed access type, identifier used as a value | `read` |
  | Assignment target | `write` |
  | Compound assignment, increment, decrement target | `read-write` |
  | Name in a destructuring pattern that selects a property | `pattern` |
  | Decorator expression | `attribute` |
  | JSX attribute name that selects a declared property of the props type | `write` |

  A module specifier string is a value site that spans the string contents
  without quotes; an observation spanning the quotes is accepted. Its target
  is the module entity that module resolution selects in the context,
  including `paths`, `imports` (`#` specifiers), `exports` with the
  enabled conditions that Public API defines, and `moduleSuffixes`.

  A `new` expression or JSX tag targets the class entity. Equivalence rule
  `typescript:constructor-for-class`: an observation targeting the class's
  constructor entity is accepted as `equivalent`.

  A shorthand property `{ x }` in an object literal has one reference to the
  binding's target with role `read`.

  Property access whose receiver has type `any` names no declaration; when
  the receiver's value comes from outside project source, the reference is
  `indeterminate`. Accesses on receivers whose declared type has no such
  property do not occur in valid source.

  ## Relations

  - `inherits`: class `extends` and interface `extends`, with `at` on the
    base name.
  - `implements`: class `implements`, with `at` on the interface name.
    Structural assignability without a clause is not a relation.
  - `overrides`: a class member to the same-named member of its base class
    chain, and a class member to the member of an interface its class
    `implements`.
  - `aliases`: an `import x = N.y` declaration inside a namespace, from the
    resulting namespace member to `N.y`, and a `type` alias whose right side
    is a type reference without type arguments, including an
    `import("x").T` type.
  - `exports`: each name an `export` specifier, `export *`, `export * as` or
    `export =` adds to a module's export namespace, with `name` set to the
    exported name and `default` for default exports.

  ## Generated, synthetic and external entities

  - Files the `generate` task writes are generated documents. Entities in
    them are `origin: generated`.
  - A class without a declared constructor has a synthetic `constructor`
    entity with `anchor` on the class name.
  - External key path: `<package>/<file path in the package>#<name>`, such as
    `react/index.d.ts#Component`. Standard library declarations use the
    distribution `typescript` and the `lib` file, such as
    `typescript/lib/lib.es5.d.ts#Array`. `version` is present when the
    project resolves two versions of a package.

  ## Dispositions

  - `indeterminate`: property access on an `any` receiver whose value comes
    from outside project source, such as parsed input.
  - `candidates`: an `import()` whose specifier is one of a finite set of
    literals selected at run time.
  - `nonexistent`: an `import()` of a specifier that resolves to no module,
    inside a handler of the rejection.

  ## Extensions

  | Kind | Members | Key | Compared |
  | --- | --- | --- | --- |
  | `typescript:module-format` | `unit`, `format`: `esm` or `cjs`, and the fact's `contexts` | `unit` | `format` |
  | `typescript:entry` | `distribution`, `mode`: `import` or `require`, `subpath`: `.` or `./<subpath>` as `exports` writes it after pattern expansion, `.` when Public API rule 2 applies, `specifier`: the specifier consumers write, where Public API states one, `module`: the entry module entity | `distribution`, `mode`, `subpath`, `specifier` | `module` |
  | `typescript:type-only` | `reference`: the id of an import, export or module-specifier reference that is elided from emit | `reference` | none |
  | `typescript:augments` | `entity`: a member an augmentation adds, `target`: the external declaration it augments, `at`: the augmentation block's name site | `entity` | `target` |

  A unit's module format in a context is the format TypeScript gives the
  file: `esm` for `.mts`, `.d.mts` and `.mjs` files and `cjs` for `.cts`,
  `.d.cts` and `.cjs` files in every context; for other files, under
  `module` `node16` or `nodenext`, the format Node.js detects from the
  nearest `package.json` `type`; under any other `module` setting, the
  format of the configured `module` emit, `esm` for the ECMAScript module
  settings and `cjs` for `commonjs`. `script`, `declaration-script` and
  `json-module` units have no module format and no `typescript:module-format`
  fact.

  All four extensions are required. A subpath and mode whose resolution
  yields no file the program can contain has no `typescript:entry` fact.

  ## Authoring obligation

  For every TypeScript project dataset:

  1. Inventory every tracked file, and the units and contexts of every
     indexed file.
  2. Declare every context the `build` task defines, with `--showConfig`
     options.
  3. Declare every unit, its `typescript:module-format` per context, and
     every distribution.
  4. Record every entity of the kinds in the entity table, including merged
     declarations with all their sites, module and global augmentations,
     `typescript:augments` facts and synthetic constructors.
  5. Record every in-profile reference, including module specifier strings,
     JSX tags and attributes, decorators and type-only imports.
  6. Record every relation of the kinds above.
  7. Record declared and effective visibility for every entity other than
     parameters.
  8. Record the `typescript:entry` facts and the public API of every
     distribution in every context, for both modes.
  9. Write every declared slot from source, and take each `{inferred}` slot from `tsc --declaration` run outside the project tree. Do not read a compiler report or a compiler draft of a
     declared slot while writing it. Run the compiler report from `tsc --declaration` after
     writing, and settle each disagreement against the language's rule.
validation-criteria: |
  A TypeScript dataset conforms when it conforms to `semantic-oracle-model`,
  every context derives from a `build` task command, every module specifier
  reference's target agrees with module resolution under that context's
  options and conditions, and every public API membership agrees with the
  entry-module rule of this profile. Independent review confirms facts
  against source, `package.json` and `tsconfig` files, the TypeScript
  Handbook and the Node.js package documentation.
  Every signature follows this profile's slots, modes, modifiers and canonical spelling,
  and its slots agree with `tsc --declaration` or are listed as `unchecked`.
