description: |
  # Rust semantic-oracle profile, `rust/1`

  This profile applies `semantic-oracle-model` version 1 to Rust. It defines
  only Rust mappings and Rust extensions; every common term keeps the meaning
  that model gives it.

  ## Primary sources

  - The Rust Reference: Crates and source files, Modules, Items, Paths,
    Names (namespaces, scopes, preludes, name resolution), Use declarations,
    Visibility and privacy, Implementations, Traits, Special types and traits,
    Macros by example, Procedural macros, Conditional compilation, Attributes.
    <https://doc.rust-lang.org/reference/>
  - The Cargo Book: Cargo targets, Features, Workspaces, Build scripts,
    Profiles, Specifying dependencies.
    <https://doc.rust-lang.org/cargo/>
  - The rustc book: `--cfg`, `--test`, `--edition`, `--crate-type`.
    <https://doc.rust-lang.org/rustc/>
  - Toolchain: the stable `rustc` and Cargo release that each context's
    `release` names. `authoring.tools` records the exact release used.

  ## Contexts

  Context parameters:

  | Parameter | Value |
  | --- | --- |
  | `mode` | `build`, `test`, `doc` or `doctest`: whether the command's selected targets compile as ordinary compilations, test-harness compilations (`--test`, which sets `cfg(test)`), rustdoc compilations (which set `cfg(doc)`), or rustdoc's doctest collection over crate source (`rustdoc --test`, which sets `cfg(doctest)`). |
  | `selection` | The sorted unit kinds Cargo compiles in this mode for the command, after target-selection flags such as `--lib`, `--bins`, `--examples`, `--tests`, `--benches` and `--all-targets`. |
  | `manifest` | The project-relative path of the manifest Cargo is invoked on. |
  | `packages` | The selected packages, or `workspace`. |
  | `target` | The target triple. |
  | `cfg` | The sorted list of additional `--cfg` options from `RUSTFLAGS` or `RUSTDOCFLAGS`. |
  | `features` | The feature flags the command passes: `--features`, `--all-features`, `--no-default-features`. |
  | `profile` | The Cargo profile name. |
  | `release` | The release parameter: the `rustc` release as `1.N`, which decides the standard library, and so which inherent or trait method a call resolves to. A `rust-toolchain.toml` channel that names a release selects it. |

  Each compilation that a command in the project's `build` and `test` tasks
  performs has a mode. A command defines one context per mode in which it
  compiles at least one unit, unless another command defines the same
  parameter values. `cargo build` and `cargo check` compile `lib` and `bin`
  targets in mode `build`; with `--all-targets` they also compile examples
  in mode `build` and test, bench and unit-test targets in mode `test`.
  `cargo test` compiles unit-test and integration-test targets in mode
  `test` and examples in mode `build`. `cargo doc` compiles in mode `doc`.
  `cargo test` also performs the doctest collection of each `lib` target it
  tests, in mode `doctest`. Formatting commands define no context. A
  compilation that a command performs only as a dependency of the targets it
  selects, such as the check compilation of a library that
  `cargo doc --no-deps` documents against, defines no context of its own;
  its unit is a unit of the command's context with the unit attribute
  `mode` set to the mode it compiles in, normally `build`. The code inside
  doc comments, which doctests compile, is out-of-profile. When a command
  omits `--target`, `target` is the corpus host triple,
  `x86_64-unknown-linux-gnu`.

  ## Units and distributions

  A unit is one compilation of one Cargo target of one package for one
  platform:

  | Unit kind | Cargo target |
  | --- | --- |
  | `lib` | The library target, including `rlib`, `dylib`, `cdylib` and `staticlib` crate types. |
  | `proc-macro` | A library target with `proc-macro = true`. |
  | `bin` | A binary target. |
  | `example` | An example target. |
  | `integration-test` | A test target under `tests/` or declared with `[[test]]`. |
  | `bench` | A bench target. |
  | `build-script` | The build script. |

  A unit's platform is `target` when Cargo compiles it for the context's
  target triple and `host` when Cargo compiles it for the host: build
  scripts, procedural macros, and the dependencies of either. Under feature
  resolver 2, a package that a context needs on both platforms is two units,
  one per platform, each with its own resolved features.

  In mode `test`, the `lib` and `bin` units are the unit-test compilations
  with `cfg(test)` set. Integration-test units reference `lib` entities in
  the same context. Valid source never names a `cfg(test)`-only item from an
  integration test, so this unification loses no reference fact.

  A unit's `name` is its crate name. A unit record carries the Rust
  attributes `package` and `package-version`, the package name and version
  from its manifest, `target-name`, the Cargo target name, `edition`,
  `platform`, `features`, the sorted features Cargo's feature resolver
  enables for that unit, and `mode`, present when the unit's compilation
  mode differs from its context's `mode` in some context. `features` and
  `mode` are context-variant in the model's attribute form, so a `mode`
  list covers every context of the unit, with the context's own mode where
  the two agree.
  The unit key is `package`, `package-version`, the unit kind,
  `target-name` and `platform`.

  A distribution is a package that has a `lib` or `proc-macro` unit:
  `kind: crate`, `name` and `version` from the package manifest. Other units
  have no distribution.

  ## Documents

  | File class | Disposition |
  | --- | --- |
  | `.rs` files in the module tree of a unit in a context, through crate roots, `mod` declarations, `#[path]` and `include!` | `indexed` |
  | Other tracked `.rs` files under the project | `inactive` |
  | `Cargo.toml`, `rust-toolchain.toml`, `.cargo/config.toml`, `build.rs` inputs that configure contexts | `configuration` |
  | Tracked dependency source under a vendor directory or a source replacement directory | `external` |
  | `Cargo.lock`, Markdown, task files, data files, other languages | `out-of-profile` |

  A `#[cfg]`-disabled `mod` declaration removes its file from that context's
  members. A file mounted at two module paths, or included by `include!` at
  two sites, has one member entry per unit.

  ## Paths

  An entity path is `<crate-name>` followed by `::`-separated segments:

  - modules, items, enum variants and their named fields by name;
  - tuple fields by index, as `Pair::0`; a tuple field's `name` is its
    index;
  - inherent associated items as `Type::item`;
  - trait associated items as `Trait::item`;
  - trait implementation items as `<Type as Trait>::item`;
  - implementation blocks as `impl Type` or `impl Trait for Type`, written
    with canonical paths, followed by `#<n>` for the n-th such block in the
    module in source order, from 1;
  - `#[macro_export]` macros at the crate root, with the crate root as
    `parent`; other `macro_rules!` macros at their defining module;
  - parameters as `<callable>::(<name>)` and type parameters as
    `<item>::<<name>>`, with lifetimes written with their apostrophe.

  A raw identifier's `name` and path segment omit `r#`, in entity and
  consumer paths alike.

  Each `macro_rules!` definition that shadows an earlier definition with the
  same name in the same module is a redeclaration form; the second and later
  definitions append `#<n>`.

  A crate root, an implementation block and a tuple field have no name
  token, so they have no definition site and no `anchor`.

  A consumer path is the path a downstream crate writes, beginning with the
  dependency's crate name.

  ## Entities

  | Construct | Kind | `language-kind` |
  | --- | --- | --- |
  | crate root | `module` | `crate` |
  | `mod` | `module` | `mod` |
  | `struct` | `type` | `struct` |
  | `enum` | `type` | `enum` |
  | `union` | `type` | `union` |
  | `trait` | `type` | `trait` |
  | `type` alias | `type-alias` | `type` |
  | trait associated type | `type-alias` | `associated-type` |
  | `impl` block | `extension` | `impl` or `trait-impl` |
  | `fn` item, associated `fn` | `callable` | `fn` or `method` |
  | named or tuple field | `field` | `field` |
  | `static` | `variable` | `static` or `static-mut` |
  | `const`, associated `const` | `constant` | `const` |
  | enum variant | `enum-member` | `variant` |
  | `macro_rules!` macro | `macro` | `macro-rules` |
  | procedural macro function | `macro` | `proc-macro`, `proc-macro-derive` or `proc-macro-attribute` |
  | function and method parameter, including `self` | `parameter` | `param` |
  | generic type, lifetime and const parameter | `type-parameter` | `type-param`, `lifetime-param` or `const-param` |

  `extern crate` declarations, `use` declarations and `extern` block items
  follow these rules: an `extern crate` and a `use` create bindings, not
  entities; a foreign function or static in an `extern` block is a
  `callable` or `variable` with `language-kind` `foreign-fn` or
  `foreign-static`.

  Items inside function bodies and inside `const` blocks are out-of-profile.

  ## Declared visibility

  Values: `private`, `pub`, `pub(crate)`, `pub(self)`, `pub(super)` and
  `pub(in <path>)`, with `<path>` written as a canonical absolute path.
  `private` is the default for items, fields and inherent associated items.
  Enum variants, their fields, trait items and trait implementation items
  have the value `inherited` with `explicit: false`. A crate root has
  `{value: pub, explicit: false}`. An implementation block has
  `{value: private, explicit: false}`.

  ## Effective visibility

  - `unit`: the widest access over the paths by which code in the crate can
    name the entity. Along one path, access is the narrowest of the entity's
    own visibility and the visibility of each module and re-export the path
    passes. A visibility gives: `pub` and `pub(crate)`, `all`; `private`
    and `pub(self)`, `scoped` to the parent module; `pub(super)`, `scoped`
    to the grandparent module; `pub(in P)`, `scoped` to `P`. So a `pub` item
    in a private module is `scoped` to that module's parent unless a wider
    re-export names it. A `macro_rules!` macro has the widest access among
    its textual scope, `scoped` to its defining module, and the visibility
    of each `use` that re-exports it. For a field or an
    associated item, the parent module is the module of its type or
    implementation block. `inherited` takes the value of the enum or trait.
  - `external`: `all` when a downstream crate can name the entity by at
    least one consumer path; `none` otherwise. An item a downstream crate
    reaches only as the type of a value, or only through a trait object, is
    `none` and is recorded by the `rust:reachable-unnameable` extension.
  - `project`: equal to `external`. Other crates of a workspace consume a
    crate exactly as a downstream crate does.
  - A crate root has `unit: all`, and `project` and `external` by the rule
    above: `all` for a `lib` or `proc-macro` crate root, `none` for others.
    An implementation block has `unit` scoped to its module and `project`
    and `external` `none`. A trait implementation item has the effective
    visibility of the trait item it implements.

  ## Public API

  The public API of a distribution is its members and their signatures.

  ### Membership

  The members of a distribution are the entities of its `lib` or `proc-macro`
  unit that have at least one consumer path in the context. A
  consumer path starts at the crate root, written as the crate name, and
  continues through names that a downstream crate can use: in a module, its
  children whose declared visibility is `pub` and the names that its `pub`
  `use` items and `pub` glob re-exports add (`exports` relations with
  `visibility: pub`); in a member type, its variants, its `pub` fields and
  variant fields, its trait items and its `pub` inherent associated items;
  through a member type alias whose definition is a path to a nominal type
  (an `aliases` relation), that type's variants and `pub` inherent
  associated items.
  Members are:

  - the crate root, with the crate name as its consumer path;
  - modules, types, type aliases, functions, statics, constants, enum
    variants, `pub` fields of members, trait items of member traits, `pub`
    inherent associated items of member types, and `#[macro_export]` macros;
  - procedural macros of a `proc-macro` unit;
  - entities of other units and external entities that a `pub` re-export
    names.

  Trait implementation items are not members; they are reached through the
  trait's items. `#[doc(hidden)]` does not remove membership.

  ### Signatures

  A project member's signature follows the model's Signatures section.

  | `language-kind` | Slots |
  | --- | --- |
  | `fn`, `method`, `foreign-fn` | `type-parameters`, `where`, `impl`, `abi`, `parameters`, `returns`, `modifiers`, `auto-traits` |
  | `struct`, `enum`, `union` | `type-parameters`, `where`, `bases`, `modifiers`, `auto-traits` |
  | `trait` | `type-parameters`, `where`, `bases`, `implementations`, `modifiers` |
  | `type` | `type-parameters`, `where`, `type` |
  | `associated-type` | `type-parameters`, `where`, `bounds`, `type` as its default |
  | `field` | `type` |
  | `static`, `static-mut`, `foreign-static` | `type`, `modifiers` |
  | `const` | `type`, `value`, `modifiers` |
  | `variant` | `value`, for an enum whose variants are all units or that states a discriminant |

  `abi` is a callable's ABI string, absent for the Rust ABI: `C` for `extern "C" fn`,
  `extern fn` and a function in an `extern "C"` block. `returns` is absent for a
  callable that returns `()`. `value` of a variant is
  its discriminant, stated or implicit. A `macro_rules!` matcher is a grammar,
  and membership states the macro.

  Parameter modes: `self-ref` for `&self` and `self: &Self`, `self-mut-ref` for
  `&mut self` and `self: &mut Self`. A `self` taken by value is `{name: self}`. A
  receiver with a lifetime or another type has `type`, such as `&'a Self`. A
  parameter whose pattern is not one identifier has no `name`. The tail `...` of a C
  variadic function is a last entry `{mode: c-variadic}`, and has no `parameter`
  entity.

  Modifiers: `unsafe`, `const`, `async`, `non_exhaustive`, `provided` for a trait
  item with a default body, and `auto`. `provided` on an associated constant holds
  whether or not the default has a `value` slot, so that `const PAIR: (u8, u8) = (0,
  0);` is `{type: "(u8, u8)", modifiers: [provided]}`. Rust `async` is a modifier, because the
  declared return type does not state its effect on a caller.

  `auto-traits` states what a consumer can do with a type beyond its written signature,
  so that a private field change that removes `Send` shows. The auto traits are the
  Reference's Special types and traits list: "The `Send`, `Sync`, `Unpin`, `UnwindSafe`,
  and `RefUnwindSafe` traits are auto traits."

  - Every `struct`, `enum` and `union` member has the slot.
  - A callable has the slot when its `returns` contains `impl Trait`, or when it is
    `async`, whose return is a future with no written type.
  - A trait method has the slot only when it has a default body, because a type that
    does not override it exposes that body's opaque type to a concrete call. A trait
    method with no body has no hidden type, and generic dispatch sees only its bounds.
  - A trait implementation's method is no member. Its opaque return is on the `bases` or
    `implementations` entry of that implementation, as a binding with the method's name:
    `{name: make, auto-traits: [Send, Sync]}`. Its elements follow these same rules. A
    method that writes a return other than the trait's refines it, and a consumer of the
    concrete type sees that return, so the binding states it in `returns`:
    `{name: make, returns: u8, auto-traits: [...]}`. A binding has `returns` only for a
    return that differs from the trait's, and `auto-traits` only when that return is opaque
    or contains an opaque type: `{name: make, returns: u8}` for `fn make() -> u8`.
  - An element is the trait's name when the type holds the trait with no condition.
  - An element is `<trait> when <conditions>` when the type holds the trait only under
    a condition on its generic parameters: `Send when T: Send`. Conditions are the
    predicates the trait needs, sorted and separated by `, `, each with its bounds sorted
    and separated by ` + `: `Sync when T: Sync, U: Send + Sync`. `?Sized`, and a bound
    the type's own declaration already requires, are not conditions. An implementation
    for one instantiation is an equality predicate, sorted with the others:
    `Send when T = u8`, for `unsafe impl Send for Item<u8>`.
  - A trait the type does not implement in any instantiation is absent. A type that
    implements none has no slot.
  - Each opaque type in a return is an occurrence. A return whose whole type is its only
    opaque type uses plain elements: `impl Clone`, or an `async fn` that returns a written
    type. Every other return prefixes each element with its occurrence's ordinal, `#<n> `,
    counted from 0 in source order: the `async` keyword's future, then each `impl` token.
    `(impl A, impl B)` has `#0 Send` and `#1 Send`. `async fn` returning `impl A` has `#0`
    for the future and `#1` for the output. `(impl A, u8)` has `#0`, and
    `impl Iterator<Item = impl A>` has `#0` for the iterator and `#1` for the item. Written
    types around an occurrence have no element of their own, because the language's rules
    derive their auto traits from the occurrences.
  - The five trait names are written bare in an element, in its conditions too. Any other
    name that denotes an entity is `@{id}`: `Send when T: @{ext.core.clone.Clone}`, for an
    `unsafe impl<T: Clone> Send`.
  - The list is sorted by code point, and is compared as a set. The text before ` when `
    is the key of a unit, `auto-traits[#1 Send]`, and the whole element is its value.
  - An adapter declares `signature-auto-trait` for these units, in the `auto-trait` slot
    class.

  ```yaml
  - entity: shapes.make_pair
    returns: "(impl @{ext.core.clone.Clone}, impl @{ext.core.clone.Clone})"
    auto-traits: ['#0 Send', '#0 Sync', '#0 Unpin', '#1 Unpin']
  - entity: shapes.Pair
    auto-traits:
      - 'RefUnwindSafe when T: RefUnwindSafe'
      - 'Send when T: Send'
      - 'Sync when T: Sync'
      - 'Unpin when T: Unpin'
      - 'UnwindSafe when T: UnwindSafe'
  ```

  Bounds have one form. A bound on a bare parameter, inline or in a `where` clause,
  is in that parameter's `bounds`. `where` holds other predicates only, sorted and
  separated by `, `.

  A member of an inherent implementation has the `impl` slot when the block has
  binders or a specialized self type, because the block decides when a consumer
  can call the member:

  ```yaml
  impl:
    type-parameters:
      - {name: T, kind: type, bounds: "@{ext.core.clone.Clone}"}
    self-type: "@{Container}<T>"
  ```

  `bases` of a trait holds its supertraits. `bases` of a struct, enum or union holds
  one entry per trait implementation that an `implements` relation states, so that
  `impl Trait<u8> for X` and `impl Trait<u16> for X` are one relation and two
  entries. An entry has `type-parameters` and `self-type` when the block has binders
  or a specialized self type, `where`, and `bindings`, sorted by `name`, for the
  associated types and constants the block sets.

  `implementations` of a trait holds one entry per implementation whose self type no
  `implements` relation can start from: a type parameter, as in a blanket
  implementation, or a type that is not a project type. An entry has the slots of a
  `bases` entry, with `self-type` always:

  ```yaml
  - entity: labels.ExtLabel
    implementations:
      - type: "@{labels.ExtLabel}"
        type-parameters:
          - {name: T, kind: type, bounds: "@{ext.core.fmt.Display}"}
        self-type: T
  ```

  ```yaml
  - entity: api.Entry
    bases:
      - type: "@{api.Record}"
        bindings:
          - {name: Key, type: u32}
  ```

  Canonical spelling:

  - Primitive names are written bare: `bool`, `char`, `str`, `f16`, `f32`, `f64`,
    `f128`, the `i` and `u` integer types, `isize`, `usize`, `()` and `!`.
  - Each path is its target: `core::option::Option` and `std::option::Option` are
    one `@{id}`.
  - `Self` in an implementation is the implementing type. `Self` in a trait stays
    `Self`.
  - A projection is fully qualified: `<T as @{Tr}>::@{Tr.Item}` for `T::Item`.
  - A type's own text uses `, ` between items, ` + ` between bounds, `; ` in `[T; N]`,
    no space after `&`, and one space after a lifetime or `mut`: `&'a T`, `&mut T`.
  - A bound list is sorted: `'a + @{ext.core.clone.Clone}`.
  - Lifetimes are as written, with no elision expansion.
  - `impl Trait` is recorded as written, with its `use<..>` in declared order:
    `impl @{ext.core.clone.Clone} + use<'a, T, N>`. The hidden type is not recorded,
    and `auto-traits` states what it leaks.
  - A generic argument the source omits for a defaulted parameter stays omitted.
  - A redundant type parenthesis is removed: `u8` for `(u8)`. A tuple keeps its
    parentheses: `(u8,)` and `()`.

  Inference: item signatures state their types, and no slot of a source entity is
  `{inferred}`. A generated member whose code is not an indexed document has
  `{inferred}` slots by its expansion. `value` follows the Reference's constant
  evaluation rules; a `const` assertion probe outside the tree confirms it. A
  constant of any type outside the model's value forms has no `value` slot.

  A `@{id}` whose target has no consumer path shows that the signature exposes it.
  `via` of a `rust:reachable-unnameable` fact is recomputed from these slots.

  An author writes `auto-traits` from the Reference's auto trait rules applied to the
  type's fields, including its private fields, and to explicit implementations. A compile
  check outside the tree verifies each element in a consumer that requires the trait of the
  type, or of the occurrence's value such as `make().0` or `make().await`. An element's
  consumer assumes its conditions and compiles: `fn c<T: Send>()` can require
  `Owned<T>: Send`. The same consumer with a condition dropped fails to compile, and so does
  a consumer that requires a trait the slot does not list.

  The compiler report comes from rustdoc JSON, with that compile check for `auto-traits`.
A report's probes and rustdoc read one copy of the project, with the context's features
  and the toolchain the project selects. A compile that fails for any reason other than a
  probed trait produces no report.

  ## References

  The target of a path segment is the entity that name resolution selects in
  the segment's namespace, after following `use` bindings, `extern crate`
  bindings, re-exports and glob imports. A path segment that names a crate
  targets that crate's root module. The keyword segments `crate`, `self`,
  `super` and `Self` are references to the crate root, the current module,
  the parent module and the implementing or declared type, with the role of
  their position; `self` inside a `use` group, as in `use a::b::{self, C}`,
  targets the group's parent path, `a::b`. A path that names a trait item through a type, such as
  `String::from` or `<T as Trait>::f`, targets the trait item, and the
  equivalence rule below applies.

  Primitive types are not entities, and their tokens have no reference.
  Their inherent associated items are externals with the primitive type as
  the first path segment, such as `f64::EPSILON` and `str::len`, and the
  defining crate as distribution: `core` for most, `std` for items the
  standard library defines, such as `f64::sqrt`. Built-in and tool attributes, such as `inline`, `cfg`, `doc`,
  `path` and `rustfmt::skip`, name no entity. Built-in macros are externals
  at their definitions: `derive` is `core::macros::builtin::derive` with
  `language-kind` `proc-macro-attribute`, and `include`, `assert_eq` and
  `println` are `#[macro_export]` `macro-rules` macros at the root of `core`
  or `std`.

  | Occurrence | Role |
  | --- | --- |
  | Non-final path segment | `qualifier` |
  | Name in a `use` tree of a private `use` | `import` |
  | Name in a `use` tree of a `pub` or `pub(...)` `use` | `export` |
  | Crate name in `extern crate` | `import` |
  | Function or method call, including a method-call expression | `call` |
  | Struct expression, tuple struct or tuple variant constructor call, unit struct or unit variant used as a value | `construct` |
  | Field name in a struct expression | `write` |
  | Field name in a struct pattern | `pattern` |
  | Path in `pub(in …)` | `qualifier` |
  | Path in a type position, trait bound, `impl` header or `dyn`/`impl` type | `type` |
  | Path in a pattern | `pattern` |
  | Field access, constant, static or function item used as a value | `read` |
  | Assignment target | `write` |
  | Compound assignment target | `read-write` |
  | Attribute path, including derive macro names in `#[derive]` | `attribute` |
  | Macro invocation path | `macro-invocation` |

  A method-call expression whose method is a trait item targets the trait
  item. Equivalence rule `rust:impl-item-for-trait-call`: an observation
  targeting the implementation item that the receiver type selects is
  accepted as `matched` and counted as `equivalent`.

  A field shorthand in a struct expression, `Point { x }`, denotes the field
  and a local binding; it has one reference to the field with role `write`.

  Alternate span: a raw identifier site `r#name` spans `r#name`; an
  observation spanning only `name` is accepted.

  Tokens inside a `macro_rules!` definition body are out-of-profile. A token
  of a macro invocation's input that expansion uses as a path, a field name
  or a definition name is in profile at its invocation site. A file that
  `include!` reads and that is an indexed document defines its items with
  `origin: source`, and no `rust:macro-expansion` fact.

  ## Relations

  - `implements`: a `trait-impl` block from its self type to its trait, with
    `at` on the trait path's final segment.
  - `inherits`: a trait's supertrait bound, from the trait to the supertrait.
  - `overrides`: a trait implementation item to the trait item it
    implements.
  - `aliases`: a `type` alias to the type its definition names, when that
    definition is a path to a nominal type without type arguments.
  - `exports`: each name a `pub` or `pub(...)` `use` adds to a module, with
    `name` set to the bound name; each name a glob re-export adds, with `at`
    on the `*` token. A glob adds no name that an explicit item or `use` in
    the module binds. `visibility` is the declared visibility of the `use`
    item, written as declared visibility values are; for a name a glob adds,
    it is the narrower of the `use` item's visibility and the visibility of
    the binding the glob imports.
  - A relation between project entities that an implementation block inside
    a function body establishes is recorded, although the block itself is
    out-of-profile.

  ## Generated, synthetic and external entities

  - Items produced by `macro_rules!` expansion or procedural macros are
    `origin: generated`, including the implementation blocks that derive
    macros generate and their associated items, with their `implements` and
    `overrides` relations and a `rust:macro-expansion` fact for each item.
    The parameters of a generated callable are generated entities without a
    fact of their own. A derived `implements` relation has `at` on the
    derive name. When the item's name token comes from the
    invocation input, `definitions` is that token. Otherwise `anchor` is the
    macro path's final segment at the invocation and `generated-by` names the
    macro.
  - Items the build script generates and the source includes through
    `include!(concat!(env!("OUT_DIR"), ...))` are `origin: generated` with
    `anchor` on the `include` token.
  - The profile defines no synthetic entities.
  - External key path: the canonical path at the external definition, using
    the defining crate name, such as `core::fmt::Display` for a name written
    `std::fmt::Display`. `distribution` is the defining crate's package name;
    `version` is present when the project resolves two versions.

  ## Dispositions

  Valid Rust source fixes every in-profile reference target statically.
  References are `resolved` or `external`. `candidates`, `nonexistent` and
  `indeterminate` do not occur in this profile.

  ## Extensions

  | Kind | Members | Key | Compared |
  | --- | --- | --- | --- |
  | `rust:reachable-unnameable` | `entity`, `distribution`, `via`: the sorted list of public entities whose signatures expose it | `entity`, `distribution` | `via` |
  | `rust:macro-expansion` | `entity`, `macro`: the invoked macro entity or external, `invocation`: the invocation site | `entity` | `macro`, `invocation` |

  Both extensions are required. `rust:reachable-unnameable` records items;
  a field of an unnameable type has no fact of its own.

  ## Authoring obligation

  For every Rust project dataset:

  1. Inventory every tracked file with its disposition and every indexed
     file's unit and context members.
  2. Declare every context the project's `build` and `test` tasks define.
  3. Declare every unit with its crate name and `edition`, and every
     distribution.
  4. Record every entity of the kinds in the entity table, in every context,
     including generated items and their extension facts.
  5. Record every in-profile reference site in every indexed file, including
     `use` trees, `extern crate`, attribute and derive paths, and macro
     invocation paths.
  6. Record every relation of the kinds above.
  7. Record declared and effective visibility for every entity other than
     parameters, and every `rust:reachable-unnameable` fact.
  8. Record the public API of every distribution in every context.
  9. Write every signature from source and the Rust Reference. Do not read a compiler report or a compiler draft of a
     declared slot while writing it. Run the compiler report from rustdoc JSON and
     the `auto-traits` compile check after writing, and settle each disagreement against the language's rule.
validation-criteria: |
  A Rust dataset conforms when it conforms to `semantic-oracle-model`, every
  context derives from a project task command by the rule above, every
  indexed document's members agree with the module tree under each context's
  `cfg` and features, every `pub(in P)` value names a module entity, and every
  public API membership agrees with the consumer-path rule of this profile.
  Independent review confirms entity, reference and visibility facts against
  source, the Cargo configuration and the Rust Reference. Every signature follows this profile's slots, modifiers and canonical spelling, and
  its slots agree with rustdoc JSON and the `auto-traits` compile check or are listed as
  `unchecked`.
