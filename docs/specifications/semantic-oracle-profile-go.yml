description: |
  # Go semantic-oracle profile, `go/1`

  This profile applies `semantic-oracle-model` version 1 to Go. It defines
  only Go mappings and Go extensions.

  ## Primary sources

  - The Go Programming Language Specification: Declarations and scope,
    Exported identifiers, Uniqueness of identifiers, Packages, Import
    declarations, Selectors, Method sets, Interface types, Struct types,
    Type definitions and alias declarations, Package initialization.
    <https://go.dev/ref/spec>
  - `go help buildconstraint`, `go help packages`, `go help test`,
    `go help generate`, internal directories in `cmd/go`, and the `embed`
    and `cgo` documentation. <https://pkg.go.dev/cmd/go>
  - Go Modules Reference, including workspaces and vendoring.
    <https://go.dev/ref/mod>
  - Toolchain: the Go `gc` release, in module mode, that each context's
    `release` names. `authoring.tools` records the exact release used.

  ## Contexts

  Context parameters:

  | Parameter | Value |
  | --- | --- |
  | `mode` | `build` or `test`. |
  | `goos` | `GOOS`. |
  | `goarch` | `GOARCH`. |
  | `arch-level` | The value of the architecture level variable for `goarch`, such as `v1` for `GOAMD64`, or `none` when `goarch` has no level variable. |
  | `cgo` | `CGO_ENABLED` as `true` or `false`. |
  | `tags` | The sorted `-tags` list. |
  | `compiler` | `gc` or `gccgo`. |
  | `module-root` | The project-relative directory of the main module or `go.work` the command uses; `.` for the project root. |
  | `go-version` | The language version the module's `go` directive selects. |
  | `patterns` | The package patterns the command names. |
  | `release` | The release parameter: the Go toolchain release as `go1.N`, which decides the release tags `go1.1` to `go1.N` that build constraints test and the standard library. A `toolchain` directive in `go.mod` that names a later release selects it. |

  Each `go build`, `go vet`, `go test` or `go run` command in the project's
  `build` and `test` tasks defines a context, unless another command defines
  the same parameter values. Environment assignments on the command set the
  parameters. Absent assignments take the host values the fixture plan
  declares. `-race`, `-msan` and `-asan` add their build tags to `tags`.
  Flags that change only code generation, linking, coverage
  instrumentation, profile-guided optimization, output or `-ldflags -X`
  variable values define no further context.

  ## Units and distributions

  | Unit kind | Package |
  | --- | --- |
  | `package` | A package that the context builds. In mode `test`, the package compiled with its in-package `_test.go` files. |
  | `external-test` | The package named `<p>_test` in the directory of `<p>`, in mode `test`. |
  | `main` | A package named `main`. |

  A unit's `name` is the package import path. A unit record carries the Go
  attribute `package-name`. The unit key is the import path and the unit
  kind.

  A distribution is a module whose `go.mod` the project tracks:
  `kind: module`, `name` the module path, `version` absent. Each unit
  belongs to the distribution of the module that contains its directory.
  `main` and `external-test` units have no distribution.

  ## Documents

  | File class | Disposition |
  | --- | --- |
  | `.go` files that the context's build constraints, file name suffixes and `_test.go` rules include in a built package | `indexed` |
  | `.go` files excluded in every context, including `//go:build ignore` and files under `testdata` | `inactive` |
  | `go.mod`, `go.work`, `go.sum` used to select modules | `configuration` |
  | `vendor/` source and other tracked dependency source | `external` |
  | `.c`, `.h`, `.s` and other non-Go source, embedded files, data, Markdown, task files | `out-of-profile` |

  A tracked `.go` file whose content contains a line matching
  `^// Code generated .* DO NOT EDIT\.$` before the package clause is
  `origin: generated`.

  ## Paths

  - A package path is its import path.
  - A package-level declaration is `<import path>.<Name>`.
  - A field or method is `<type path>.<name>`; an embedded field's name is
    its type name without package qualifier or pointer.
  - An interface method is `<interface path>.<Name>`.
  - `init` functions are `<import path>.init#<n>` in the order the go
    command presents files to the compiler and source order within a file,
    from 1. `init` is a redeclaration form; `#<n>` distinguishes it.
  - Parameters are `<callable>.(<name>)`; type parameters
    `<declaration>.[<name>]`.
  - The consumer path equals the entity path.

  ## Entities

  | Construct | Kind | `language-kind` |
  | --- | --- | --- |
  | package | `module` | `package` |
  | defined type with struct, interface or other underlying type | `type` | `struct`, `interface` or `defined` |
  | alias declaration | `type-alias` | `alias` |
  | function | `callable` | `func` |
  | method | `callable` | `method` or `pointer-method` |
  | interface method | `callable` | `interface-method` |
  | struct field, embedded field | `field` | `field` or `embedded` |
  | package-level `var` | `variable` | `var` |
  | package-level `const` | `constant` | `const` |
  | parameter, result, receiver | `parameter` | `param`, `result` or `receiver` |
  | type parameter | `type-parameter` | `type-param` |

  The blank identifier declares no entity. Declarations inside function
  bodies are out-of-profile.

  ## Declared visibility

  Values: `exported` when the name's first character is an uppercase letter
  (Unicode class Lu) and `unexported` otherwise. `explicit` is `true`.

  ## Effective visibility

  - `unit`: `all`.
  - `project`: `none` for `unexported`. For `exported` entities: `none` in
    `main` and `external-test` units; `scoped` to the units whose import path
    is rooted at the parent of the nearest `internal` path element, for units
    under an `internal` directory; `all` otherwise. A field or method is
    restricted by its type's package, not by its type's export status: an
    exported field or method of an unexported type has the same value as an
    exported package-level declaration of its package.
  - `external`: as `project`, with `scoped` replaced by `none` when the
    `internal` parent lies inside the distribution.

  ## Public API

  The public API of a distribution is its members and their signatures.

  ### Membership

  A distribution's members in a context are every `package` unit's package
  outside `internal` directories, because a consumer can name it, even when
  it has no exported names, with its import path as consumer path, and every
  entity of those units that is `exported` and is a
  package-level declaration, or an exported field or method of an exported
  type, or an exported field or method promoted into an exported struct type
  through an embedded field. A promoted member's consumer path is
  `<exported type path>.<name>`; its entity is the member's declaration.

  ### Signatures

  A project member's signature follows the model's Signatures section.

  | `language-kind` | Slots |
  | --- | --- |
  | `func`, `interface-method` | `type-parameters`, `parameters`, `returns` |
  | `method`, `pointer-method` | `receiver`, `parameters`, `returns` |
  | `struct`, `interface`, `defined` | `type-parameters`, `bases`, `underlying` |
  | `alias` | `type-parameters`, `type` |
  | `field`, `embedded` | `type`, `tag` |
  | `var` | `type` |
  | `const` | `type`, `value` |

  Go has no modifiers and no parameter modes. `receiver` is the receiver's type
  text, such as `*@{geometry.Circle}` for a pointer receiver; its name is not
  recorded. A variadic parameter writes `...T` in its `type`. Each name of a grouped
  parameter `a, b int` is its own record. An unnamed parameter, and a parameter
  named `_`, has no `name`. `parameters` lists the entities with `language-kind`
  `param`. `returns` is one type, `(int, error)` for several, and absent for none;
  result names are not recorded.

  `bases` holds the targets of the type's `inherits` and `implements` relations. A
  structural `implements` base has no source token, and the audit reads its method
  sets.

  `underlying` is always the full underlying type of a defined type, with struct
  field order, unexported fields, tags and interface type sets, even where field
  slots repeat part of it: `[2]int`, or `interface { ~int | ~string }`. In a struct's
  text, field labels stay as names and are never `@{id}`, and a tag is its decoded
  value as a JSON string. `tag` is compared by decoded value and written the same way.

  A promoted member's signature stays the declaration's signature, with its type
  parameters, and the embedding type's `underlying` states how they bind. Promotion
  creates no record.

  Canonical spelling:

  - Predeclared names are written bare: `any`, `bool`, `comparable`, `complex64`,
    `complex128`, `error`, `float32`, `float64`, the `int` and `uint` types,
    `string` and `uintptr`.
  - `any` for `interface{}`, `uint8` for `byte` and `int32` for `rune`.
  - A parameter label in a nested function type or an interface method is omitted:
    `func(int) int` for `func(x int) int`, and `interface { M(int) int }`. Field labels
    of a struct stay.
  - Text follows `gofmt` spacing. A struct is `struct { A int; B string }` in field
    order. An interface is `interface { M() int; ~int | ~string }`, with methods
    sorted and then its embedded elements sorted. The terms of a union are sorted.
  - A type parameter's `bounds` is its constraint, and `any` when it states no other.

  Inference: a constant's `type` is its declared type or its kind: `untyped bool`,
  `untyped rune`, `untyped int`, `untyped float`, `untyped complex` or
  `untyped string`. `value` is exact for typed and untyped constants, with `iota` and
  implicit repetition applied. A numeric constant's `value` is its normalized value:
  an integer in decimal when the value is integral, otherwise a reduced `a/b`, and
  the `0x.…p±…` form of `go/constant`'s `ExactString` only when the value's binary
  exponent, as `big.Float.MantExp` gives it, is at least 4096 or at most -4096. A
  complex value is `(re + imi)` of those. `1e5000 * 1e-5000` is `1`. The value is the
  exact result that `go/constant` computes at 512 bits, with no rounding to a nearby
  integer, so `1e5000 / 5 * 5e-5000` is the same `a/b` as `1 + 1.0/(1<<511)`.
  `var X = expr` has `{inferred: ...}`, the expression's
  type or its kind's default type. Function signatures are always declared. An author
  derives these from the Go specification's Constants, Iota and Variable declarations
  sections, and a `go/types` probe outside the tree confirms them.

  The compiler report comes from `go/types`.

  ## References

  The target is the declaration that Go's scoping and selector rules select,
  including promotion through embedded fields to the selected depth. A
  package name in a qualified identifier targets the imported package,
  whatever name the import declaration binds.

  | Occurrence | Role |
  | --- | --- |
  | Import path string | `import` |
  | Package name in a qualified identifier | `qualifier` |
  | Call of a function or method, including method values called directly | `call` |
  | Type of a composite literal | `construct` |
  | Type in a type position, conversion, type assertion, type switch case, constraint, embedded interface | `type` |
  | Variable, constant, field or function used as a value, method value, method expression | `read` |
  | Assignment target | `write` |
  | Compound assignment, increment, decrement | `read-write` |
  | Field key in a keyed composite literal | `write` |

  An import path string is a value site that spans the string contents
  without quotes; an observation spanning the quotes is accepted. It targets
  the package the go command loads for that path in the context, including
  `vendor`, `replace` and `go.work` selection.

  An embedded field's type name is both the field's definition site and a
  reference to the embedded type with role `type`.

  Predeclared identifiers such as `int`, `error`, `len`, `nil`, `true` and
  `iota` target external entities with distribution `go` and path
  `builtin.<name>`. `unsafe` package identifiers use distribution `go` and
  path `unsafe.<name>`. Names of the `C` pseudo-package target external
  entities with distribution `cgo` and path `C.<name>`.

  ## Relations

  - `implements`: for every defined non-interface type `T` declared in the
    project and every interface `I` declared in the project such that the
    method set of `T` or `*T` implements `I`, from `T` to `I`, without
    `at`. The `go:pointer-receiver` extension marks pairs that only `*T`
    satisfies.
  - `inherits`: an interface to each interface it embeds, with `at` on the
    embedded name.
  - `overrides`: for every `implements` pair, each method of `T` to the
    interface method of `I` it satisfies.
  - `aliases`: an alias declaration to the type it denotes, when that type
    is a defined type.
  - `exports`: none; Go packages export by name.

  ## Generated, synthetic and external entities

  - Entities in generated documents are `origin: generated`.
  - The profile defines no synthetic entities.
  - External key path: the entity path at the defining package.
    `distribution` is the module path; `version` is present when the build
    list contains two major versions of one module path. Standard library
    packages use distribution `std`. A predeclared identifier is an external
    of distribution `std` with path `builtin.<name>`, and the kind and
    `language-kind` of its declaration in the `builtin` package source:
    `int` is a `defined` type, `byte`, `rune` and `any` are aliases,
    `error` and `comparable` are interfaces, `len` is a `func`, `true`,
    `false` and `iota` are `const`, and `nil` is a `var`.

  ## Dispositions

  - `indeterminate`: a method call through a reflection value.
  - Statically bound references, including interface method calls, are
    `resolved` or `external`; an interface method call targets the interface
    method.

  ## Extensions

  | Kind | Members | Key | Compared |
  | --- | --- | --- | --- |
  | `go:embeds` | `struct`, `field`: the embedded field entity, `type`: the embedded type | `struct`, `field` | `type` |
  | `go:pointer-receiver` | `type`, `interface` of an `implements` pair | `type`, `interface` | none |
  | `go:linkname` | `entity`, `target`: the linked symbol as an external key or entity, `at`: the directive site | `entity` | `target` |
  | `go:embed-files` | `variable`, `patterns`, `documents`: the canonical paths the patterns match | `variable` | `documents` |

  All four extensions are required.

  ## Authoring obligation

  For every Go project dataset:

  1. Inventory every tracked file, and the units and contexts of every
     indexed file under each context's constraints.
  2. Declare every context the `build` and `test` tasks define.
  3. Declare every unit, including test variants, and every distribution.
  4. Record every entity of the kinds in the entity table.
  5. Record every in-profile reference, including import paths, package
     qualifiers, embedded type names and predeclared identifiers.
  6. Record every relation of the kinds above, including all `implements`
     pairs among project types and interfaces.
  7. Record declared and effective visibility for every entity other than
     parameters.
  8. Record the public API of every distribution in every context, and every
     required extension fact.
  9. Write every signature from source and the Go specification, applying its inference rules yourself. Do not read a compiler report or a compiler draft of a
     declared slot while writing it. Run the compiler report from `go/types` after
     writing, and settle each disagreement against the language's rule.
validation-criteria: |
  A Go dataset conforms when it conforms to `semantic-oracle-model`, every
  context derives from a `build` or `test` task command, every indexed
  document's members agree with the build constraints and file name rules of
  each context, every `implements` pair agrees with the method-set rule, and
  every public API membership agrees with this profile's rule. Independent
  review confirms facts against source, module files and the Go
  specification.
  Every signature follows this profile's slots and canonical spelling, and its slots
  agree with `go/types` or are listed as `unchecked`.
