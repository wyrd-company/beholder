# ---
# relationships:
#   implements: semantic-oracle-profile-csharp
#   references: semantic-oracle-model
# ---
#
# Dataset schema for profile `csharp/1` of semantic-oracle model version 1.
#
# This schema applies the shared record structure of the model schema and
# adds the C# vocabulary only. A context-variant attribute holds either one
# value or a list of `{contexts, value}` entries; each value set below is
# written once as a YAML anchor and applied to both forms.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/beholder/schemas/semantic-oracle/1/csharp/1
title: Semantic-oracle dataset, profile csharp/1
$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/dataset'
properties:
  profile: {const: csharp/1}
  project: {properties: {language: {const: csharp}}}
  contexts: {items: {properties: {parameters: {$ref: '#/$defs/context-parameters'}}}}
  units: {items: {$ref: '#/$defs/unit'}}
  distributions: {items: {properties: {kind: {const: assembly}}}}
  entities: {items: {$ref: '#/$defs/entity'}}
  externals: {items: {$ref: '#/$defs/kind-and-language-kind'}}
  references:
    items:
      properties:
        role:
          enum: [import, qualifier, call, construct, type, read, write, read-write, pattern, attribute]
        disposition: {enum: [resolved, external, indeterminate]}
  relations:
    items:
      properties:
        kind: {enum: [inherits, implements, overrides]}
        # The profile gives export bindings no visibility.
        visibility: false
  public-api: {properties: {signatures: {items: {$ref: '#/$defs/signature'}}}}
  extensions: {$ref: '#/$defs/extensions'}

$defs:
  text: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/text'}
  id: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/id'}
  locator: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/locator'}
  canonical-path: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/canonical-path'}
  context-variant-list: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/context-variant-list'}
  extension-fact: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/extension-fact'}
  text-list: {type: array, uniqueItems: true, items: {$ref: '#/$defs/text'}}

  context-parameters:
    type: object
    required: [entry, configuration, target-framework, properties]
    additionalProperties: false
    properties:
      entry: {$ref: '#/$defs/canonical-path'}
      configuration: {$ref: '#/$defs/text'}
      target-framework: {$ref: '#/$defs/text'}
      properties: {$ref: '#/$defs/text-list'}

  unit:
    $ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/unit'
    required: [assembly-version, project, language-version, define-constants, target-framework]
    properties:
      kind: {const: assembly}
      assembly-version: {$ref: '#/$defs/text-attribute'}
      project:
        anyOf:
          - $ref: '#/$defs/canonical-path'
          - $ref: '#/$defs/context-variant-list'
            items: {properties: {value: {$ref: '#/$defs/canonical-path'}}}
      language-version: {$ref: '#/$defs/text-attribute'}
      define-constants:
        anyOf:
          - $ref: '#/$defs/text-list'
          - $ref: '#/$defs/context-variant-list'
            items: {properties: {value: {$ref: '#/$defs/text-list'}}}
      target-framework: {$ref: '#/$defs/text-attribute'}
    unevaluatedProperties: false

  text-attribute:
    anyOf:
      - $ref: '#/$defs/text'
      - $ref: '#/$defs/context-variant-list'
        items: {properties: {value: {$ref: '#/$defs/text'}}}

  entity:
    properties:
      declared-visibility: {$ref: '#/$defs/declared-visibility'}
    $ref: '#/$defs/kind-and-language-kind'
    allOf:
      # A namespace is project-merged: it has `units`, and nothing else has.
      - if: {properties: {kind: {const: namespace}}}
        then: {required: [units]}
        else: {properties: {units: false}}
      # Every synthetic entity is anchored on its declaring type's name.
      - if: {properties: {origin: {const: synthetic}}}
        then: {required: [anchor]}

  kind-and-language-kind:
    allOf:
      - if: {properties: {kind: {const: namespace}}}
        then: {properties: {language-kind: {anyOf: [{enum: &namespace [namespace]}, {type: array, items: {properties: {value: {enum: *namespace}}}}]}}}
      - if: {properties: {kind: {const: type}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type [class, record, struct, record-struct, ref-struct, interface, enum, delegate]}, {type: array, items: {properties: {value: {enum: *type}}}}]}}}
      - if: {properties: {kind: {const: extension}}}
        then: {properties: {language-kind: {anyOf: [{enum: &extension [extension-block]}, {type: array, items: {properties: {value: {enum: *extension}}}}]}}}
      - if: {properties: {kind: {const: callable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &callable [method, operator, conversion, constructor, static-constructor, finalizer]}, {type: array, items: {properties: {value: {enum: *callable}}}}]}}}
      - if: {properties: {kind: {const: field}}}
        then: {properties: {language-kind: {anyOf: [{enum: &field [field, fixed-buffer]}, {type: array, items: {properties: {value: {enum: *field}}}}]}}}
      - if: {properties: {kind: {const: constant}}}
        then: {properties: {language-kind: {anyOf: [{enum: &constant [const]}, {type: array, items: {properties: {value: {enum: *constant}}}}]}}}
      - if: {properties: {kind: {const: property}}}
        then: {properties: {language-kind: {anyOf: [{enum: &property [property, indexer, event]}, {type: array, items: {properties: {value: {enum: *property}}}}]}}}
      - if: {properties: {kind: {const: enum-member}}}
        then: {properties: {language-kind: {anyOf: [{enum: &enum-member [enum-member]}, {type: array, items: {properties: {value: {enum: *enum-member}}}}]}}}
      - if: {properties: {kind: {const: parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &parameter [param]}, {type: array, items: {properties: {value: {enum: *parameter}}}}]}}}
      - if: {properties: {kind: {const: type-parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-parameter [type-param]}, {type: array, items: {properties: {value: {enum: *type-parameter}}}}]}}}
      - properties:
          kind:
            enum: [namespace, type, extension, callable, field, constant, property, enum-member, parameter, type-parameter]

  declared-visibility-value:
    type: object
    properties:
      value:
        enum: [public, internal, protected, protected internal, private protected, private, file]

  declared-visibility:
    anyOf:
      - $ref: '#/$defs/declared-visibility-value'
      - type: array
        items: {properties: {value: {$ref: '#/$defs/declared-visibility-value'}}}

  extensions:
    type: object
    additionalProperties: false
    properties:
      csharp:type-forward:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [unit, type, at]
          properties:
            unit: {$ref: '#/$defs/id'}
            type: {$ref: '#/$defs/id'}
            at: {$ref: '#/$defs/locator'}
          unevaluatedProperties: false
      csharp:extern-alias:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [at, alias, unit]
          properties:
            at: {$ref: '#/$defs/locator'}
            alias: {$ref: '#/$defs/text'}
            # The aliased unit, by id, or an external assembly, by name.
            unit: {$ref: '#/$defs/text'}
          unevaluatedProperties: false
      csharp:reference-alias:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [unit, reference, aliases]
          properties:
            unit: {$ref: '#/$defs/id'}
            # The referenced unit, by id, or an external assembly, by name.
            reference: {$ref: '#/$defs/text'}
            aliases: {$ref: '#/$defs/text-list', minItems: 1}
          unevaluatedProperties: false

  # ------------------------------------------------------------- signatures
  # The slots, modes and modifiers of this language over the model's records.
  signature:
    $ref: '#/$defs/signature-slots'
    properties:
      alternatives: false
  callable-slots:
    properties:
      where: false
      type-parameters: {items: {$ref: '#/$defs/type-parameter'}}
      parameters: {items: {$ref: '#/$defs/parameter'}}
      modifiers: {items: {enum: [abstract, override, readonly, required, sealed, static, virtual]}}
      return-mode: {enum: [ref, 'ref readonly']}
  signature-slots:
    $ref: '#/$defs/callable-slots'
    properties:
      impl: false
      receiver: false
      overloads: false
      constructors: false
      call-signatures: false
      construct-signatures: false
      index-signatures: false
      bounds: false
      tag: false
      delete: false
      bases: {items: {$ref: '#/$defs/base'}}
      get: {$ref: '#/$defs/accessor'}
      set: {$ref: '#/$defs/accessor'}
      init: {$ref: '#/$defs/accessor'}
  type-parameter:
    properties:
      default: false
      modifiers: false
      variance: {enum: [in, out]}
      kind: {const: type}
  parameter:
    properties:
      mode: {enum: [in, out, params, ref, 'ref readonly', this, 'this in', 'this ref', 'this ref readonly']}
  base:
    properties:
      position: false
      type-parameters: false
      self-type: false
      where: false
      bindings: false
  accessor:
    properties:
      access: {enum: [internal, private, 'private protected', protected, 'protected internal']}
      modifiers: {items: {enum: [readonly]}}
