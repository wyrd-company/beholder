# ---
# relationships:
#   implements: semantic-oracle-profile-go
#   references: semantic-oracle-model
# ---
#
# Dataset schema for profile `go/1` of semantic-oracle model version 1.
#
# This schema applies the shared record structure of the model schema and
# adds the Go vocabulary only. A context-variant attribute holds either one
# value or a list of `{contexts, value}` entries; each value set below is
# written once as a YAML anchor and applied to both forms.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/beholder/schemas/semantic-oracle/1/go/1
title: Semantic-oracle dataset, profile go/1
$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/dataset'
properties:
  profile: {const: go/1}
  project: {properties: {language: {const: go}}}
  contexts: {items: {properties: {parameters: {$ref: '#/$defs/context-parameters'}}}}
  units: {items: {$ref: '#/$defs/unit'}}
  # A Go module distribution has no version.
  distributions: {items: {properties: {kind: {const: module}, version: false}}}
  entities: {items: {$ref: '#/$defs/entity'}}
  externals: {items: {$ref: '#/$defs/kind-and-language-kind'}}
  references:
    items:
      properties:
        role:
          enum: [import, qualifier, call, construct, type, read, write, read-write]
        disposition: {enum: [resolved, external, indeterminate]}
  relations:
    items:
      properties:
        kind: {enum: [implements, inherits, overrides, aliases]}
        # The profile gives export bindings no visibility.
        visibility: false
  public-api: {properties: {signatures: {items: {$ref: '#/$defs/signature'}}}}
  extensions: {$ref: '#/$defs/extensions'}

$defs:
  text: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/text'}
  id: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/id'}
  locator: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/locator'}
  canonical-path: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/canonical-path'}
  context-variant-list: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/context-variant-list'}
  extension-fact: {$ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/extension-fact'}
  text-list: {type: array, uniqueItems: true, items: {$ref: '#/$defs/text'}}

  context-parameters:
    type: object
    required: [mode, goos, goarch, arch-level, cgo, tags, compiler, module-root, go-version, patterns, release]
    additionalProperties: false
    properties:
      mode: {enum: [build, test]}
      goos: {$ref: '#/$defs/text'}
      goarch: {$ref: '#/$defs/text'}
      arch-level: {$ref: '#/$defs/text'}
      cgo: {type: boolean}
      tags: {$ref: '#/$defs/text-list'}
      compiler: {enum: [gc, gccgo]}
      module-root: {$ref: '#/$defs/text'}
      go-version: {$ref: '#/$defs/text'}
      release: {$ref: '#/$defs/text'}
      patterns: {$ref: '#/$defs/text-list', minItems: 1}

  unit:
    $ref: 'https://wyrd.foo/beholder/schemas/semantic-oracle/1#/$defs/unit'
    required: [package-name]
    properties:
      kind: {enum: [package, external-test, main]}
      package-name:
        anyOf:
          - $ref: '#/$defs/text'
          - $ref: '#/$defs/context-variant-list'
            items: {properties: {value: {$ref: '#/$defs/text'}}}
    unevaluatedProperties: false

  entity:
    properties:
      # The profile defines no synthetic entities and no project-merged kind.
      origin: {enum: [source, generated]}
      units: false
      declared-visibility: {$ref: '#/$defs/declared-visibility'}
    $ref: '#/$defs/kind-and-language-kind'

  kind-and-language-kind:
    allOf:
      - if: {properties: {kind: {const: module}}}
        then: {properties: {language-kind: {anyOf: [{enum: &module [package]}, {type: array, items: {properties: {value: {enum: *module}}}}]}}}
      - if: {properties: {kind: {const: type}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type [struct, interface, defined]}, {type: array, items: {properties: {value: {enum: *type}}}}]}}}
      - if: {properties: {kind: {const: type-alias}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-alias [alias]}, {type: array, items: {properties: {value: {enum: *type-alias}}}}]}}}
      - if: {properties: {kind: {const: callable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &callable [func, method, pointer-method, interface-method]}, {type: array, items: {properties: {value: {enum: *callable}}}}]}}}
      - if: {properties: {kind: {const: field}}}
        then: {properties: {language-kind: {anyOf: [{enum: &field [field, embedded]}, {type: array, items: {properties: {value: {enum: *field}}}}]}}}
      - if: {properties: {kind: {const: variable}}}
        then: {properties: {language-kind: {anyOf: [{enum: &variable [var]}, {type: array, items: {properties: {value: {enum: *variable}}}}]}}}
      - if: {properties: {kind: {const: constant}}}
        then: {properties: {language-kind: {anyOf: [{enum: &constant [const]}, {type: array, items: {properties: {value: {enum: *constant}}}}]}}}
      - if: {properties: {kind: {const: parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &parameter [param, result, receiver]}, {type: array, items: {properties: {value: {enum: *parameter}}}}]}}}
      - if: {properties: {kind: {const: type-parameter}}}
        then: {properties: {language-kind: {anyOf: [{enum: &type-parameter [type-param]}, {type: array, items: {properties: {value: {enum: *type-parameter}}}}]}}}
      - properties:
          kind:
            enum: [module, type, type-alias, callable, field, variable, constant, parameter, type-parameter]

  declared-visibility-value:
    type: object
    properties:
      value: {enum: [exported, unexported]}
      explicit: {const: true}

  declared-visibility:
    anyOf:
      - $ref: '#/$defs/declared-visibility-value'
      - type: array
        items: {properties: {value: {$ref: '#/$defs/declared-visibility-value'}}}

  extensions:
    type: object
    additionalProperties: false
    properties:
      go:embeds:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [struct, field, type]
          properties:
            struct: {$ref: '#/$defs/id'}
            field: {$ref: '#/$defs/id'}
            type: {$ref: '#/$defs/id'}
          unevaluatedProperties: false
      go:pointer-receiver:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [type, interface]
          properties:
            type: {$ref: '#/$defs/id'}
            interface: {$ref: '#/$defs/id'}
          unevaluatedProperties: false
      go:linkname:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [entity, target, at]
          properties:
            entity: {$ref: '#/$defs/id'}
            target: {$ref: '#/$defs/id'}
            at: {$ref: '#/$defs/locator'}
          unevaluatedProperties: false
      go:embed-files:
        type: array
        items:
          $ref: '#/$defs/extension-fact'
          required: [variable, patterns, documents]
          properties:
            variable: {$ref: '#/$defs/id'}
            patterns: {$ref: '#/$defs/text-list', minItems: 1}
            documents:
              type: array
              uniqueItems: true
              items: {$ref: '#/$defs/canonical-path'}
          unevaluatedProperties: false

  # ------------------------------------------------------------- signatures
  # The slots, modes and modifiers of this language over the model's records.
  signature:
    $ref: '#/$defs/signature-slots'
    properties:
      alternatives: false
  callable-slots:
    properties:
      where: false
      return-mode: false
      modifiers: false
      type-parameters: {items: {$ref: '#/$defs/type-parameter'}}
      parameters: {items: {$ref: '#/$defs/parameter'}}
  signature-slots:
    $ref: '#/$defs/callable-slots'
    properties:
      index: false
      auto-traits: false
      abi: false
      implementations: false
      add: false
      remove: false
      impl: false
      overloads: false
      constructors: false
      call-signatures: false
      construct-signatures: false
      index-signatures: false
      bounds: false
      get: false
      set: false
      init: false
      delete: false
      bases: {items: {$ref: '#/$defs/base'}}
  type-parameter:
    properties:
      variance: false
      default: false
      modifiers: false
      kind: {const: type}
  parameter:
    properties:
      mode: false
      default: false
  base:
    properties:
      position: false
      type-parameters: false
      self-type: false
      where: false
      bindings: false
