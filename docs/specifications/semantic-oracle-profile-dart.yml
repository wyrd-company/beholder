description: |
  # Dart semantic-oracle profile, `dart/1`

  This profile applies `semantic-oracle-model` version 1 to Dart. It defines
  only Dart mappings and Dart extensions.

  ## Primary sources

  - Dart Programming Language Specification: Libraries and Scripts (imports,
    exports, parts, combinators, deferred imports, conditional imports and
    exports, privacy), Classes, Mixins, Extensions, Extension types,
    Enums, Getters and setters, Constructors, Name resolution.
    <https://dart.dev/resources/language/spec>
  - Dart language documentation: Libraries and imports, Language versioning,
    Configuration-specific imports. <https://dart.dev/language>
  - Package layout conventions, `pubspec` and pub workspaces.
    <https://dart.dev/tools/pub/package-layout>
  - `package:meta` annotations. <https://pub.dev/documentation/meta/latest/>
  - Toolchain: the stable Dart SDK release that each context's `release`
    names, which satisfies each package's SDK constraint. `authoring.tools`
    records the exact release used.

  ## Contexts

  Context parameters:

  | Parameter | Value |
  | --- | --- |
  | `platform` | `vm`, `js` or `wasm`: the compilation or execution platform. |
  | `entry` | The project-relative path of the entry point the command compiles or runs, or `analysis` for whole-package analysis. |
  | `defines` | The sorted `-D` environment declarations. |
  | `library-flags` | The sorted `dart.library.*` configuration values that are true for the command: every public library the platform's SDK provides for conditional import in that command, as the SDK's `libraries.json` lists them, so `dart.library.core` too and no `_` library. Empty for `entry: analysis`. |
  | `options` | The sorted command options that change semantics, such as `--enable-asserts`. |
  | `release` | The release parameter: the Dart SDK release as `3.N`, which decides the SDK libraries' members, and so which instance or extension member a reference resolves to, at any language version. |

  Each `dart run`, `dart compile` or `dart test` command in the project's
  `build` and `test` tasks defines a context, unless another command defines
  the same parameter values. `dart analyze` defines one context with
  `entry: analysis` and `platform: vm`, the analyzer's SDK. The analyzer
  treats no `dart.library.*` value as true, so `library-flags` is empty and
  each configurable directive selects its default URI unless a `-D` in
  `defines` selects another.

  ## Units and distributions

  A unit is one library: `kind: library`, `name` the library's canonical URI,
  `package:<package>/<path>` for files under `lib/` and the project-relative
  path for other files. Part files belong to their library's unit. A unit
  record carries the Dart attribute `language-version`, from a
  `// @dart=` comment or the package's SDK constraint. The unit key is the
  canonical URI.

  A distribution is a package with a tracked `pubspec.yaml`:
  `kind: pub-package`, `name` and `version` from that file. Its units are the
  libraries under its `lib/` directory. Libraries under `bin/`, `test/`,
  `tool/`, `example/` and `benchmark/` have no distribution.

  ## Documents

  | File class | Disposition |
  | --- | --- |
  | `.dart` files a context's entry point reaches through imports, exports and parts, and every `.dart` file under `lib/` in the `analysis` context | `indexed` |
  | Other tracked `.dart` files | `inactive` |
  | `pubspec.yaml`, `analysis_options.yaml`, `build.yaml`, `pubspec_overrides.yaml` | `configuration` |
  | Tracked third-party packages | `external` |
  | `pubspec.lock`, native sources, JavaScript, assets, Markdown, task files | `out-of-profile` |

  A tracked `.dart` file that the project's code generation writes, such as a
  `.g.dart` part, is `origin: generated`.

  ## Paths

  - A library path is its canonical URI.
  - A declaration is `<library URI>::<name>`, followed by `.`-separated
    member names.
  - The unnamed constructor is `<class>.new`; a named constructor is
    `<class>.<name>`.
  - A getter and setter pair is one entity with the getter's name.
  - An unnamed extension is `<library URI>::extension#<n>` in source order,
    from 1.
  - Parameters are `<callable>.(<name>)`; type parameters
    `<declaration>.<<name>>`.
  - A consumer path is `package:<package>/<path>::<name>` followed by member
    names, using the public library through which the consumer imports the
    name. A public library's own consumer path is `package:<package>/<path>`.

  ## Entities

  | Construct | Kind | `language-kind` |
  | --- | --- | --- |
  | library | `module` | `library` |
  | `class`, `abstract class`, modifiers `base`, `interface`, `final`, `sealed` | `type` | `class` |
  | `mixin`, `mixin class` | `type` | `mixin` or `mixin-class` |
  | `enum` | `type` | `enum` |
  | `extension type` | `type` | `extension-type` |
  | `extension` | `extension` | `extension` |
  | `typedef` | `type-alias` | `typedef` |
  | top-level and member function, method, operator, constructor, factory constructor | `callable` | `function`, `method`, `operator`, `constructor` or `factory` |
  | instance and static field | `field` | `field` |
  | getter and setter pair, explicit or implied by a field | `property` | `accessor` |
  | top-level variable | `variable` | `variable`, `final` or `late` |
  | `const` top-level variable and static `const` field | `constant` | `const` |
  | enum value | `enum-member` | `enum-value` |
  | parameter, including `this.` and `super.` parameters | `parameter` | `param` |
  | type parameter | `type-parameter` | `type-param` |

  A field declaration defines the field entity; its implicit getter and
  setter are not separate entities. A library prefix creates a binding, not
  an entity. A wildcard parameter, `_` in a library whose language version
  is 3.7 or later, binds no name and declares no entity; its signature entry
  has a `type` and no `name`.

  ## Declared visibility

  Values: `public` and `library-private` for a name that begins with `_`.
  `explicit` is `true`. `package:meta` annotations that restrict intended use
  are recorded by the `dart:visibility-annotation` extension.

  ## Effective visibility

  - `unit`: `all`. Library privacy spans the library and its parts.
  - `project`: `none` for `library-private`; `all` for `public`.
  - `external`: `none` for `library-private` and for entities in units
    without a distribution; `all` for `public` entities of libraries under
    `lib/`, including `lib/src/`, which a consumer can import by URI.

  ## Public API

  The public API of a distribution is its members and their signatures.

  ### Membership

  A distribution's members are its public libraries and the names of their
  export namespaces. A public library is a library under `lib/` whose path
  has no `src` directory component directly under `lib/`. It is a member
  because a consumer can name it, even when it has no public names. The export
  namespace is the library's public declarations plus every name its
  `export` directives add after `show` and `hide` combinators and
  configuration selection in the context. Members of exported classes,
  mixins, enums, extensions and extension types whose names are public are
  members of the public API. The unnamed constructor is one of them, with
  the consumer path segment `new`, because consumers call it as `C()` and
  tear it off as `C.new`; a class's synthetic default constructor is
  therefore a member too. A generative constructor of an enum, named or
  unnamed, is not a member, because a consumer can neither call nor tear it
  off: `E()` is an error, "Enums can't be instantiated", and `E.new` is an
  error, "Enum constructors can't be torn off". An enum's factory
  constructor is a member, because a consumer calls it as `E.name()` and
  tears it off. The synthetic `loadLibrary` of a deferred import
  prefix is not a member, because a consumer cannot name another library's
  import prefix; it keeps the importing library as its `parent`. An entity is a member once per public library
  that exports it; each such library contributes one consumer path.

  ### Signatures

  A project member's signature follows the model's Signatures section.

  | `language-kind` | Slots |
  | --- | --- |
  | `function`, `method`, `operator` | `type-parameters`, `parameters`, `returns`, `modifiers` |
  | `constructor`, `factory` | `parameters`, `modifiers` |
  | `class`, `mixin-class`, `enum` | `type-parameters`, `bases`, `modifiers` |
  | `mixin` | `type-parameters`, `bases`, `bounds`, `modifiers` |
  | `extension` | `type-parameters`, `receiver` |
  | `extension-type` | `type-parameters`, `bases`, `underlying`, `modifiers` |
  | `typedef` | `type-parameters`, `type` |
  | `field`, `variable`, `final`, `late` | `type`, `modifiers` |
  | `accessor` | `get`, `set`, `modifiers` |
  | `const` | `type`, `value` |
  | `enum-value` | `index`, always; `type`, for a value of a generic enum |

  Parameter modes: `optional` for an optional positional parameter, `named` for an
  optional named parameter and `required-named` for a `required` one. A required
  positional parameter has no mode. An optional parameter with no default has
  `default: "null"`.

  Modifiers: `abstract`, `base`, `const`, `covariant`, `external`, `final`, `interface`,
  `late`, `mixin`, `sealed` and `static`. An accessor has `modifiers`, `covariant`.

  `bases` holds the targets of the type's `inherits` and `implements` relations, with
  their type arguments. A mixin application has `position`, its index in the `with`
  clause, and reversing that clause changes both positions while the keys stay equal.

  `underlying` of an extension type is its representation type.

  `bounds` of a mixin holds its `on` clause, sorted and separated by `, `, with type
  arguments, because `on` limits which classes can apply the mixin. An `on` clause is
  no relation, and `model:signature-bases` does not read `bounds`.

  `receiver` of a named extension is its `on` type, and its `type-parameters` are the
  extension's own:

  ```yaml
  - entity: ops.BoundedOps
    type-parameters:
      - {name: T, kind: type, bounds: num}
    receiver: "@{ext.dart.core.List}<T>"
  ```

  `index` of an enum value is its 0-based position among the enum's values in
  source order, the value of its `index` getter and its position in `values`.
  Reordering the values changes both, which a consumer that stores an index or
  reads `values` observes, so a reordering changes `index` and is a break. It is
  an integer, not a value form, because no consumer writes it as a literal.

  `type` of a value of a generic enum is its instantiated type, because a consumer reads
  the value's members at that type: `@{Wrapped}<int>` for `intWrapper<int>(0)`, and
  `{inferred: "@{Wrapped}<int>"}` for `intWrapper(0)`.

  Canonical spelling:

  - Core names are written bare: `bool`, `double`, `dynamic`, `int`, `Never`, `Null`,
    `num`, `Object`, `String` and `void`.
  - `T?` for a nullable type. A function type is `int Function(String)`: a positional
    parameter's label is omitted and a named parameter's label stays, as
    `int Function(String, {int width})`. Type aliases stay as written.
  - Text uses `, ` between arguments and no space before `<`.

  Inference: an unannotated top-level variable, field, return, parameter or accessor is
  `{inferred: ...}`, including types inherited from an overridden member. `this.` and
  `super.` parameters have `{inferred: ...}` for their type, and a forwarded default has
  `{inferred: ...}` for its value. Each accessor half has its own type, including a half
  inherited from another supertype. A synthetic constructor has `{inferred}` slots by the
  language rule. `value` and `default` follow the model's value forms. An author derives
  these from the Dart specification and its type inference document, and a compile-only
  probe outside the tree, which assigns the member to a declared function or variable
  type, confirms them.

  The compiler report comes from the Dart front end. Where that toolchain is absent, every
  slot is `unchecked`.

  ## References

  The target is the declaration that Dart's lexical and library scope rules
  select, after following imports with prefixes and combinators and
  re-exports. A prefix identifier targets the library its import selects in
  the context. When several imports share one prefix, the language merges
  their namespaces under that prefix; a prefix identifier then targets the
  imported library whose namespace provides the name that follows the
  prefix, which valid source makes unique. In `shared.max` with
  `dart:convert` and `dart:math` both imported `as shared`, `shared` targets
  `dart:math`. A prefix identifier used without a following name, as in
  `shared.loadLibrary()` on a deferred prefix, targets that import's
  library.

  | Occurrence | Role |
  | --- | --- |
  | URI string in `import`, `export`, `part` and configurable URIs | `import` for imports and parts, `export` for exports |
  | Name in a `show` or `hide` combinator | `import` or `export` |
  | Prefix identifier and non-final segment that selects a library, class or extension | `qualifier` |
  | Invocation of a function or method, operator token bound to a user-defined operator | `call` |
  | Constructor invocation, with or without `new` or `const` | `construct` |
  | Type in a type position, `extends`, `with`, `implements`, `on`, `is`, `as` | `type` |
  | Variable, field, getter, constant or function tear-off read | `read` |
  | Assignment target, setter invocation | `write` |
  | Compound assignment, increment, decrement | `read-write` |
  | Name in a pattern | `pattern` |
  | Annotation | `attribute` |

  A URI string is a value site that spans the string contents without
  quotes; an observation spanning the quotes is accepted. In a configurable
  import or export, each URI is a site: an `import` reference, or an
  `export` reference for an export directive, to the library that URI
  names, whether or not the context selects that URI. The reference exists
  in each context that builds both the directive's own library, which holds
  the site, and the library the URI names: the intersection of their
  contexts, because a reference cannot target an entity outside its
  context. Across its contexts, the directive so depends on every library
  it can select that some declared context builds; a library that no
  declared context builds, such as a `dart:html` alternative in a project
  with no web context, has no reference. The directive's selected library
  is the one the prefix's references, its combinators and the export
  namespace follow.

  A constructor invocation targets the constructor entity; the class name
  token in `C.named()` is a `qualifier` to the class. Equivalence rule
  `dart:class-for-unnamed-constructor`: for `C()`, an observation targeting
  the class `C` is accepted as `equivalent`.

  ## Relations

  - `inherits`: `extends` and `with` clauses, from the class to the
    superclass and to each mixin, with `at` on the named type; the
    `dart:mixin-application` extension marks the `with` facts.
  - `implements`: `implements` clauses of classes, mixins, enums and
    extension types.
  - `overrides`: an instance member to each member it overrides in a
    superclass, mixin or superinterface, by Dart's override rules.
  - `aliases`: a `typedef` whose right side names a class, mixin, enum or
    extension type without type arguments.
  - `exports`: each name an `export` directive adds to a library's export
    namespace in the context, with `name` the name.

  ## Generated, synthetic and external entities

  - Entities in generated documents are `origin: generated`.
  - Synthetic entities: the default unnamed constructor of a class that
    declares none, anchored on the class name; the static `values` constant
    the language declares for each enum, anchored on the enum name; the
    `loadLibrary` function of each deferred import prefix, anchored on the
    prefix identifier at its import.
  - External key path: `<library URI>::<name>` at the defining library, with
    `dart:` URIs for the SDK. `distribution` is the package name, or `sdk`.

  ## Dispositions

  - `indeterminate`: member access or invocation on a `dynamic` receiver.
  - Statically bound references are `resolved` or `external`.

  ## Extensions

  | Kind | Members | Key | Compared |
  | --- | --- | --- | --- |
  | `dart:visibility-annotation` | `entity`, `annotation`: `protected`, `visibleForTesting`, `visibleForOverriding`, `internal` or `nonVirtual` | `entity`, `annotation` | none |
  | `dart:mixin-application` | `relation`: the id of an `inherits` relation from a `with` clause | `relation` | none |
  | `dart:deferred-import` | `unit`, `prefix`, `library`: the root entity of the deferred library's unit | `unit`, `prefix` | `library` |

  All three extensions are required.

  ## Authoring obligation

  For every Dart project dataset:

  1. Inventory every tracked file, and the units and contexts of every
     indexed file.
  2. Declare every context the `build` and `test` tasks define.
  3. Declare every unit with its language version, and every distribution.
  4. Record every entity of the kinds in the entity table, including
     synthetic entities.
  5. Record every in-profile reference, including URI strings, combinators,
     prefixes, constructors and annotations.
  6. Record every relation of the kinds above.
  7. Record declared and effective visibility for every entity other than
     parameters, and every required extension fact.
  8. Record the public API of every distribution in every context.
  9. Write every signature from source and the Dart specification, applying its inference rules yourself. Do not read a compiler report or a compiler draft of a
     declared slot while writing it. Run the compiler report from the Dart front end after
     writing, and settle each disagreement against the language's rule.
validation-criteria: |
  A Dart dataset conforms when it conforms to `semantic-oracle-model`, every
  context derives from a `build` or `test` task command, every configurable
  directive's selected URI agrees with the context's library flags, and every
  public API membership agrees with this profile's public-library rule.
  Independent review confirms facts against source, `pubspec.yaml` and the
  Dart specification.
  Every signature follows this profile's slots, modes, modifiers and canonical spelling,
  and its slots agree with the Dart front end or are listed as `unchecked`.
