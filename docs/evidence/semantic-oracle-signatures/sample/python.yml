# ---
# relationships:
#   references:
#     - semantic-oracle-signatures
# ---
# Hand-written sample. Not an answer key. Random members from seed 62, then chosen hard forms.
# No answer key exists for this project, so ids follow the module path.
signatures:
  # random sample
  - entity: redefinition.ClassBodyReplacement             # nothing to state; attribute facts below
  - entity: redefinition.ClassBodyReplacement.first       # unannotated: no type; no value in profile
  - entity: redefinition.overloaded_handler
    contexts: [typing]
    overloads:
      - parameters: [{name: value, type: int}]
        returns: int
      - parameters: [{name: value, type: str}]
        returns: str
  - entity: redefinition.overloaded_handler
    contexts: [runtime]
    parameters:
      - {name: value, type: "int | str"}
    returns: "int | str"
  - entity: warnings_toolkit.emit_custom
    parameters:
      - {name: message, type: str, default: '"toolkit custom warning"'}
    returns: None
  - entity: star_import_collision.demo_star_order_b_then_a
    returns: "dict[str, object]"
  - entity: operation_errors.trigger_type_error_via_operator
    returns: "dict[str, object]"
  - entity: warnings_toolkit.emit_deprecation
    parameters:
      - {name: message, type: str, default: '"deprecated toolkit API"'}
    returns: None
  - entity: redefinition.WithPropertyAccessor.value
    get: {type: int}
    set: {type: int}
    delete: present
  - entity: logging_hierarchy.demo_filter_and_extra
    returns: "dict[str, object]"
  - entity: import_failures.all_import_failure_demos
    returns: "dict[str, object]"
  - entity: warnings_toolkit.ToolkitWarning               # nothing to state; base type is a relation
  - entity: class_construction_failures.demo_slot_dup_in_single_class
    returns: "dict[str, object]"
  - entity: tracing_monitoring.monitoring_demo
    returns: "dict[str, object]"
  - entity: tracing_monitoring.tracing_demo
    returns: "dict[str, object]"
  - entity: tracing_monitoring.demo_generator_and_async_paths
    returns: "dict[str, object]"
  - entity: logging_hierarchy.demo_exception_data
    returns: "dict[str, object]"
  - entity: class_construction_failures.demo_inconsistent_mro
    returns: "dict[str, object]"
  - entity: doctest_examples.greet
    parameters:
      - {name: name, type: str}
    returns: str
  - entity: redefinition.duplicate_function               # last definition: the binding after import
    parameters:
      - {name: value, type: int}
    returns: int
  # chosen hard forms
  - entity: redefinition.conditional_definition           # no return annotation
    parameters:
      - {name: flag, type: bool}
  - entity: static_vs_runtime.checker_negative_assignment # declared type, wrong on purpose in source
    type: int
  - entity: static_vs_runtime.CheckerNegativeOverride.handle
    parameters:
      - {name: self}
      - {name: value, type: int}
    returns: int
  - entity: static_vs_runtime.checker_negative_exhaustiveness_missing
    parameters:
      - {name: status, type: "@{static_vs_runtime.StatusLiteral}"}
    returns: "str | None"
  - entity: static_vs_runtime.StatusLiteral               # no annotation, no TypeAlias form: a variable by the profile
  - entity: static_vs_runtime.checker_negative_any_escape
    parameters:
      - {name: value, type: "@{ext.typing.Any}"}
    returns: int
  - entity: security_guards.guarded_eval
    parameters:
      - {name: expression, type: str}
      - {name: allowed_names, type: "set[str] | None", default: None}
    returns: "@{ext.typing.Any}"
  - entity: warnings_toolkit.demo_capture_filter
    returns: "list[@{ext.warnings.WarningMessage}]"
