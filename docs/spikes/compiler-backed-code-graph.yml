conclusion: >-
  Use a build-capsule provider architecture that preserves native evidence and projects
  it into the versioned neutral graph. Keep SCIP as one augmented transport adapter and
  tree-sitter as an independent syntax inventory and fallback witness; neither is the
  foundational graph. Land the proven Rust vertical slice first, then use Go to harden
  build variants and portability. Do not trust coupling answers until the provider
  reports independent source inventory, dispositions, diagnostics, uncertainty, and
  validation for the configured build.
next-steps:
  - >-
    Promote the build capsule, evidence snapshot, provider trait, typed unknown reasons,
    and integrity rules into a versioned non-spike schema crate.
  - >-
    Implement the Rust build-capsule runner around rust-analyzer with Cargo target,
    feature, build-script, procedural-macro, inventory, and diagnostic capture.
  - >-
    Implement the Go provider as the first portability test, including module,
    workspace, build-tag, package-variant, generated-source, and external-cache
    accounting.
  - >-
    Design compact snapshot storage and versioned derived-report caching; keep
    inspectable JSON only as an export and test fixture.
  - >-
    Define provider conformance fixtures for repeated documents, external paths,
    compilation-unit variants, ambiguity, missing source context, target collisions, and
    incomplete dependency information across all six languages.
  - >-
    Audit locked scip-dart dependencies and required notice bundles before any provider
    binary redistribution.
