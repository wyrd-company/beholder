$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - semantic-oracle
  references:
    - semantic-oracle-model
    - semantic-oracle-profile-csharp
    - semantic-oracle-profile-dart
    - semantic-oracle-profile-go
    - semantic-oracle-profile-python
    - semantic-oracle-profile-rust
    - semantic-oracle-profile-typescript
objective: >-
  Make the public API of a distribution state what a consumer depends on: the
  members a consumer can name and the signature of each member. The Beholder
  library then lets a consumer know that a public API changed by comparing two
  snapshots, and the semantic-oracle corpus measures how accurate those
  snapshots are.
background:
  current-design: |
    The model's "Public API membership" section states that an external
    consumer can name an entity, at which consumer paths, with which access.
    Entities of kind `parameter` and `type-parameter` exist, with names and
    sites. `references` with role `type` connect the type tokens of a
    declaration to their targets. `inherits` and `implements` relations connect
    a type to its bases, without type arguments. The out-of-profile set holds
    inferred types and values.

    The Beholder library analyzes Rust, Go and TypeScript with tree-sitter.
    `Analysis` holds per-file `Symbol` records and a heuristic reference graph.
    `delta::compare` pairs symbols by an id built from the file path, kind and
    qualified path, and reports a change when a token fingerprint of the whole
    symbol, including its body, differs. The library has no notion of context,
    unit, distribution, visibility, public API member or signature.

    SCIP carries a signature only as `SymbolInformation.signature_documentation`,
    a text document for display.
  problems:
    - A contract named public API that records only membership does not state the types, parameters, constants or modifiers that a consumer compiles against.
    - The corpus cannot measure a capability that its facts do not state.
    - A comparison of symbol fingerprints reports a body edit as a change and cannot report a change that a declaration's text does not show.
design-challenges:
  no-false-changes: >-
    A reformat, a renamed import, a qualified name, or a second spelling of one
    type does not change what a consumer depends on. A comparison reports none
    of these.
  no-missed-changes: >-
    A declaration whose text is unchanged can still change: the import selects
    another type of the same name, a private constant moves a public constant's
    value, a body edit moves an inferred return type, or a private field removes an
    auto trait. A comparison reports these.
  six-languages: >-
    The six languages have different type syntax, parameter forms and inference
    rules. One fact form carries them without a type grammar per language in
    the model.
  independence: >-
    Facts come from source, build configuration, language specifications and
    reference compilers. SCIP, Beholder and other evaluated indexers are never
    an input, including for inferred types.
  bounded-cost: >-
    The facts cover what a consumer depends on, and 84 answer keys stay
    authorable and reviewable. A reviewer checks most facts mechanically.
proposed-design:
  high-level-overview: |
    The public API of a distribution in a context is its members and their
    signatures. A signature is a set of named slots. A slot holds a name, a
    mode, a value or a type text. A type text is the language's own type syntax
    in one canonical spelling, in which every name that denotes an entity is
    written `@{id}`. Evaluation compares one slot at a time. A library snapshot
    uses the same slots, so that the corpus grades the data a consumer receives.

    ```yaml
    public-api:
      members:
        - distribution: geometry
          entity: geometry.shapes.area
          paths: [geometry::area, geometry::shapes::area]
          access: all
      signatures:
        - entity: geometry.shapes.area
          type-parameters:
            - {name: T, kind: type, bounds: "@{ext.core.marker.Copy}"}
          parameters:
            - {name: shape, type: "&@{geometry.shapes.Circle}"}
            - {name: scale, type: "@{ext.core.option.Option}<T>"}
          returns: f64
    ```

    The evidence directory `docs/evidence/semantic-oracle-signatures/` holds the
    tests behind this design.
  terms: |
    | Term | Meaning |
    | --- | --- |
    | public API | The members of a distribution in a context and the signature of each member. |
    | public API member | An entity that an external consumer can name. |
    | public API membership | The fact that states a member: distribution, entity, consumer paths and access. |
    | signature | The facts about a member's declaration that a consumer depends on, beyond its name. |
    | slot | One named part of a signature, such as `returns` or `parameters[1].type`. The unit of comparison. |
    | type text | A type in the language's own syntax and one canonical spelling, with `@{id}` for each name that denotes an entity. |
    | API snapshot | The public API of one distribution in one context at one revision, as the library reports it. |
    | API change | One difference between two API snapshots of a distribution in the same context. |

    "Public API" alone means members and signatures. "Public API membership" and
    "public API member" stay where the text means membership. The dataset's
    top-level `public-api` has `members` and `signatures`. The observation form
    `public-api` becomes `public-api-member`, the new form is `signature`, and
    the check `model:public-api-recomputed` becomes
    `model:public-api-membership-recomputed`. A profile's "Public API" section
    keeps its title and states both its membership rule and its signature rules.
  fact-form: |
    A signature fact is one record per member and distinct set of contexts. The
    record holds slots. A type slot holds a type text.

    Rules of a type text:

    - It uses the language's own type syntax.
    - Each name that denotes a project or external entity is written `@{id}`.
    - A primitive or predeclared name that the profile lists is written bare.
      Its resolution is fixed by the `references` fact at the declaration.
    - A type parameter is written by its declared name.
    - An alias is not expanded. `f(a: Id)` has `@{Id}`, and `Id` has its own
      `type` slot.
    - Each profile fixes one spelling: spacing, the order of members of a set
      (union members, property members of a type literal), and the canonical form
      of equivalent spellings, such as `string[]` for `Array<string>`, `any` for
      `interface{}`, `int | None` for `Optional[int]`, the type name for `Self` in
      an implementation, and `<T as Tr>::Item` for `T::Item`.
    - Order stays where the language gives it meaning. Call and construct
      signatures and repeated method signatures of a TypeScript type literal keep
      their effective overload order, including the precedence of merged
      declarations.

    The notation keeps one spelling for each meaning, as the model's visibility
    values do, so equal facts are equal strings. Outside a string literal, `@{`
    does not occur in the type syntax of the six languages. TypeScript's `${` and
    type literals `{ }` stay distinct from it.

    Examples:

    ```yaml
    # Rust. `core::option::Option` and `std::option::Option` are one type.
    - entity: mvr.preludes.core_vs_std_paths
      returns: "(@{ext.core.option.Option}<u32>, @{ext.core.option.Option}<u32>)"
    # Rust. Bounds, lifetimes and an opaque return.
    - entity: capture_2021.captures_all
      type-parameters:
        - {name: "'a", kind: lifetime}
        - {name: T, kind: type, bounds: "'a + @{ext.core.clone.Clone}"}
        - {name: N, kind: const, type: usize}
      parameters:
        - {name: value, type: "&'a T"}
      returns: "impl @{ext.core.clone.Clone} + use<'a, T, N>"
    # TypeScript. Inferred, with a type that no consumer can name.
    - entity: src.declaration-emit.leaked-private.ts#acquireHiddenLedger
      parameters:
        - {name: token, type: number}
      returns: {inferred: "@{src.declaration-emit.leaked-private.ts#HiddenLedgerRef}"}
    # TypeScript. One entity, several signatures.
    - entity: polymorphic-this.overloaded
      overloads:
        - type-parameters: [{name: T, kind: type}]
          parameters: [{name: value, type: T}]
          returns: T
        - parameters: [{name: value, type: string}]
          returns: string
    # Python. A literal default and an external type.
    - entity: security_guards.guarded_eval
      parameters:
        - {name: expression, type: str}
        - {name: allowed_names, type: "set[str] | None", default: None}
      returns: "@{ext.typing.Any}"
    # Go. A constant keeps its untyped kind and its exact value.
    - entity: lib.A
      type: untyped int
      value: "1"
    ```

    The test `representation_test.py` compiles or runs a real consumer against
    30 before-and-after pairs in Rust, TypeScript, Go and Python, and asks
    whether each representation reports a change. A change that does not break
    the consumer counts as false, and a break with no reported change counts as
    missed. The pairs were chosen to test the representations, so the counts
    compare the forms and do not estimate how often each case occurs.

    | Representation | False changes | Missed changes (of 11 breaks) |
    | --- | --- | --- |
    | Source text | 16 | 7 |
    | Source text without whitespace | 13 | 7 |
    | Slots, type text as written with canonical target ids | 10 | 2 |
    | Slots, type text under the canonical rules (this design) | 3 | 2 |

    What the test shows:

    - Formatting accounts for 3 of the 16 false changes of source text, and
      removing whitespace removes them. Formatting alone does not choose
      structure over text.
    - Resolved names and derived values choose structure: an import that selects
      another type, a constant that follows a private constant, an inferred
      return and an auto trait that `impl Trait` leaks are all invisible to text.
    - Structure alone is not enough. Without the canonical spelling rules and
      consumer-path identity, slots report 10 false changes. The rules remove 7.
    - The 3 remaining false changes are accepted: a parameter rename in Rust and
      two replacements of a transparent alias by its target. Each is a real
      source change that a consumer's own rules can classify as harmless.
    - The 2 remaining missed changes are accepted boundaries: a default that
      follows a private name in Python, and a Python return with no annotation. The
      inference table below states them.

    The same script holds 10 slot regressions: consumer breaks in a trait
    implementation's associated type, an inherent implementation's bound, a
    constructor, a call signature, a setter, an optional member, the order of a
    type literal's call signatures, a Go array length, a Go constraint's terms and a
    private field that removes `Send` from a public struct.
    Each one breaks a real consumer and changes a slot. They stay out of the table,
    because the script's text extractor reads declaration headers and these changes
    are in bodies.

    The considered forms:

    | Form | Result | `Option<Beta>` |
    | --- | --- | --- |
    | Source text | Fails the test above, and has no text at all for a generated or inferred member. | `Option<Beta>` |
    | Full type tree | Same comparison result as type text. Needs a node vocabulary for each language's type forms: conditional and mapped types, function pointers, records, GATs. The sample's type values take about 426 lines in place of 110. | 8 lines |
    | Slots with type text | Passes the test at the lowest authoring and review cost. One canonicalizer per language. | `@{ext.core.option.Option}<@{Beta}>` |
  scope: |
    A member has a record when it has at least one slot. An absent slot states
    that the source and the profile give no value for it.

    | Member kind | Slots |
    | --- | --- |
    | `callable` | `type-parameters`, `where`, `impl`, `abi` (Rust), `receiver` (Go), `parameters`, `returns`, `return-mode` (C#), `modifiers`, `auto-traits` (Rust); `overloads` holding these slots when one entity has several signatures |
    | `type` | `type-parameters`, `where`, `bases`, `implementations` (Rust), `underlying`, `bounds` (a Dart mixin's `on`), `modifiers`, `auto-traits` (Rust); for TypeScript, `constructors`, `call-signatures`, `construct-signatures` and `index-signatures` |
    | `type-alias` | `type-parameters`, `where`, `type`; for a Rust associated type, `bounds` and `type` as its default |
    | `field` | `type`, `tag` (Go), `modifiers` |
    | `property` | `get`, `set`, `init` (C#), `add` and `remove` (a C# event), `delete` (Python), `parameters` for an indexer, `return-mode` (C#), `modifiers` |
    | `variable` | `type`, `modifiers` |
    | `constant` | `type`, `value`, `modifiers` (Rust `provided`) |
    | `enum-member` | `value`; `type` for a value of a generic Dart enum |
    | `extension` | For a named Dart extension, `type-parameters` and `receiver`, its `on` type. No signature otherwise. |
    | `module`, `namespace`, `macro` | No signature. Membership states them. |
    | An external entity a re-export names | No signature, by the model's rule on the internal structure of external entities. |

    | Nested record | Slots |
    | --- | --- |
    | Parameter | `name`, `type`, `mode` (profile vocabulary: `optional`, `rest`, `ref`, `out`, `in`, `params`, `self-ref`, `keyword-only`, `positional-only`, `named`, `required-named`, and similar), `default` |
    | Type parameter | `name`, `kind` (`type`, `lifetime`, `const`), `type` for a const parameter, `bounds`, `default`, `variance`, `modifiers` (TypeScript `const`) |
    | Accessor (`get`, `set`, `init`, `add`, `remove`, `delete`) | `type`, `access` when narrower than the member's, `modifiers` (Dart `covariant`). `delete` is the value `present`. |
    | `impl` (Rust) | `type-parameters`, `self-type`, `where`, for a member of an inherent implementation with binders or a specialized self type |
    | Base (`bases`) | `type`, the type text with its arguments; `position` for a Python base or a Dart mixin application; for a Rust trait implementation, `type-parameters`, `self-type`, `where`, `bindings` |
    | Implementation (`implementations`) | The slots of a base, with `self-type` always, for a Rust implementation whose self type no relation can start from |
    | Binding (`bindings`) | `name`, `type-parameters`, `where`, and `type` or `value` |

    Order is significant in `parameters`, `type-parameters`, `overloads`,
    `constructors`, `call-signatures` and `construct-signatures`. `modifiers` is a
    set. `index-signatures` are sorted by key type, `bases` and `implementations` by
    `type` and then `self-type`, and `bindings` by `name`. A profile lists its modifiers, and a modifier is listed when it changes
    what a consumer can do:

    | Language | Modifiers |
    | --- | --- |
    | C# | `abstract`, `sealed`, `static`, `virtual`, `override`, `readonly`, `required` |
    | Dart | `abstract`, `base`, `const`, `covariant`, `external`, `final`, `interface`, `late`, `mixin`, `sealed`, `static` |
    | Go | none; a pointer receiver is the `receiver` slot |
    | Python | `abstract`, `final`, `classvar`, `not-required` (a `TypedDict` key that is effectively not required, by `total` of its own class, `Required` and `NotRequired`); `classmethod` and `staticmethod` are `language-kind` values |
    | Rust | `unsafe`, `const`, `async`, `non_exhaustive`, `provided` (a trait item with a default body), `auto` |

    C# and TypeScript `async` is not a modifier, because the return type states
    its effect on a caller. Rust `async` is one, because the declared return type
    does not. TypeScript `optional` is distinct from `undefined` in the type,
    because a required member can have that type.
    | TypeScript | `abstract`, `optional`, `readonly`, `static` |

    `inherits` and `implements` relations stay as they are, one fact from a type to
    a base. A member type's `bases` slot states what a relation cannot: the type
    arguments, and for a Rust trait implementation the binders, self type, bounds
    and the associated types and constants the implementation sets. Validation
    checks that the `bases` targets of a member equal its relations' targets.

    ```yaml
    - entity: api.Entry
      bases:
        - type: "@{api.Record}"
          bindings:
            - {name: Key, type: u32}
    ```

    `impl Trait<u8> for X` and `impl Trait<u16> for X` are one relation and two
    `bases` entries.

    Base order changes behavior in two languages. A Python base's `position` is its
    index in the class's base list, which sets the method resolution order, and a
    Dart mixin's `position` is its index in the `with` clause. `position` is a
    compared slot, so that reversing `class C(A, B)` is a `SlotChanged` on both
    entries while their keys stay equal.

    A member of an inherent Rust implementation has the `impl` slot when the block
    has binders or a specialized self type, because the block decides when a
    consumer can call the member: `impl<T: Clone> Container<T>` is
    `impl: {type-parameters: [{name: T, kind: type, bounds: "@{ext.core.clone.Clone}"}], self-type: "@{Container}<T>"}`.

    `underlying` states the type a declaration is defined over: a Go defined type's
    full underlying type, always, with struct field order, unexported fields, tags
    and interface type sets, such as `[2]int` or `interface { ~int | ~string }`,
    even where field slots repeat part of it; a C# enum's integral type; and a Dart
    extension type's representation. In a Go struct's text, field labels stay as
    names and are never `@{id}`, and a tag is its decoded value as a JSON string.

    TypeScript constructors and unnamed members are not public API members. Their
    signatures are slots of the owning type, in effective order. A constructor has
    `access` when it is `protected` or `private`, so that restricted construction
    stays visible. A class that declares no constructor has one `constructors`
    entry for its synthetic constructor, with its inherited parameters as
    `{inferred}` slots. That entry's source declaration is the owning class, and the
    audit reads the class and the synthesis rule.

    Rust records auto traits in one `auto-traits` slot, on every `struct`, `enum` and
    `union` member and on every callable whose return contains `impl Trait` or is the
    future of an `async fn`, because losing an auto trait such as `Send` is a break that
    no written signature shows, and a private field change can cause it on an ordinary
    public struct. The traits are `Send`, `Sync`, `Unpin`, `UnwindSafe` and
    `RefUnwindSafe`. The slot is a sorted list of the traits the type implements. A trait
    it does not implement is absent, and a type that implements none has no slot. A trait
    held under a condition is written `<trait> when <conditions>`, such as
    `Send when T: Send` or `Sync when T: Sync, U: Send + Sync`, with sorted predicates
    and bounds. The slot compares as a set of units like `modifiers`, one per trait, with
    the trait name as key: `auto-traits[Send]`. A changed condition is a `wrong-value`.

    A Rust callable's `abi` is its ABI string, absent for the Rust ABI, and the tail
    `...` of a C variadic function is a parameter `{mode: c-variadic}`. `provided` on an
    associated constant states its default whether or not the default has a `value`
    slot. `implementations` is a slot of a trait, for a blanket implementation and an
    implementation for a type that is not a project type, which no `implements`
    relation can start from.

    A C# event's `add` and `remove` accessors hold its delegate type. A fixed-size
    buffer's `type` is `char[24]`, the oracle's spelling of its length. A Python
    signature's `type-parameters` include the module-level `TypeVar` names it uses, with
    their declared bound, constraints, variance and default.

    Rust bounds have one form: a bound on a bare parameter, inline or in a `where`
    clause, is in that parameter's sorted `bounds`, and `where` holds other
    predicates only.

    C# type text states the effective nullable annotation of each reference type
    occurrence: `string?` annotated, `string` not annotated, and `string~` oblivious.
    `~` is an oracle extension to C# type syntax, placed on each oblivious occurrence,
    including nested ones. `#nullable` warning state is not recorded. Tuple element
    names stay in the type text. `return-mode` is `ref` or `ref readonly`, and is
    absent for a return by value.

    Go tags are compared by decoded value. A promoted member's signature stays the
    declaration's signature, with its type parameters, and the embedding type's
    `underlying` states how they bind. Promotion creates no record.

    For a partial C# member, the defining declaration supplies the parameter names,
    order and defaults, and the parameter audit reads its sites.

    A Python `TypedDict` key's `type` has no `Required` or `NotRequired` wrapper,
    because the modifier states it. The wrapper tokens keep their `references`
    facts, and the reference audit does not expect them in a slot.

    A synthetic member has slots by the language rule that implies it: a default
    constructor, a Python dataclass `__init__`, a C# record's positional members.

    Constant, enum and default values have one form: `null`; integers in decimal;
    booleans; strings and chars as JSON strings; floats as the shortest round-trip
    decimal; C# `decimal` as its exact decimal; an enum value as `@{id}`; and all Go
    numeric constants as `go/constant` exact strings, such as `1/3` or
    `(5/2 + 3i)`. C# `default` is written as the value it denotes for the type, and
    a Dart optional parameter with no default has `default: null`. A constant of any
    other type has no `value` slot.

    An entity reached only as the type of a value stays a non-member. A `@{id}`
    whose target has no consumer path shows that the signature exposes it, and
    `rust:reachable-unnameable` `via` is recomputed from these facts.
  inferred-types: |
    "Inferred types" stays in the model's out-of-profile set. A profile moves
    the named constructs below into its required categories by the model's
    existing rule. A slot whose type no source token states, because inference or
    a synthesis rule gives it, is written `{inferred: <type text>}`. An observation
    of a type that the inference rule below leaves unstated is `out-of-profile`. The
    slots of an extra parameter and a `bases` key that the record does not have stay
    `unexpected`.

    | Profile | What it records | How an author derives it |
    | --- | --- | --- |
    | `rust/1` | Nothing is inferred: item signatures must state their types. `impl Trait` is recorded as written, `impl @{Clone} + use<'a>`. The hidden type is not recorded, and `auto-traits` states what it leaks. Lifetimes are as written, with no elision expansion. | Source and the Rust Reference (Items, Lifetime elision). `value` from the Reference's constant evaluation rules; a `const` assertion probe confirms it. `auto-traits` from the Reference's auto trait rules applied to the type's fields; a compile check confirms each. |
    | `typescript/1` | `{inferred: ...}` for an unannotated return, `const`, `let`, field or accessor of a member, with the type that `tsc --declaration` emits for the context's options and compiler version, in canonical spelling. `/*elided*/ any` in that emit is written as `any`. A `.d.ts` member is all declared. | The compiler supplies it: `tsc --declaration` outside the tree. TypeScript has no current language specification, and a consumer of a published package compiles against that emit, so the compiler defines the answer. |
    | `python/1` | No inference. An unannotated parameter, return or variable has no type slot, because the typing specification leaves inference to each checker. `default` is the literal in canonical form, or `present` when the default is not a literal. `@overload` stubs are `overloads` in `typing` contexts and the implementation signature is the record in `runtime` contexts. A redefined name has the signature of the final binding. When control flow leaves several definitions possible, the record has `alternatives`, each with its `at` and slots. A `TypedDict` key's requiredness is a modifier. Decorators other than the ones the profile names leave the signature as written. | The Language Reference and typing specification applied to source. `inspect.signature` run outside the tree confirms names, order, kinds, defaults and annotations. |
    | `go/1` | A constant's `type` is its declared type or its kind: `untyped bool`, `untyped rune`, `untyped int`, `untyped float`, `untyped complex`, `untyped string`. `value` is exact for typed and untyped constants, with `iota` and implicit repetition applied. `var X = expr` has `{inferred: ...}`, the expression's type or its kind's default type. Function signatures are always declared. Result names are not recorded. | The Go specification (Constants, Iota, Variable declarations). A `go/types` probe outside the tree confirms it. |
    | `csharp/1` | A declared member has no inferred type. A synthetic member, such as a record's copy constructor or `EqualityContract`, has `{inferred: ...}` by the synthesis rule. Nullable state is the effective annotation at each type occurrence, including local `#nullable` directives. `value` and `default` are the constant's value under the specification's constant expression rules. | The C# language specification and a Roslyn compile probe outside the tree. |
    | `dart/1` | `{inferred: ...}` for an unannotated top-level variable, field, return, parameter or accessor, including types inherited from an overridden member. `this.` and `super.` parameters have `{inferred: ...}` for their type, and a forwarded default has `{inferred: ...}` for its value. Each accessor half has its own type, including a half inherited from another supertype. `value` and `default` by the value form above. | The Dart specification and its type inference document, confirmed by a compile-only probe that assigns the member to a declared function or variable type. |

    The Authoring section states who writes each fact and what the compiler does.
  authoring: |
    An author writes what the source states. A compiler checks all of it. A compiler
    supplies an inferred type only where it defines the answer.

    | Step | Who | Input | Output |
    | --- | --- | --- | --- |
    | Declared slots | The author | Source, build configuration, the language specification | Slots, including types, modes, modifiers, defaults and values |
    | Inferred slots with a specification | The author | The specification's inference rule applied to source: Go and Dart | `{inferred: ...}` slots |
    | Auto traits | The author | The Reference's auto trait rules applied to the type's fields, including private ones: Rust | `auto-traits` |
    | Inferred slots the compiler defines | The compiler | `tsc --declaration` for the context's options and version: TypeScript | `{inferred: ...}` slots, in canonical spelling |
    | Check | The compiler | The project, for each context | A compiler report that the audit compares with every slot it can state |

    The author does not read a compiler report or a compiler draft of a declared slot
    while writing it, so that writing and checking stay separate and a disagreement
    shows. A disagreement is a finding to settle against the language's rule. It
    is never settled by copying the compiler's value.

    The compiler report is a JSON file that a per-language script produces outside
    the project tree, and that `semantic-oracle audit` reads. The crate runs no
    compiler. The scripts are development tools, run from Taskfile.

    | Language | Compiler report comes from |
    | --- | --- |
    | Rust | rustdoc JSON, and a compile check for `auto-traits`: a consumer that requires a trait compiles when the slot lists it and fails when it does not |
    | TypeScript | `tsc --declaration` |
    | Go | `go/types` |
    | Python | `inspect.signature`, for names, kinds, defaults and annotations |
    | C# | Roslyn; the toolchain is tracked in wyrd-company/beholder#63 |
    | Dart | The Dart front end; the toolchain is tracked in wyrd-company/beholder#63 |

    Python has no reference type checker, so its report covers the runtime's view
    only. A slot that a report cannot state, or a language whose toolchain is absent,
    is `unchecked` in the audit output.

    Independence: SCIP, Beholder and every evaluated indexer or language service are
    never an input, to authoring or to the check. A compiler that an evaluated indexer
    wraps can share an error with it, as `scip-typescript` shares `tsc`. Only the
    compiler-supplied slots carry that exposure, and the report's `slot-class` grouping
    keeps them separate from the slots an author wrote. The model's authoring
    independence rule gains these statements.
  comparison-and-scoring: |
    Evaluation adds one observation form and one comparison unit.

    | Form | Members |
    | --- | --- |
    | `signature` | entity key, slot path, value, and `at` for an alternative. A slot path includes the overload ordinal and the signature group, such as `constructors[0].parameters[1].type`. A type text names entities by key in `@{}`. |

    | Unit | Identity | Pairing key | Compared members |
    | --- | --- | --- | --- |
    | signature | `(entity, alternative, slot path)`; `alternative` is the `at` of a Python alternative | same | value |

    A parameter pairs by position. A missing parameter is `missing` on each of
    its slots, and an extra parameter is `unexpected` on each of its slots. A
    pair whose value differs is `wrong-value`. A value with a name the indexer
    could not resolve, written `@?{name}`, is `wrong-value` with reason
    `unresolved`. An observation equal to an already matched one is `duplicate`.

    Alternatives follow the model's rule for several definition sites: every
    alternative is expected, and each slot is a unit. An observation with `at` pairs
    with that alternative. An observation without `at` pairs in the exact pass with
    the first unpaired alternative in canonical order that has its value, and
    otherwise stays unpaired when several alternatives remain. It is a `duplicate`
    only when no unpaired alternative has its value, so that two identical
    observations match two alternatives with equal values. Each slot pairs on its
    own, so one observation's slots can match different alternatives.

    A `bases` or `implementations` entry is keyed by its `type` and `self-type`, written
    in the slot path:
    `bases[@{Trait}<u8>].where`. A wrong `where` or binding is `wrong-value` on that
    slot. A wrong `type` is a different key, so it is `unexpected` and the expected
    entry's slots are `missing`. Relation units are unchanged, so an adapter that
    reports relations and no signatures is graded on relations as before, and its
    `bases` slots are `unsupported`.

    An adapter declares five capabilities: `signature-shape` (names, order,
    modes, modifiers, accessors), `signature-declared-type`,
    `signature-inferred-type`, `signature-value` and `signature-auto-trait`.
    `auto-traits` has its own capability, because a syntax tree states a declaration's
    shape and does not solve its auto traits. An indexer that lacks the capability gets
    `unsupported` on those units.

    | Adapter | Result |
    | --- | --- |
    | Reports no signatures, which includes the SCIP adapter, because `signature_documentation` is display text | Every signature unit is `unsupported`, including `bases`. Rates for the group are undefined, the report lists the count, and no other group changes. |
    | Reports declared types but no inference | Declared units are graded. `{inferred}` units are `unsupported`. |
    | Declares inference and omits a slot | `missing`. |
    | Does not declare `signature-auto-trait` | `auto-traits` units are `unsupported`. |
    | Reports a type for a Python parameter with no annotation | `out-of-profile`. |

    Reports add the grouping `slot-class` (`shape`, `declared-type`,
    `inferred-type`, `value`, `auto-trait`). The API boundary grouping holds every signature
    unit. No score combines them.

    Controlled cases added to the table:

    | Facts | Observations | Result |
    | --- | --- | --- |
    | `returns: u32` | `returns: u32` | one `matched` |
    | `returns: u32` | `returns: u64` | one `wrong-value` |
    | `returns: "@{Beta}"` | `returns: "@?{Beta}"` | one `wrong-value (unresolved)` |
    | parameters `a`, `b` | parameter `a` only | `a` `matched`; `b` `missing` on each slot |
    | `returns: {inferred: string}`, adapter without `signature-inferred-type` | none | one `unsupported` |
    | no `returns` slot (Python) | `returns: int` | one `out-of-profile` |
    | alternatives A `returns: int`, B `returns: str` | `returns: int`, no `at` | A `matched`; B `missing` |
    | alternatives A `returns: int`, B `returns: str` | `returns: int` at A, `returns: str` at B | two `matched` |
    | alternatives A `returns: int`, B `returns: str` | `returns: bytes`, no `at` | one `unexpected`; A and B `missing` |
    | alternatives A `returns: int`, B `returns: str` | `returns: int` at A, twice | one `matched`, one `duplicate`; B `missing` |
    | alternatives A and B, both `returns: int` | `returns: int`, no `at`, twice | two `matched` |
    | alternatives A and B, both `returns: int` | `returns: int`, no `at`, three times | two `matched`, one `duplicate` |
    | `bases` `@{T}<u8>` and `@{T}<u16>`, each `where: W` | both types, each `where: Z` | two `wrong-value` |
    | `bases` `@{T}<u8>` | `@{T}<u16>` | `type` `unexpected`; `@{T}<u8>` `type` `missing` |
    | `bases` `@{A}` position 0, `@{B}` position 1 | `@{A}` position 1, `@{B}` position 0 | two `wrong-value` |
    | `auto-traits: [Send, Sync]` | `Send` only | `Send` `matched`; `Sync` `missing` |
    | `auto-traits: ["Send when T: Send"]` | `Send` | one `wrong-value` |
    | `auto-traits: [Send, Sync]`, adapter without `signature-auto-trait` | none | two `unsupported` |
    | `implements X→T`, `bases` `@{T}<u8>`, adapter with relations only | `implements X→T` | relation `matched`; `bases` slot `unsupported` |

    Validation and audit check:

    - `model:signature-slots`: each member has the slots its kind and profile
      require, and no other.
    - `model:signature-canonical`: a type text is in canonical spelling, and
      each `@{id}` resolves.
    - `model:signature-parameters`: the `name` values and order of a parameter list
      equal the `parameter` entities of its source declaration, by site.
    - `model:signature-references`: each `@{id}` in a declared type text has a
      `type` reference fact whose `from` is the slot's source
      declaration or an entity inside it by `parent`, and each such reference inside
      a parameter has its `@{id}`.
    - `model:signature-inference`: an `{inferred}` slot on a source entity has no such
      reference requirement, and is audited at its definition site against the
      inference rule by `profile:signature-compiler`. An `{inferred}` slot on a synthetic
      entity is audited against its `anchor` and synthesis rule.
    - `model:signature-bases`: the targets of `bases` equal the member's `inherits`
      and `implements` relations. A base that the profile's structural rule gives, such
      as a Go `implements` pair, has no source token, and the audit reads its method
      sets instead of a reference.

    The source declaration of a slot is:

    | Slot | Source declaration |
    | --- | --- |
    | A member's own slot | The member entity |
    | `overloads[n]` | The member's nth signature site |
    | `constructors[n]`, `call-signatures[n]`, `construct-signatures[n]`, `index-signatures[n]` | That constructor or unnamed callable entity |
    | `impl` | The `extension` entity, with its `type-parameter` entities |
    | `bases[k]` | The `extension` entity for a Rust implementation; the member for other languages |
    | `implementations[k]` | The `extension` entity |
    | `underlying` | The member and its field entities |
    | A `type-parameters` entry for a name the declaration does not declare | That name's declaration, where the profile gives one: a Python `TypeVar` |
    | `auto-traits` | The member. It is not a declared type text, and `profile:signature-compiler` audits it. |
    | `get`, `set`, `init`, `add`, `remove`, `delete` | The property entity. An accessor record has no parameter list, so that the parameter audit does not read a property's parameters. |

    - `profile:signature-compiler`: facts agree with the language's compiler report,
      as the Authoring section states. A language with no report is listed as
      `unchecked`, and never as passed.
  library-surface: |
    A consumer works with these types, for each context:

    ```rust
    pub struct ApiSnapshot { pub revision: String, pub context: ContextId, pub distributions: Vec<DistributionApi> }
    pub struct DistributionApi { pub key: DistributionKey, pub members: Vec<ApiMember> }
    pub struct ApiMember { pub entity: EntityKey, pub kind: EntityKind, pub paths: Vec<String>, pub access: Access, pub signatures: Vec<Signature> }

    pub fn snapshot(analysis: &Analysis, context: &ContextSpec) -> ApiSnapshot;
    pub fn compare(before: &ApiSnapshot, after: &ApiSnapshot) -> ApiDelta;

    pub enum ApiChange {
        MemberAdded(ApiMember),
        MemberRemoved(ApiMember),
        PathAdded { member: EntityKey, path: String },
        PathRemoved { member: EntityKey, path: String },
        AccessChanged { member: EntityKey, before: Access, after: Access },
        SlotChanged { member: EntityKey, slot: SlotPath, before: Option<Value>, after: Option<Value> },
        SlotUnknown { member: EntityKey, slot: SlotPath },
    }
    ```

    - `compare` runs per distribution and context. A context in one snapshot only
      is reported, and its members are not.
    - Members pair by shared consumer path and kind, not by `symbol_id`. A move
      behind an unchanged re-export is no change. A member with no shared path pairs
      by canonical path.
    - `compare` first pairs every entity across the snapshots, and an `@{id}` compares
      through that pairing. Adding a re-export is a `PathAdded` and changes no
      signature that names the target.
    - The pairing is one global pass. The candidates are all pairs of the same kind
      with at least one shared consumer path, ordered by the most shared paths, then
      the first shared path, then the two canonical paths. Each candidate in order
      pairs when neither side has a pair, and a tie that remains orders by the full
      entity key. Entities with no pair then pair by equal full entity key, and the
      rest are `MemberAdded` and `MemberRemoved`.
      For A {a,b,c}, B {d,e}, X {a,b,d,e}, Y {c}: A pairs with X, B is removed, and Y
      is added. A signature that names a target with no pair reports `SlotChanged`.
    - A type parameter compares by position, so that a rename of `T` is no change.
    - Each slot value carries its evidence as `EdgeRecord` does: `resolved`,
      `syntactic` or `unknown`. A slot that the library cannot state is
      `SlotUnknown`, never a change.
    - `ApiSnapshot::observations()` yields `public-api-member` and `signature`
      observations, so that the Beholder adapter grades the data a consumer gets. A
      removed base is a `SlotChanged` on `bases`.
    - `compare` reports facts. A consumer classifies them, such as breaking or
      harmless.
    - The 84 answer keys measure snapshot accuracy on one revision. `compare` is a
      pure function that controlled before-and-after pairs test, with the pairs of
      `representation_test.py` as the first cases.

    All of this surface is new: contexts, units, distributions, effective
    visibility, membership, signatures and `compare`. The library has grammars
    for three of the six languages, and a syntax tree does not state an inferred
    type. Signature units for Python, C# and Dart, and inferred and auto trait units in
    every language, are `unsupported` until the library has a source for them.

    Work is divided as follows:

    | Issue | Scope |
    | --- | --- |
    | wyrd-company/beholder#62 | Model, schemas, six profiles, validation and audit, the Rust, TypeScript and Python pilot answer keys. |
    | wyrd-company/beholder#18 | The `signature` form, comparison unit, capabilities and controlled cases in the comparison engine and the SCIP adapter. |
    | A new issue | The library surface above, its Beholder adapter, and the controlled pairs for `compare`. It can start after the fact shape is in the contract. |
  cost: |
    The sample is 88 records for 87 members, written by hand by one agent: Rust from
    `modules-visibility-and-resolution`, TypeScript from
    `package-publishing-ecosystem`, and Python from `diagnostics-toolkit`, with a
    seeded random 18 per language and the rest chosen as hard forms, including forms
    from outside these projects. The sample is in
    `docs/evidence/semantic-oracle-signatures/sample/`, and `count_sample.py` counts
    it.

    | Measure | Rust | TypeScript | Python | All |
    | --- | --- | --- | --- | --- |
    | Records | 32 | 28 | 28 | 88 |
    | Records with no slot | 6 | 6 | 4 | 16 |
    | Slots | 71 | 51 | 56 | 178 |
    | YAML lines, without the header | 98 | 86 | 86 | 270 |
    | Agent wall clock for the first draft, from reading source to writing | 29 s | 21 s | 36 s | 86 s |

    The wall clock is agent time, excluding study of the contract. It does not
    predict human time. The sample's projects have few of the forms that the scope
    gained from review: generic implementations, constructors, accessor types,
    `underlying`, implementation bindings and `auto-traits`. It measures the common forms, and it
    has no C#, Go or Dart member.

    Difficulty: most members need one read of one declaration. The difficult
    forms, each with its rule in this design:

    - A Python name defined twice, and `@overload` by context.
    - The TypeScript `/*elided*/ any` in an emit, and member order in a type
      literal.
    - The same Rust path through `core` and `std`.
    - A Rust qualified associated type, `<A as B>::Assoc`.
    - `MixedItem`, whose emitted type is about 10 lines.

    Errors:

    - 1 fact of 88 was wrong: a `where` clause missed `Debug`, because the first
      read stopped at the first line of the clause. Rereading the source found it.
    - 1 notation defect: `{id}` collided with TypeScript type literals. The
      reference check found it, and the delimiter became `@{id}`.
    - A reference check over a whole callable sees references in its body, so
      `model:signature-references` checks in both directions only inside
      parameters.

    Independent checks of the sample:

    | Check | Result |
    | --- | --- |
    | `inspect.signature`, Python | 21 of 21 compared records agree. |
    | rustdoc JSON, Rust | 18 of 22 compared records agree. The other 4 are the check script's own limits (`Self`, an associated type name) and rustdoc reporting no implicit discriminant. |
    | `tsc --declaration`, TypeScript inferred | 4 of 4 hand derivations agree, apart from the sort order of literal members. |
    | Reference facts, Rust and TypeScript | 29 of 29 and 26 of 26 records with ids in the answer key agree. This compares target ids only. |

    The checks cover named fields only:

    | Slot field | Checked by |
    | --- | --- |
    | Python parameter names, annotations, defaults, returns | `check_python_sample.py` |
    | Rust parameter names and types other than `self`, returns, field types, constant values, alias types, `non_exhaustive` | `check_rust_sample.py` |
    | TypeScript inferred returns | comparison by eye with `tsc --declaration` |
    | Target ids in type text, Rust and TypeScript | `check_sample_references.py` |
    | Rust `self-ref` and `provided`, Python parameter kinds and accessors, TypeScript declared types | No script. Read against source. |

    Effect on the 84 answer keys:

    - Size: about 3 lines per member. Rust pilot: 276 callables, fields, constants, aliases and variants, about
      830 lines on 8337, 10 percent. TypeScript pilot: 91 members, about 270
      lines on 10398, 3 percent. Python `diagnostics-toolkit`: 165 members, about
      500 lines.
    - `bases`, `impl`, `underlying` and `auto-traits` add lines the sample does not
      measure. `auto-traits` adds one to six lines per Rust type, and its authoring cost
      is reading each type's fields transitively.
    - Corpus: a rough estimate is 13,500 member declarations (Python 3,335 by syntax
      tree; Rust 1,846, C# 3,205, Dart 1,943, TypeScript 2,393 and Go 761 by pattern).
      It is not a bound. The Rust pattern gives 299 on the pilot against 276 in its
      key, and the patterns both overcount (TypeScript and Python declarations
      outside package entries) and miss forms (Rust trait methods and variants,
      TypeScript class and interface members). At 3 lines each that is about 40,000
      lines. If the pilots are typical, the keys total about 940,000 lines, so the
      growth is near 4 percent, with the same uncertainty.
    - Review: of the 178 slots, 47 are names, which `model:signature-parameters`
      recomputes; 103 are declared types and 4 are inferred types; 24 are modes,
      modifiers, defaults and values. `profile:signature-compiler` is designed to check
      the last three groups. The table above states what has been run.
    - Reference toolchain coverage: rustdoc JSON finds 259 of the 276 Rust pilot
      members by site.

    The main cost is not writing facts:

    - six canonicalizers, each with a tokenizer and sort rules;
    - the validation and audit checks;
    - profile text and schema for six languages;
    - another review of the three pilots.
  considered-trade-offs: |
    - **Signature facts on members, not on all entities.** Facts on every entity
      would state more of the source and add lines without a consumer. A consumer
      of a distribution depends on members.
    - **One slot as the unit, not one signature.** A whole-signature unit fails on
      one wrong parameter. Slots report what an indexer does and does not know.
    - **Consumer-path identity in `compare`, not canonical ids.** Canonical ids
      report a move behind a re-export as a change.
    - **No expansion of aliases.** Expansion removes two false changes, and it
      makes each signature large, depends on a type checker for each language, and
      does not terminate for a recursive type. An alias has its own fact, so a
      change to its target is reported once, at the alias.
    - **`present` for a non-literal Python default.** Comparing expression text
      brings back the problems of source text. The missed change is stated above.
    - **The author writes declared slots, not a compiler draft.** A draft from the
      compiler is cheaper, and reviewing a draft tends to accept it, which leaves an
      error shared with a compiler-backed indexer invisible. Writing and checking
      separately shows disagreements. Reproducing `tsc` inference by reasoning adds
      cost and no independence, so that one case is compiler-supplied.
    - **Macro matchers out of profile.** A `macro_rules!` matcher is a grammar, not
      a type, and membership states the macro.
