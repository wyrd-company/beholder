$schema: https://refinery.systems/ontology/technical-design
relationships:
  references:
    - semantic-oracle-model
    - semantic-oracle-profile-csharp
    - semantic-oracle-profile-dart
    - semantic-oracle-profile-go
    - semantic-oracle-profile-python
    - semantic-oracle-profile-rust
    - semantic-oracle-profile-typescript
objective: >-
  Give Beholder an independently authored, language-neutral statement of what
  each fixture project's source means, so that any indexer, including
  Beholder's own, is measured for accuracy and completeness against explicit
  expectations by fact kind, context and API boundary, through adapters,
  without index output becoming the truth it is measured against.
background:
  current-design: |
    Beholder measures its heuristic resolver against an external resolved
    index. `docs/resolver-accuracy.md` and the `beholder-oracle` crate project
    a SCIP index onto Beholder symbols and report precision and recall over
    directed symbol pairs. In that comparison the SCIP index is the reference
    side.

    The per-language fixture corpus holds 84 projects: C# 14, Dart 12, Go 8,
    Python 14, Rust 17 and TypeScript 19. Each project is valid source with
    its own build configuration and declared build contexts. The corpus lives
    on `incubator/per-language-fixtures`.

    Compiler-backed graph research on `spike/compiler-native-semantic-providers`
    records evidence states (`resolved`, `ambiguous`, `external`, `unknown`),
    document dispositions and build capsules for provider output. That
    research describes what providers emit; it is evidence about indexers,
    not a contract for expected semantics.
  problems:
    - A reference index makes the measured tool's peer the authority. Its omissions and errors become expected truth, and categories it cannot express are invisible.
    - Pair-level precision and recall hide which fact kinds, contexts and API boundaries fail.
    - The corpus has no machine-readable statement of expected entities, references, visibility or public API; its coverage maps point at source but do not state meaning.
    - Identical text compiled into several units, at several module paths, or under several contexts has several meanings, and no current artifact records them separately.
    - Visibility as declared differs from what a consumer can reach, and public API differs from both; no artifact separates the three.
design-challenges:
  independence: >-
    Expected facts come from source, build configuration, language
    specifications and reference compilers. Nothing an evaluated indexer
    produces can enter a dataset, including as a starting point that authors
    correct.
  one-model-six-languages: >-
    One vocabulary has to carry Rust crates and modules, C# assemblies and
    merged namespaces, Go packages and build constraints, Python's dynamic
    import system and stubs, TypeScript's per-file modules and conditional
    package exports, and Dart libraries, parts and configurable imports,
    without flattening a language rule into a misleading common fact.
  identity-without-indexer-symbols: >-
    Entities need identity that an adapter can match from any index format,
    that survives a file compiled twice, and that does not borrow SCIP symbol
    strings or Beholder ids.
  context-dependence: >-
    A token can denote different targets, a file can belong to different
    units, and an entity can exist or not, depending on configured build
    parameters. Expectations and observations have to be compared within the
    right context.
  visibility-layers: >-
    Declared visibility, effective access at a boundary, and public API
    membership have to be separate facts that are each checkable and
    consistent with each other.
  falsifiable-accounting: >-
    Evaluation has to distinguish missing, unexpected, wrong target, wrong
    role and wrong value, keep unsupported and out-of-profile observations
    out of error counts, and never collapse categories into one score.
  bounded-exhaustiveness: >-
    Every dataset is complete for its required categories across a whole
    project and every context. The categories have to be large enough to
    evaluate real indexers and bounded enough that 84 datasets can be
    authored and independently reviewed.
proposed-design:
  high-level-overview: |
    The semantic oracle has four artifact layers and three processing
    components.

    ```text
    semantic-oracle-model ──────────── common vocabulary, identity, locators,
          │                            contexts, visibility, dispositions,
          │                            required categories, evaluation
          ▼
    semantic-oracle-profile-<lang> ─── language mapping, contexts, paths,
          │                            visibility rules, public API rule,
          │                            extensions, authoring obligation
          ▼
    dataset JSON Schema ────────────── structural encoding of model + profile
          │
          ▼
    <project>/semantic-oracle.yml ──── one dataset per fixture project
          │
          │   validator and auditor: schema, ids, digests, locators,
          │   consistency, profile audit
          ▼
    evaluator ◄── observations ◄── adapter (SCIP, Beholder, other) ◄── index
          │
          ▼
    report: categories by project, context, fact kind, role,
            disposition, origin, basis, API boundary
    ```

    A dataset states, for one project: every document with a disposition;
    every context the project declares; units and distributions; every
    in-profile entity with definition sites, declared visibility and
    effective visibility at the `unit`, `project` and `external` boundaries;
    every in-profile reference site with its target, role, enclosing entity
    and disposition; inheritance, implementation, override, alias and export
    relations; and public API membership with consumer paths. Every fact is
    qualified by the contexts in which it holds.

    An adapter turns an index into observations keyed by site, unit key and
    canonical path, and declares its capabilities. The evaluator matches
    observations to facts within one context and assigns each fact and
    observation exactly one category. Reports keep categories separate and
    give micro counts and per-project macro values without a combined score.
  artifact-ownership: |
    Each rule has one owner:

    | Rule | Owner |
    | --- | --- |
    | Common terms, fact kinds, roles, dispositions, identity, locators, contexts, visibility semantics, required categories, evaluation categories and matching | `semantic-oracle-model` |
    | How one language maps onto the model, its contexts, paths, unit keys, visibility and public API rules, equivalence and alternate-span rules, extensions and authoring obligation | `semantic-oracle-profile-<language>` |
    | Field encoding, enumerations and structural constraints of datasets | the dataset JSON Schema, which implements the model and profiles and adds no meaning |
    | Expected facts for one project | that project's `semantic-oracle.yml` |
    | Construction, responsibilities, trade-offs and walkthroughs | this design |

    A profile narrows the model and adds namespaced extensions; it never
    redefines a common rule. A correction to a common rule is a model change
    that every profile then applies. The dataset schema is checked against
    the specifications; a schema that disagrees with them is a schema defect.
    This design restates no normative rule; where it describes a rule, the
    specification text governs.

    Each language corpus authors datasets against its profile and audits
    them. A correction that authoring reveals is made in the model or profile
    that owns the rule, and every affected dataset follows it; no dataset
    carries a local variant of a rule.
  dataset-construction: |
    A dataset is one YAML file, `semantic-oracle.yml`, at the project root.
    Authors build it from:

    - project source and tracked generated files;
    - project build declarations: manifests, project files, configuration
      files and the `build` and `test` task commands;
    - the language specification and the reference compiler and build tool,
      including probes the author compiles outside the project tree.

    Authoring tooling captures locators from source text and computes
    digests, so authors state meaning and the tool states coordinates. The
    tool never proposes facts from an indexer.

    Datasets are exhaustive for the model's required categories. The
    out-of-profile set holds body-local declarations and references to
    parameters, documentation comments, implicit references, macro definition
    bodies, inferred types, dispatch and flow. That boundary keeps every
    remaining fact checkable from source by a reviewer, and it covers what
    code-graph consumers depend on: declarations, cross-entity references,
    type relations, visibility and public surface.
  identity-and-locators: |
    An entity's identity is its unit, canonical path and kind within a
    context. Definition sites anchor it to source. The unit key is
    profile-defined so that it separates units an index would otherwise
    merge: a C# assembly name with its version and project file, a Rust package and target, a
    Python module name with its unit kind, a Go import path with its test
    variant.

    Locators use one coordinate system: lines split on LF, CR LF and CR;
    columns count Unicode scalar values from 1; end is exclusive; the exact
    text is stored. Every index encoding converts into it using the document
    bytes, so UTF-8, UTF-16 and UTF-32 indexes compare equally. The stored
    text and the document digest together make a stale or shifted locator a
    validation failure instead of a silent mismatch.

    Value sites cover denotation by value: module specifier strings, import
    path strings, configurable URIs and dynamic import arguments. Profiles
    name each value-site form so that adapters and authors agree on the span.
  contexts-and-units: |
    A context is one configured build the project declares, written as a
    complete assignment of profile parameters and tied to the declaring
    command. Facts list their contexts; omission means every context in which
    the unit is built. An index is bound to exactly one context for
    evaluation, which turns "this index was produced for Windows" or "this
    index used the CommonJS resolution mode" into an explicit input instead
    of an implicit mismatch.

    Units are stable across contexts. A context selects which documents a
    unit compiles and which options apply. This keeps one fact per meaning:
    an entity present in four of six contexts is one record with four
    contexts, and a token whose target differs by context is one reference
    per target.
  visibility-and-public-api: |
    Three facts stay separate:

    - declared visibility is what the source states or defaults to;
    - effective visibility is which code at the `unit`, `project` and
      `external` boundaries can access the entity, with `all`, `none`,
      `scoped` and `subtypes`;
    - public API membership is the set of consumer paths by which an external
      consumer of a distribution names the entity.

    Their disagreement is the information. A Rust `pub` item in a private
    module is declared public, reachable only through a re-export, and a
    public API member under the re-export path alone. A Dart public
    declaration under `lib/src` is externally accessible and not a public API
    member. A TypeScript export from a module that the package's `exports`
    map blocks is accessible inside the project and absent from the public
    API. Python enforces no access control; its public API follows the typing
    specification's library interface rules.

    Validators recompute public API membership from exports, containment,
    effective visibility and the profile rule, so the three facts cannot
    drift apart within a dataset.
  dispositions: |
    Every reference has one disposition. `resolved` and `external` cover
    statically bound languages almost completely. `candidates` records a
    run-time choice from a finite source-determined set, such as a Python
    `try`/`except ImportError` fallback. `nonexistent` records a lookup the
    language proves empty and the program handles. `indeterminate` records a
    target that depends on input outside source and contexts.

    Context differences are never dispositions. They are context-qualified
    facts, so an indexer that resolves the right target for the wrong
    configuration is reported as a context mismatch rather than as
    ambiguity.
  evaluation-pipeline: |
    The evaluator is format-neutral. It consumes observations: document,
    definition, reference, relation, visibility, public API and extension
    forms, each keyed by site, unit key and path or by external key. Each
    adapter declares the forms, fact kinds, roles, boundaries and extensions
    it produces. Facts outside an adapter's capabilities are `unsupported`,
    not `missing`.

    The SCIP adapter maps documents, definition and reference occurrences,
    symbol relationships and the index's position encoding into observations.
    It derives unit keys and canonical paths from SCIP symbol packages and
    descriptors through each profile's path grammar, and declares visibility
    and public API forms unsupported unless an index carries them. Beholder's
    own adapter maps `edges.jsonl` and symbol output the same way. Neither
    adapter's output can change a dataset.

    Facts are compared as atomic units: one definition site, one
    reference, one relation, one boundary value, one public API path. Each
    unit and each observation pairs at most once, first exactly, then by a
    form-specific pairing key when exactly one candidate remains, so that an
    observation with the wrong base type is one `wrong-target` rather than a
    `missing` and an `unexpected`, while a guess among several candidates is
    not credited to any of them.

    Matching runs inside one context: document digests first, so stale
    documents are reported and excluded; then definitions by unit key, path
    and site, with conflated entities reported when an index collapses
    several entities onto one site; then references by site, then target,
    role and enclosing entity; then relations, visibility, public API and
    extensions by key. Profile equivalence rules accept named alternative
    targets and are counted as `equivalent`, so a C# index that targets an
    override instead of the original virtual declaration is accepted and
    visible.
  validation-and-audit: |
    The validator and auditor check, deterministically and with
    machine-readable output: schema and version; id uniqueness and reference
    resolution; complete document inventory with digests and canonical paths;
    locator validity; fact contexts against unit and document membership;
    disposition members; public API consistency; and the profile audit that
    every required category is present for every indexed document and
    context. Each check names the rule it enforces in the model or profile.
  cross-language-walkthrough: |
    The examples below use fixture projects on `incubator/per-language-fixtures`
    at commit `ba01bbfcb3e3f919a72039722f6ec6465b882b0c`. Sites are exact; each
    claim is checkable against that source and the named build declarations.

    ### Rust: one file, four entities

    `modules-visibility-and-resolution` mounts `src/shared_source.rs` at
    `shared_first` and `shared_second` with `#[path]` in `src/lib.rs`, includes
    it textually inside `shared_via_include` with `include!` at lines 66–68,
    and the binary `mvr-bin` mounts it again as `bin_shared`. The struct name site is
    `src/shared_source.rs` 4:12–4:24, `SharedMarker`.

    The dataset has one document with members in the `lib` and `bin` units
    and four entities that share that site:

    | Entity path | Unit key |
    | --- | --- |
    | `modules_visibility_and_resolution::shared_first::SharedMarker` | package `modules-visibility-and-resolution` 0.1.0, `lib`, platform `target` |
    | `modules_visibility_and_resolution::shared_second::SharedMarker` | same `lib` unit |
    | `modules_visibility_and_resolution::shared_via_include::SharedMarker` | same `lib` unit |
    | `mvr_bin::bin_shared::SharedMarker` | same package, `bin` `mvr-bin`, platform `target` |

    An index that emits one definition at 4:12 without distinct paths is one
    `wrong-target (conflated)` observation and four `missing` definition
    units.

    ### Rust: context-selected module

    `src/lib.rs` declares `cfg_selected` twice, from `cfg_selected_a.rs` under
    `cfg(fixture_use_a)` and from `cfg_selected_b.rs` otherwise. The project's
    `build` task runs `cargo build --offline --workspace` and
    `RUSTFLAGS="--cfg fixture_use_a" cargo build --offline`, which define two
    of its contexts. The call at `src/lib.rs` 127:19–127:34, `cfg_selected_fn`, has
    two references: to the function defined at `src/cfg_selected_b.rs` 3:8 in
    the default context, and to the one at `src/cfg_selected_a.rs` 3:8 in the
    `fixture_use_a` context. `src/cfg_selected_a.rs` is a member of the `lib`
    unit only in the second context.

    ### C#: one consumer file, two assemblies of one name

    `assemblies-and-references` links `src/Versioned.Consumer.Shared/SharedConsumer.cs`
    into `Versioned.Consumer.V1` and `Versioned.Consumer.V2` through `Compile`
    items with `Link`. `Versioned.Api.V1` and `Versioned.Api.V2` both produce
    assembly `Versioned.Api`, versions 1.0.0.0 and 2.0.0.0. The read at
    `SharedConsumer.cs` 15:29–15:40, `ApiConstant`, has two references in
    one context, one for each enclosing `ConsumeConstants` method in the two
    consumer units: one to `Acme.Versioned.ApiConstants.ApiConstant` in unit key
    (`Versioned.Api`, 1.0.0.0, `src/Versioned.Api.V1/Versioned.Api.V1.csproj`),
    defined at `src/Versioned.Api.V1/Constants.cs` 5:25, and one to the same
    path in (`Versioned.Api`, 2.0.0.0,
    `src/Versioned.Api.V2/Versioned.Api.V2.csproj`). The unit key carries the
    project file because assembly identity alone does not name the producing
    project: `Forwarding.Facade` and `Forwarding.Facade.PreMove` in the same
    solution both produce assembly `Forwarding.Facade` with one version.

    ### C#: extern alias and the global alias

    `Alias.Consumer.csproj` references `Alias.LibraryA` with
    `Aliases="LibraryA"` and `Alias.LibraryB` without aliases. In
    `AliasedConsumer.cs` line 11, `new LibraryA::Acme.Aliased.DuplicateType()`
    targets the `DuplicateType` constructor of `Alias.LibraryA`; `LibraryA` at
    11:21 is a `csharp:extern-alias` fact. At 16:21, `new DuplicateType()`
    targets the constructor of `Alias.LibraryB`, because a custom-only alias
    removes `Alias.LibraryA` from the global alias. Two
    `csharp:reference-alias` facts record `[LibraryA]` and `[global]`. An
    index that targets `Alias.LibraryA` at 16:21 is `wrong-target`.

    ### TypeScript: versioned types condition and resolution mode

    `package-publishing-ecosystem/packages/exports-map/package.json` maps
    `.` with `types@>=5.0` before `types`. Every context of the project uses
    `moduleResolution` `nodenext` or `bundler`, so `exports` applies. With
    compiler 5.9.3,
    `src/package-exports/import-consumer.ts` 8:10–8:18, `readMain`, targets
    `"packages/exports-map/dist-types/index.v5.d.ts"#readMain`, not the
    declaration in `index.d.ts`. The subpath `./bundle` selects
    `dist-types/bundle.d.mts` for `import` and `dist-cjs/bundle.d.cts` for
    `require`; the public API of `@fixtures/exports-map` has
    `import:@fixtures/exports-map/bundle#bundleFeature` and
    `require:@fixtures/exports-map/bundle#bundleFeature`, each naming the
    entity of its own declaration file. `./internal` maps to `null`, so no
    consumer path begins with `@fixtures/exports-map/internal`.

    ### Python: attribute before submodule, stub before runtime

    `plugin-content-library/content_library/ambiguous_demo.py` 5:43–5:50,
    `handler` in `from content_library.ambiguous_pkg import handler as
    attr_handler`, targets the variable `content_library.ambiguous_pkg.handler`
    bound at `content_library/ambiguous_pkg/__init__.py` 12:1, not the
    submodule `content_library/ambiguous_pkg/handler.py`, because the import
    system reads the package attribute before it imports a submodule. An
    index that targets the submodule is `wrong-target`.

    `content_library/facade.pyi` declares `Widget.extra_stub_only` at 12:9;
    the runtime module `content_library/facade.py` does not. The method
    exists in the `typing` context's stub unit and in no `runtime` context;
    `python:stub-of` relates the stub `Widget` to the runtime `Widget`.

    ### Go: test variant unit and context-selected files

    In `package-structure`, `external_test.go` declares `package pantry_test`.
    It is a member of the `external-test` unit only in the context defined by
    `go test ./...`; its reference at 11:16–11:27, `PublicValue`, targets
    `example.com/fixture/package-structure.PublicValue` defined at
    `exported.go` 28:5.

    In `platform-bridge`, the `build` task varies `GOOS`, `GOARCH`,
    `CGO_ENABLED`, `GOAMD64`, `-tags` and `-race`; its `-cover`, `-pgo`,
    `-trimpath`, `-buildmode` and `-ldflags` variants define no further
    context. `example.com/portablebridge.PlatformSurface` has one record per
    site set: `api_linux.go` 11:6 in the Linux contexts, `api_darwin.go` 11:6
    in the Darwin context, `api_windows.go` 11:6 in the Windows context, and
    `api_other.go` 10:6 in the `wasip1` and `js` contexts. Each file is a
    member of the package unit only in its contexts.

    ### Dart: configurable import

    `libraries-and-visibility/lib/conditional/platform_selector.dart` imports
    `platform_default.dart`, `platform_native.dart` if `dart.library.io` and
    `platform_web.dart` if `dart.library.js_interop`, `as impl`. The `build`
    task runs `dart run bin/vm_main.dart` and `dart compile js`. In the `vm`
    context the URI site at 6:27–6:47 targets
    `package:libraries_and_visibility/conditional/platform_native.dart`, and
    `impl` at 10:30 targets that library; in the `js` context the URI at
    7:35–7:52 and `impl` target `platform_web.dart`. `platformLabel` at 10:35
    targets the function declared at line 5 of the selected library.

    ### What the walkthrough shows

    The same common facts, context-qualified references, unit keys, value
    sites and public API paths, express a Rust cfg choice, a Go build
    constraint, a TypeScript resolution mode and a Dart configurable import.
    Language-only meaning, a C# extern alias or a Python stub relation,
    lives in a namespaced extension rather than in a common fact.
  considered-trade-offs: |
    - **Authored expectations over a reference index.** A reference index is
      cheaper to produce but makes a peer tool the authority. Authored
      datasets cost review time per project and make every error class
      visible, including errors a reference index shares.
    - **Common kinds plus `language-kind` over per-language vocabularies.**
      A per-language vocabulary preserves nuance but prevents cross-language
      reports. The common kind enables comparison; `language-kind` and
      extensions preserve the nuance.
    - **Identity by unit key, path and kind over a dataset-wide symbol
      grammar.** A global symbol grammar would resemble SCIP symbols and
      couple the oracle to one format. Unit keys and profile path grammars are
      per-language and adapter-derivable.
    - **Context lists on facts over one dataset per context.** Per-context
      datasets duplicate most facts and drift. Context lists keep one record
      per meaning and make context-specific facts explicit.
    - **Exact site matching with named alternate spans over overlap
      matching.** Overlap matching tolerates more index variation but accepts
      wrong tokens. Exact spans with profile-named alternates keep matches
      falsifiable.
    - **Bounded v1 categories over full semantic coverage.** Including
      body-local references, inferred types and dispatch would multiply
      authoring and review effort per project and depend on analyses that
      reviewers cannot check from source. The v1 set covers declarations,
      cross-entity references, type relations, visibility and public API.
    - **Equivalence rules over looser matching.** Where languages admit two
      representations of one reference, a named rule accepts the alternative
      and counts it separately, so tolerance is explicit per profile.
    - **Separate `wrong-source` and `wrong-value` categories.** The required
      category list names wrong target and wrong role. Enclosing-entity and
      visibility errors are distinct failure modes; reporting them as their
      own categories keeps every category meaningful, and `incorrect` is
      their union.
  terminology: |
    In this design and its specifications, "oracle" means the semantic
    oracle: authored expectations. `docs/resolver-accuracy.md` and the
    `beholder-oracle` crate use "oracle" for the external reference index
    they compare against; in semantic-oracle terms that index is an indexer
    output evaluated through an adapter.
  downstream-work: |
    - The dataset schema encodes the model and profile record structures,
      enumerations and id references, with valid and invalid examples for
      every construct.
    - Authoring and validation tooling captures locators and digests and runs
      the validator and profile audit with deterministic, machine-readable
      output and Taskfile commands.
    - Calibration applies pilot findings to the model, profiles and schema as
      one contract.
    - The evaluator and SCIP adapter implement observations, matching,
      categories and reports.
    - Each language corpus authors and audits its datasets against its
      profile.
