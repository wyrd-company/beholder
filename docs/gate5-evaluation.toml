# Gate 5 — report usefulness. Machine-readable evaluation record.
#
# Regenerate any row with:
#   beholder report <revision>~1 <revision> --root <repository> --basis <basis> --json
#
# [corpus] states how these changes were chosen and where the selection falls
# short of the Definition of Done. Each [[change]] records what the ranking put
# first under each basis, so the summary claims are auditable rather than
# asserted.

[corpus]
selection = """
The Definition of Done asks for ten already-merged pull requests. Wyrd
repositories squash-merge, so a merged pull request is one commit on the default
branch carrying GitHub's (#N) suffix.

Across every Rust repository in this workspace there are fourteen such commits
and only TWO of them touch a .rs file; the rest are CI, release plumbing and
documentation. Both qualifying pull requests are included. The remaining twelve
entries are pull-request-shaped commits from the default branches of the three
Rust repositories, selected by highest count of scored symbol changes so the
reports have enough content to judge.

This does not literally satisfy the Definition of Done. Only two merged Rust
pull requests exist to evaluate; the other twelve are commits that were never
confirmed to have been reviewed as a unit. That is an environmental shortfall,
not a reinterpretation of the requirement, and it is recorded here as a fact.
"""
merged_pull_requests_available = 2
merged_pull_requests_used = 2
pull_request_shaped_commits_used = 12
repositories = ["wyrd-company/intentional", "wyrd-company/tagver", "wyrd-company/agent-svgtools"]

[summary]
# Counted over the top five surfaced entries of all fourteen reports.
reports = 14
verdict = "useful; damped basis recommended"
on_subject = 12
thin = 2
trivial_symbols_promoted_by_unstated_fan_in_raw = 3
trivial_symbols_promoted_by_unstated_fan_in_damped = 1
test_file_entries_in_top_five = 7
trait_method_entries_in_top_five = 2
notes = """
Twelve of fourteen put a substantial piece of the change's subject first. The
two thin reports are changes that moved almost no complexity, and the ranking
said so rather than inventing something.

Two limitations. A change that hardens behaviour without adding branches is
invisible, because the complexity delta is the multiplicand. And fan-in in this
corpus is small, mostly 0 to 8, so complexity delta dominates the ordering and
the weighting only earns its keep in the tail — which is precisely where the
resolver's collisions land, and why the basis still matters.
"""

