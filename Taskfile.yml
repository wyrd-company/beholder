version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the workspace
    cmds:
      - cargo build --workspace --all-targets --locked

  test:
    desc: Run every test
    cmds:
      - cargo test --workspace --locked

  test:oracle-schema:
    desc: Check the semantic-oracle schemas, validator and authoring commands
    summary: |
      Validates every valid example dataset in docs/specifications with a
      Draft 2020-12 validator, confirms that every invalid example fails with
      exactly the errors it names, and runs the validator, audit, locator and
      CLI tests against a small fixture project. `test` runs the same checks
      as part of the workspace.
    cmds:
      - cargo test -p beholder-semantic-oracle -p beholder-semantic-oracle-cli --locked

  fixtures:init:
    desc: Check out the fixture corpus submodule at fixtures/
    summary: |
      The fixture projects and their semantic-oracle datasets live in the
      repository wyrd-company/beholder-fixtures. A normal clone does
      not check it out (`update = none` in .gitmodules); this task does, at
      the commit this repository pins.
    cmds:
      - git submodule sync -- fixtures
      - git -c submodule.fixtures.update=checkout submodule update --init --depth 1 -- fixtures

  semantic-oracle:locate:
    desc: Print the locator of a span of source text in a semantic-oracle project
    summary: |
      FILE is the document's canonical path under PROJECT, TEXT the exact
      span text. LINE and COLUMN narrow the search when TEXT occurs more than
      once; the command lists the positions when it is not unique.

        task semantic-oracle:locate PROJECT=path/to/project FILE=src/lib.rs TEXT=Counter LINE=3
    dir: '{{.USER_WORKING_DIR}}'
    requires:
      vars: [FILE, TEXT]
    vars:
      PROJECT: '{{.PROJECT | default "."}}'
    cmds:
      - >-
        cargo run -q --locked --manifest-path {{shellQuote (joinPath .ROOT_DIR "Cargo.toml")}}
        -p beholder-semantic-oracle-cli --
        locate --project {{shellQuote .PROJECT}}
        {{if .LINE}}--line {{shellQuote .LINE}}{{end}} {{if .COLUMN}}--column {{shellQuote .COLUMN}}{{end}}
        -- {{shellQuote .FILE}} {{shellQuote .TEXT}}

  semantic-oracle:inventory:
    desc: Print the documents block of a semantic-oracle project with current digests
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "."}}'
    cmds:
      - >-
        cargo run -q --locked --manifest-path {{shellQuote (joinPath .ROOT_DIR "Cargo.toml")}}
        -p beholder-semantic-oracle-cli -- inventory {{shellQuote .PROJECT}}

  semantic-oracle:validate:
    desc: Validate a semantic-oracle dataset against the model, its profile and its project
    summary: |
      Writes one JSON line per finding and a summary line, and exits nonzero
      on any error. PROJECT is the project root or its semantic-oracle.yml.
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "."}}'
    cmds:
      - >-
        cargo run -q --locked --manifest-path {{shellQuote (joinPath .ROOT_DIR "Cargo.toml")}}
        -p beholder-semantic-oracle-cli -- validate {{shellQuote .PROJECT}}

  semantic-oracle:audit:
    desc: Validate a semantic-oracle dataset and audit it against its language profile
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "."}}'
    cmds:
      - >-
        cargo run -q --locked --manifest-path {{shellQuote (joinPath .ROOT_DIR "Cargo.toml")}}
        -p beholder-semantic-oracle-cli -- audit {{shellQuote .PROJECT}}

  test:action:
    desc: Exercise the shell the GitHub Action runs
    summary: |
      The action is shell around the binary, and the two things it must get
      right — one comment ever, and never forcing the index ref — are not
      provable from Rust.
    cmds:
      - python3 scripts/tests/index-workflow.test.py
      - for: ["sticky-comment", "publish-index"]
        cmd: bash scripts/tests/{{.ITEM}}.test.sh

  lint:
    desc: Run clippy with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  release:check:
    desc: Everything the release does that can be proved without publishing
    summary: |
      Runs the version agreement check, the crates.io and npm dry runs, and the
      launcher's own tests. Not part of ci: it needs the network, and it says
      nothing about a working tree that is not a release.

      beholder-cli cannot be dry-run until beholder exists on the index, so on a
      first release only the library is checkable here.
    cmds:
      - python3 scripts/release/verify-versions.py
      - cargo publish -p beholder --locked --dry-run
      - npm test --prefix npm
      - npm pack ./npm --dry-run --ignore-scripts --userconfig=/dev/null

  test:release:
    desc: Exercise release event guards and workflow publication boundaries
    cmds:
      - python3 scripts/tests/release-workflow.test.py

  lint:action:
    desc: Lint the action definition and the shell it runs
    cmds:
      - actionlint
      - shellcheck scripts/*.sh scripts/tests/*.sh scripts/release/*.sh

  brand:
    desc: Regenerate the logo, favicon and social preview in docs/user/assets/brand
    summary: |
      scripts/brand.py is the single source of the mark geometry. The PNG and
      ICO files are rasterized from its SVG output with headless Chromium.
    cmds:
      - python3 scripts/brand.py
      - bash scripts/brand-png.sh

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting without changing anything
    cmds:
      - cargo fmt --all -- --check

  ci:
    desc: Everything that must pass before review
    cmds:
      - task: fmt:check
      - task: build
      - task: test
      - task: test:action
      - task: test:release
      - task: lint
      - task: lint:action

  audit:identity:
    desc: Run the symbol identity gate against a repository
    summary: |
      Counts phantom changes: symbol changes reported in files that did not
      change. Pass REPO to point at another checkout.
    vars:
      REPO: '{{.REPO | default "."}}'
      DEPTH: '{{.DEPTH | default "50"}}'
    cmds:
      - cargo run --release -q -p beholder-cli -- audit-identity --root {{.REPO}} --depth {{.DEPTH}}
