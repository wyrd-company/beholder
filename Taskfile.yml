version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the workspace
    cmds:
      - cargo build --workspace --all-targets --locked

  test:
    desc: Run every test
    cmds:
      - cargo test --workspace --locked

  test:oracle-schema:
    desc: Check the semantic-oracle schemas, validator and authoring commands
    summary: |
      Validates every valid example dataset in docs/specifications with a
      Draft 2020-12 validator, confirms that every invalid example fails with
      exactly the errors it names, and runs the validator, audit, locator and
      CLI tests against a small fixture project. `test` runs the same checks
      as part of the workspace.
    cmds:
      - cargo test -p beholder-semantic-oracle -p beholder-semantic-oracle-cli --locked

  fixtures:init:
    desc: Check out the fixture corpus submodule at fixtures/
    summary: |
      The fixture projects and their semantic-oracle datasets live in the
      repository wyrd-company/beholder-fixtures. A normal clone does
      not check it out (`update = none` in .gitmodules); this task does, at
      the commit this repository pins.
    cmds:
      - git submodule sync -- fixtures
      - git -c submodule.fixtures.update=checkout submodule update --init --depth 1 -- fixtures

  semantic-oracle:locate:
    desc: Print the locator of a span of source text in a semantic-oracle project
    summary: |
      FILE is the document's canonical path under PROJECT, TEXT the exact
      span text. LINE and COLUMN narrow the search when TEXT occurs more than
      once; the command lists the positions when it is not unique.

        task semantic-oracle:locate PROJECT=path/to/project FILE=src/lib.rs TEXT=Counter LINE=3
    dir: '{{.USER_WORKING_DIR}}'
    requires:
      vars: [FILE, TEXT]
    vars:
      PROJECT: '{{.PROJECT | default "."}}'
    cmds:
      - >-
        cargo run -q --locked --manifest-path {{shellQuote (joinPath .ROOT_DIR "Cargo.toml")}}
        -p beholder-semantic-oracle-cli --
        locate --project {{shellQuote .PROJECT}}
        {{if .LINE}}--line {{shellQuote .LINE}}{{end}} {{if .COLUMN}}--column {{shellQuote .COLUMN}}{{end}}
        -- {{shellQuote .FILE}} {{shellQuote .TEXT}}

  semantic-oracle:inventory:
    desc: Print the documents block of a semantic-oracle project with current digests
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "."}}'
    cmds:
      - >-
        cargo run -q --locked --manifest-path {{shellQuote (joinPath .ROOT_DIR "Cargo.toml")}}
        -p beholder-semantic-oracle-cli -- inventory {{shellQuote .PROJECT}}

  semantic-oracle:validate:
    desc: Validate a semantic-oracle dataset against the model, its profile and its project
    summary: |
      Writes one JSON line per finding and a summary line, and exits nonzero
      on any error. PROJECT is the project root or its semantic-oracle.yml.
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "."}}'
    cmds:
      - >-
        cargo run -q --locked --manifest-path {{shellQuote (joinPath .ROOT_DIR "Cargo.toml")}}
        -p beholder-semantic-oracle-cli -- validate {{shellQuote .PROJECT}}

  semantic-oracle:audit:
    desc: Validate a semantic-oracle dataset, audit it, and compare signatures with compiler reports
    summary: |
      REPORTS is a space-separated list of report files, one per context. A slot
      no report states is listed as unchecked, and has not passed.
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      PROJECT: '{{.PROJECT | default "."}}'
    cmds:
      - >-
        cargo run -q --locked --manifest-path {{shellQuote (joinPath .ROOT_DIR "Cargo.toml")}}
        -p beholder-semantic-oracle-cli -- audit {{shellQuote .PROJECT}}
        {{range $report := splitList " " (.REPORTS | default "")}}{{if $report}}--report {{shellQuote $report}} {{end}}{{end}}

  semantic-oracle:report:rust:
    desc: Write a Rust compiler report from rustdoc JSON and a generated auto-trait probe
    summary: |
      Needs a Rust toolchain. PROJECT, CONTEXT and OUT are required; OUT lies
      outside the project tree. FEATURES, NO_DEFAULT_FEATURES, ALL_FEATURES and CFG, a
      space-separated list, select the context. A build that fails exits nonzero and
      writes no report.
    dir: '{{.USER_WORKING_DIR}}'
    requires:
      vars: [PROJECT, CONTEXT, OUT]
    cmds:
      - >-
        python3 {{shellQuote (joinPath .ROOT_DIR "scripts/semantic-oracle/report-rust.py")}}
        --project {{shellQuote .PROJECT}} --context {{shellQuote .CONTEXT}} --out {{shellQuote .OUT}}
        {{if .FEATURES}}--features {{shellQuote .FEATURES}}{{end}}
        {{if .NO_DEFAULT_FEATURES}}--no-default-features{{end}}
        {{if .ALL_FEATURES}}--all-features{{end}}
        {{range $name := splitList " " (.CFG | default "")}}{{if $name}}--cfg {{shellQuote $name}} {{end}}{{end}}

  semantic-oracle:report:go:
    desc: Write a Go compiler report from go/types
    summary: |
      Needs Go. PROJECT, CONTEXT and OUT are required. OUT is an absolute path
      outside the project tree. TAGS, GOOS and GOARCH select the context.
    dir: '{{.PROJECT}}'
    requires:
      vars: [PROJECT, CONTEXT, OUT]
    cmds:
      - >-
        go run {{shellQuote (joinPath .ROOT_DIR "scripts/semantic-oracle/report-go.go")}}
        -context {{shellQuote .CONTEXT}} -out {{shellQuote .OUT}}
        {{if .TAGS}}-tags {{shellQuote .TAGS}}{{end}}

  semantic-oracle:report:python:
    desc: Write a Python compiler report from inspect.signature
    summary: |
      Imports the project's modules, which runs their module-level code. SEARCH_PATH
      lists the context's search path, CONTEXT its id, PYTHON its `python` parameter,
      and OUT lies outside the tree. It runs under that interpreter, and an absent one
      exits nonzero and writes no report.
    dir: '{{.USER_WORKING_DIR}}'
    requires:
      vars: [SEARCH_PATH, CONTEXT, OUT, PYTHON]
    cmds:
      - >-
        python3 {{shellQuote (joinPath .ROOT_DIR "scripts/semantic-oracle/report-python.py")}}
        --search-path {{shellQuote .SEARCH_PATH}} --context {{shellQuote .CONTEXT}} --out {{shellQuote .OUT}}
        --python {{shellQuote .PYTHON}}

  semantic-oracle:report:typescript:
    desc: Write a TypeScript compiler report from tsc --declaration
    summary: |
      Needs Node and the `typescript` module, from the project, from TYPESCRIPT or
      from the global npm root. PROJECT, CONTEXT and OUT are required, and TSCONFIG
      selects the context's options. OUT lies outside the project tree.
    dir: '{{.USER_WORKING_DIR}}'
    requires:
      vars: [PROJECT, CONTEXT, OUT]
    vars:
      TSCONFIG: '{{.TSCONFIG | default "tsconfig.json"}}'
    cmds:
      - >-
        node {{shellQuote (joinPath .ROOT_DIR "scripts/semantic-oracle/report-typescript.cjs")}}
        --project {{shellQuote .PROJECT}} --tsconfig {{shellQuote .TSCONFIG}}
        --context {{shellQuote .CONTEXT}} --out {{shellQuote .OUT}}

  semantic-oracle:report:dart:
    desc: Write a Dart compiler report from the analyzer's resolved element model
    summary: |
      Needs the Dart SDK; `dart pub get` fetches package:analyzer into
      scripts/semantic-oracle. PROJECT, CONTEXT, ENTRY, PLATFORM and OUT are required; ENTRY
      is the context's `entry` parameter, `analysis` or a project-relative path, and PLATFORM
      its `platform`, with no default, so that a js or wasm context is never checked as vm.
      DEFINES and LIBRARY_FLAGS, space-separated lists, are its `defines` and its complete
      `library-flags`. DATASET, by default PROJECT's semantic-oracle.yml where it exists, is
      the dataset whose context these must equal; with no dataset the report exits nonzero,
      unless STANDALONE=1 reports without that check, with a warning. OUT lies outside the
      project tree. A library with an error, or a parameter that disagrees, exits nonzero
      and writes no report. For an ENTRY other than `analysis`, PLATFORM's compiler, `dart
      compile kernel`, `js` or `wasm`, compiles it with DEFINES into a temporary directory
      first, and must accept it, as it does not honour `// ignore:` comments; every
      `dart.library.*` a directive tests must have the same value in LIBRARY_FLAGS as in
      that compiler. `analysis` runs none, as `dart analyze` honours them.
    dir: '{{.USER_WORKING_DIR}}'
    requires:
      vars: [PROJECT, CONTEXT, ENTRY, PLATFORM, OUT]
    cmds:
      - dart pub get --directory {{shellQuote (joinPath .ROOT_DIR "scripts/semantic-oracle")}} >/dev/null
      - >-
        dart run {{shellQuote (joinPath .ROOT_DIR "scripts/semantic-oracle/report-dart.dart")}}
        --project {{shellQuote .PROJECT}} --context {{shellQuote .CONTEXT}}
        --entry {{shellQuote .ENTRY}} --out {{shellQuote .OUT}}
        --platform {{shellQuote .PLATFORM}}
        {{if .DATASET}}--dataset {{shellQuote .DATASET}}{{end}}
        {{if .STANDALONE}}--standalone{{end}}
        {{range $define := splitList " " (.DEFINES | default "")}}{{if $define}}--define {{shellQuote $define}} {{end}}{{end}}
        {{range $flag := splitList " " (.LIBRARY_FLAGS | default "")}}{{if $flag}}--library-flag {{shellQuote $flag}} {{end}}{{end}}

  semantic-oracle:corpus:
    desc: Validate and audit the fixture corpus's adopted datasets
    summary: |
      Needs the fixture corpus; `task fixtures:init` checks it out. It runs no
      compiler report, so every signature slot is unchecked here.
    cmds:
      - cargo build -q --locked -p beholder-semantic-oracle-cli
      - python3 scripts/semantic-oracle/corpus.py --fixtures fixtures --binary target/debug/semantic-oracle

  test:oracle-reports:
    desc: Run each compiler report script on a small project
    summary: |
      Needs rustc and cargo, go, python3, node and the `typescript` module, and the Dart
      SDK. A missing toolchain fails this task. C# has no script until its toolchain exists.
    cmds:
      - dart pub get --directory scripts/semantic-oracle
      - python3 scripts/tests/semantic-oracle-reports.test.py

  test:action:
    desc: Exercise the shell the GitHub Action runs
    summary: |
      The action is shell around the binary, and the two things it must get
      right — one comment ever, and never forcing the index ref — are not
      provable from Rust.
    cmds:
      - python3 scripts/tests/index-workflow.test.py
      - for: ["sticky-comment", "publish-index"]
        cmd: bash scripts/tests/{{.ITEM}}.test.sh

  lint:
    desc: Run clippy with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  release:check:
    desc: Everything the release does that can be proved without publishing
    summary: |
      Runs the version agreement check, the crates.io and npm dry runs, and the
      launcher's own tests. Not part of ci: it needs the network, and it says
      nothing about a working tree that is not a release.

      beholder-cli cannot be dry-run until beholder exists on the index, so on a
      first release only the library is checkable here.
    cmds:
      - python3 scripts/release/verify-versions.py
      - cargo publish -p beholder --locked --dry-run
      - npm test --prefix npm
      - npm pack ./npm --dry-run --ignore-scripts --userconfig=/dev/null

  test:release:
    desc: Exercise release event guards and workflow publication boundaries
    cmds:
      - python3 scripts/tests/release-workflow.test.py

  lint:action:
    desc: Lint the action definition and the shell it runs
    cmds:
      - actionlint
      - shellcheck scripts/*.sh scripts/tests/*.sh scripts/release/*.sh

  brand:
    desc: Regenerate the logo, favicon and social preview in docs/user/assets/brand
    summary: |
      scripts/brand.py is the single source of the mark geometry. The PNG and
      ICO files are rasterized from its SVG output with headless Chromium.
    cmds:
      - python3 scripts/brand.py
      - bash scripts/brand-png.sh

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting without changing anything
    cmds:
      - cargo fmt --all -- --check

  ci:
    desc: Everything that must pass before review
    cmds:
      - task: fmt:check
      - task: build
      - task: test
      - task: test:action
      - task: test:release
      - task: lint
      - task: lint:action

  audit:identity:
    desc: Run the symbol identity gate against a repository
    summary: |
      Counts phantom changes: symbol changes reported in files that did not
      change. Pass REPO to point at another checkout.
    vars:
      REPO: '{{.REPO | default "."}}'
      DEPTH: '{{.DEPTH | default "50"}}'
    cmds:
      - cargo run --release -q -p beholder-cli -- audit-identity --root {{.REPO}} --depth {{.DEPTH}}
