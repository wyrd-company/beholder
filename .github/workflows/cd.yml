name: Release

# A tag is the only trigger, and the tag is the version. Nothing here decides
# what to release; it publishes what the tag already names, and refuses if the
# manifests disagree with it.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  credential-preflight:
    name: Verify publication credentials are configured
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      FORMULAE_PUBLISH_KEY: ${{ secrets.FORMULAE_PUBLISH_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Require every publication credential
        shell: bash
        run: |
          for VARIABLE in CARGO_REGISTRY_TOKEN FORMULAE_PUBLISH_KEY NPM_TOKEN; do
            if [[ -z "${!VARIABLE}" ]]; then
              echo "::error::$VARIABLE is not configured for the release workflow."
              exit 1
            fi
          done
          echo "Required release credentials are configured."

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: credential-preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: beholder-linux-x86_64
            bin_path: target/x86_64-unknown-linux-gnu/release/beholder
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: beholder-linux-arm64
            bin_path: target/aarch64-unknown-linux-gnu/release/beholder
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: beholder-macos-arm64
            bin_path: target/aarch64-apple-darwin/release/beholder
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: beholder-windows-x86_64
            bin_path: target/x86_64-pc-windows-msvc/release/beholder.exe
            archive_ext: zip
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard tag, Cargo, and npm version agreement
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Release workflow must run against a SemVer tag." >&2
            exit 1
          fi
          TAG="${GITHUB_REF##*/}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be plain Semantic Versioning." >&2
            exit 1
          fi
          python3 scripts/release/verify-versions.py --expected "$TAG"
          scripts/release/extract-release-notes.sh \
            "$TAG" CHANGELOG.md "$RUNNER_TEMP/release-notes-preflight.md"

      - name: Install cross
        if: >-
          matrix.target == 'x86_64-unknown-linux-gnu' ||
          matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo inputs and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Linux goes through cross for a glibc baseline older than the
          # runner's; everything else builds natively.
          if [[ "$TARGET" == *-unknown-linux-gnu ]]; then
            cross build -p beholder-cli --release --locked --target "$TARGET"
          else
            cargo build -p beholder-cli --release --locked --target "$TARGET"
          fi

      - name: Exercise the built binary
        shell: bash
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        env:
          BIN: ${{ matrix.bin_path }}
        run: |
          TAG="${GITHUB_REF##*/}"
          "$BIN" --version | grep -F "$TAG"
          "$BIN" --help | grep -F "structural code index"

      - name: Assemble deterministic release archive
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact_name }}
          BIN: ${{ matrix.bin_path }}
          EXT: ${{ matrix.archive_ext }}
        run: |
          python3 scripts/release/package-archive.py \
            --artifact "$ARTIFACT" \
            --binary "$BIN" \
            --format "$EXT" \
            --output "$ARTIFACT.$EXT"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: "beholder-*"
          path: dist
          merge-multiple: true

      - name: Generate portable checksums
        shell: bash
        run: |
          cd dist
          sha256sum \
            beholder-linux-arm64.tar.gz \
            beholder-linux-x86_64.tar.gz \
            beholder-macos-arm64.tar.gz \
            beholder-windows-x86_64.zip \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Extract the tag's changelog section
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          scripts/release/extract-release-notes.sh "$TAG" CHANGELOG.md release-notes.md

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          scripts/release/ensure-github-release.sh "$TAG" dist release-notes.md

  publish-crates:
    name: Publish crates.io packages
    needs: release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Publish or verify matching crates
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          python3 scripts/release/verify-versions.py --expected "$TAG"
          # Library first: beholder-cli cannot resolve until beholder is on the
          # index, which is what ensure-crate waits for rather than sleeping.
          scripts/release/ensure-crate.sh beholder "$TAG"
          scripts/release/ensure-crate.sh beholder-cli "$TAG"

  publish-npm:
    name: Publish npm launcher
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js for npmjs
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm client
        run: npm install --global npm@11.5.1
      - name: Verify launcher and exact package contents
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          python3 scripts/release/verify-versions.py --expected "$TAG"
          npm test --prefix npm
          npm pack ./npm --dry-run --json --ignore-scripts --userconfig=/dev/null
      - name: Publish or verify matching npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          scripts/release/ensure-npm.sh npm "$TAG"

  publish-homebrew-tap:
    name: Publish Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Download published release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # The formula's checksums must describe what a user will download, so
          # these come from the published release rather than the build.
          mkdir dist
          gh release download "$GITHUB_REF_NAME" \
            --dir dist \
            --pattern 'beholder-*' \
            --pattern SHA256SUMS
          gh release verify "$GITHUB_REF_NAME"
          for ASSET in dist/beholder-* dist/SHA256SUMS; do
            gh release verify-asset "$GITHUB_REF_NAME" "$ASSET"
          done
          cd dist
          sha256sum --check SHA256SUMS
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: wyrd-company/homebrew-tools
          path: homebrew-tools
          ssh-key: ${{ secrets.FORMULAE_PUBLISH_KEY }}
      - name: Generate, compare, and publish formula
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          FORMULA="homebrew-tools/Formula/beholder.rb"
          GENERATED="$RUNNER_TEMP/beholder.rb"
          scripts/release/render-homebrew-formula.sh "$TAG" dist "$GENERATED"

          if [[ -f "$FORMULA" ]]; then
            CURRENT_VERSION="$(sed -nE 's/^[[:space:]]*version "([^"]+)"/\1/p' "$FORMULA")"
            if [[ "$CURRENT_VERSION" == "$TAG" ]]; then
              if ! cmp --silent "$FORMULA" "$GENERATED"; then
                echo "Homebrew formula $TAG already exists with different contents." >&2
                exit 1
              fi
              echo "Homebrew formula $TAG already matches; skipping publication."
              exit 0
            fi
            HIGHEST="$(printf '%s\n%s\n' "$CURRENT_VERSION" "$TAG" | sort -V | tail -1)"
            if [[ "$HIGHEST" == "$CURRENT_VERSION" ]]; then
              echo "Refusing to replace newer Homebrew formula $CURRENT_VERSION with $TAG." >&2
              exit 1
            fi
          fi

          install -m 0644 "$GENERATED" "$FORMULA"
          cd homebrew-tools
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/beholder.rb
          git commit -m "beholder $TAG"
          git push origin HEAD

  verify-cargo-client:
    name: Verify clean Cargo client
    needs: publish-crates
    runs-on: ubuntu-latest
    steps:
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install the released CLI from crates.io
        shell: bash
        run: |
          INSTALL_ROOT="$(mktemp -d)"
          cargo install beholder-cli \
            --version "$GITHUB_REF_NAME" \
            --locked \
            --root "$INSTALL_ROOT"
          "$INSTALL_ROOT/bin/beholder" --version | grep -F "$GITHUB_REF_NAME"
          "$INSTALL_ROOT/bin/beholder" report --help | grep -F -- '--threshold'

  verify-npm-clients:
    name: Verify clean npm client (${{ matrix.os }})
    needs: publish-npm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install and exercise the released launcher
        shell: bash
        run: |
          npm install --global \
            "@wyrd-company/beholder@$GITHUB_REF_NAME" \
            --registry=https://registry.npmjs.org
          beholder --version | grep -F "$GITHUB_REF_NAME"
          beholder report --help | grep -F -- '--threshold'

  verify-homebrew-clients:
    name: Verify clean Homebrew client (${{ matrix.os }})
    needs: publish-homebrew-tap
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Install and exercise the released formula
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install wyrd-company/tools/beholder
          beholder --version | grep -F "$GITHUB_REF_NAME"
          beholder report --help | grep -F -- '--threshold'

  update-major-tag:
    name: Update major version tag
    needs:
      - verify-cargo-client
      - verify-homebrew-clients
      - verify-npm-clients
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update the major tag for stable releases
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          MAJOR="${TAG%%.*}"
          # Every 0.x bump may break, so nothing floats before 1.0 and
          # `uses: wyrd-company/beholder@<version>` stays exact.
          if [[ "$MAJOR" == "0" ]]; then
            echo "Skipping major tag update for pre-1.0 release $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
          git push origin "$MAJOR" --force
