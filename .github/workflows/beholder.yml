name: beholder

# Beholder reporting on beholder. Nothing here gates a merge: the comment and
# the annotations are the whole output.

on:
  pull_request:

permissions:
  contents: read # fetch source and stored results
  pull-requests: write # the one sticky comment
  security-events: write # SARIF annotations

concurrency:
  group: beholder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Reporting on a pull request means comparing against its merge base,
          # which a shallow clone does not have.
          fetch-depth: 0

      - id: beholder
        uses: ./
        with:
          comment: ${{ github.event.pull_request.head.repo.fork == false }}

      - if: github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ steps.beholder.outputs.sarif }}
