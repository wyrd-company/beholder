name: beholder

# Beholder reporting on beholder. Nothing here gates a merge: the comment and
# the annotations are the whole output.

on:
  pull_request:

permissions:
  contents: write # publishing refs/beholder/index back to the remote
  pull-requests: write # the one sticky comment
  security-events: write # SARIF annotations

concurrency:
  group: beholder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Reporting on a pull request means comparing against its merge base,
          # which a shallow clone does not have.
          fetch-depth: 0

      - id: beholder
        uses: ./

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: ${{ steps.beholder.outputs.sarif }}
