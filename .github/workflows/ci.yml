# ---
# relationships:
#   implements: publishing
# ---
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install workflow tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/mikefarah/yq/v4@v4.54.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: shellcheck
      - run: task ci
  corpus:
    name: Semantic-oracle corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # The corpus is a public repository, at the commit this repository pins.
      - run: git -c submodule.fixtures.update=checkout submodule update --init --depth 1 -- fixtures
      - run: cargo build --locked -p beholder-semantic-oracle-cli
      - run: python3 scripts/semantic-oracle/corpus.py --fixtures fixtures --binary target/debug/semantic-oracle
  platforms:
    name: Rust 1.90 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
        with:
          toolchain: 1.90.0
          components: rustfmt
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - run: npm test --prefix npm
