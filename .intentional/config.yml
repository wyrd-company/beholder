$schema: https://intentional.foo/schemas/config.yml
contract: contract-1

# What a version bump has to touch. Beholder ships one version through three
# manifests, and every one of them is checked against the tag before anything
# publishes; this file is what keeps them moving together rather than being
# caught apart. Tagging is intentional's; publication is the release workflow's.
settings:
  internal-dependency-bump: patch
  pre-1-0-bump-mapping: compatibility
release-units:
  beholder:
    path: .
    projections:
      - adapter: toml
        file: Cargo.toml
        pointer: /workspace/package/version
        mode: committed
      # The CLI reaches the library through the workspace table, so this pin is
      # what a published beholder-cli says it needs.
      - adapter: toml
        file: Cargo.toml
        pointer: /workspace/dependencies/beholder/version
        mode: committed
      - adapter: npm
        file: npm/package.json
        mode: committed
    tags:
      primary:
        role: primary
        template: "{version}"
