[workspace]
members = ["crates/beholder", "crates/beholder-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wyrd-company/beholder"
rust-version = "1.85"

[workspace.dependencies]
beholder = { path = "crates/beholder", version = "0.1.0" }
anyhow = "1"
git2 = "0.21"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
