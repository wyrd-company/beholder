[workspace]
members = ["crates/beholder", "crates/beholder-cli", "crates/beholder-oracle"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wyrd-company/beholder"
rust-version = "1.90"

[workspace.dependencies]
beholder = { path = "crates/beholder", version = "0.1.1" }
anyhow = "1"
# Pure Rust git. Two feature choices below are load-bearing and neither is the
# obvious one.
#
# `blocking-network-client` brings the transports. The http backend is named
# without a TLS feature on purpose: gix's own
# `blocking-http-transport-reqwest-rust-tls` resolves to `reqwest/rustls`, which
# turns on rustls's aws-lc-rs backend and builds `aws-lc-sys` — C, needing cmake,
# and harder to cross-compile than a pure Rust build should be.
# So the TLS stack is chosen here instead: reqwest with `rustls-no-provider`, and
# rustls with `ring`. `beholder::store::ensure_tls_provider` supplies the
# provider that `rustls-no-provider` deliberately leaves unset.
gix = { version = "0.90", features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.0"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
