version: '3'

tasks:
  build:
    desc: Compile every declared platform, feature, directive, and instrumentation context.
    cmds:
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -tags=fixture_extra ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -tags=fixture_legacy ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - GOOS=linux GOARCH=386 CGO_ENABLED=0 go build ./...
      - GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 go build ./...
      - GOOS=linux GOARCH=amd64 GOAMD64=v3 CGO_ENABLED=0 go build ./...
      - GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 go build ./...
      - GOOS=js GOARCH=wasm CGO_ENABLED=0 go build ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -race ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -cover ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -pgo=auto ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -gcflags=all=-d=checkptr=2 ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -trimpath ./...
      - go clean -cache
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -trimpath ./...
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -buildmode=pie -ldflags="-X main.BuildLabel=pie" -o /tmp/platform-bridge-pie ./cmd/bridge
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -buildmode=c-archive -ldflags="-X main.BuildLabel=archive" -o /tmp/platform-bridge.a ./cmd/bridge
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -buildmode=c-shared -ldflags="-X main.BuildLabel=shared" -o /tmp/platform-bridge.so ./cmd/bridge
  lint:
    desc: Check formatting and vet fixture-owned packages.
    cmds:
      - gofmt -l *.go cmd/bridge/*.go constraints/no-match/*.go internal/fast/*.go internal/secret/*.go testdata/*.go testdata/pre117/*.go testdata/.hidden/*.go testdata/_scratch/*.go
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go vet ./...
  test:
    desc: Run the ordinary Go test command.
    cmds:
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go test ./...
